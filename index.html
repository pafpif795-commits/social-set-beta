<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>No Cap</title>

<style>
*{box-sizing:border-box}

:root{
  --navy:#0b1f3a;
  --sky:#e9f6ff;
  --bg:#f4f9fd;
  --line:#d8e6f0;
  --text:#102033;
  --muted:#718397;
  --red:#ef4056;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button{
  border:0;
  cursor:pointer;
  font:inherit;
}

button:disabled{
  opacity:.6;
  cursor:default;
}

input,textarea{
  font-family:inherit;
}

/* AUTH */

#authScreen{
  position:relative;
  overflow:hidden;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#000;
}

.auth-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
}

.auth-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.2);
  z-index:1;
}

.auth-card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:420px;
  padding:32px;
  background:rgba(255,255,255,.95);
  border-radius:24px;
  box-shadow:0 25px 70px rgba(0,0,0,.35);
}

.brand{
  text-align:center;
  font-size:44px;
  font-weight:900;
  color:var(--navy);
  letter-spacing:-2px;
}

.tagline{
  text-align:center;
  color:var(--muted);
  margin:8px 0 25px;
}

.auth-form{display:none}

.auth-form h2{
  color:var(--navy);
  margin-top:0;
}

.auth-form input{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:1px solid var(--line);
  border-radius:11px;
  outline:none;
  font-size:15px;
}

.auth-form button,
.auth-choice button{
  width:100%;
  padding:13px;
  border-radius:11px;
  margin-top:10px;
  font-weight:700;
}

.primary{
  background:var(--navy);
  color:#fff;
}

.secondary{
  background:var(--sky);
  color:var(--navy);
}

.back-btn{
  background:transparent;
  color:var(--muted);
  margin-top:12px;
  padding:7px 0;
}

#authMessage{
  min-height:20px;
  margin-top:12px;
  color:var(--muted);
  font-size:14px;
}

/* APP */

#app{display:none;min-height:100vh}

header{
  height:64px;
  background:white;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:50;
}

.header-logo{
  font-size:23px;
  font-weight:900;
  color:var(--navy);
}

.logout{
  background:var(--navy);
  color:#fff;
  border-radius:10px;
  padding:9px 13px;
  font-size:13px;
  font-weight:700;
}

.container{
  max-width:650px;
  margin:20px auto 90px;
  padding:0 15px;
}

.page{display:none}
.page.active{display:block}

/* COMMON */

.create-post,
.post,
.profile-card,
.profile-wall,
.public-profile-card,
.search-box,
.search-user,
.conversations,
.follow-list,
.group-card{
  background:#fff;
  border:1px solid var(--line);
}

.create-post{
  padding:16px;
  border-radius:17px;
  margin-bottom:18px;
}

textarea{
  width:100%;
  min-height:90px;
  resize:vertical;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  outline:none;
  background:#fafdff;
  font-size:16px;
}

.publish{
  margin-top:10px;
  padding:11px 18px;
  border-radius:10px;
  background:var(--navy);
  color:#fff;
  font-weight:700;
}

.wall-empty,
.search-empty{
  color:var(--muted);
  text-align:center;
  padding:25px 10px;
}

/* POSTS */

.post{
  padding:16px;
  border-radius:17px;
  margin-bottom:15px;
}

.post-user{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
  cursor:pointer;
}

.mini-avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:var(--sky);
  border:1px solid var(--line);
  flex-shrink:0;
}

.mini-avatar-placeholder{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--navy);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  flex-shrink:0;
}

.user-name{
  color:var(--navy);
  font-weight:800;
}

.user-handle{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.post-text{
  font-size:16px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.post-image{
  display:block;
  width:100%;
  max-height:650px;
  object-fit:contain;
  border-radius:14px;
  margin-top:12px;
  background:#f1f3f5;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.reaction-btn{
  background:#fff;
  border:1px solid var(--line);
  color:var(--muted);
  border-radius:10px;
  padding:8px 12px;
  font-weight:700;
}

.reaction-btn.active{
  color:var(--red);
  border-color:#f1a0aa;
  background:#fff5f6;
}

.post-photo-tools{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:10px;
}

.photo-button{
  background:var(--sky);
  color:var(--navy);
  padding:9px 13px;
  border-radius:10px;
  font-weight:700;
}

.photo-name{
  color:var(--muted);
  font-size:13px;
  max-width:230px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.post-image-preview{
  display:none;
  margin-top:12px;
  position:relative;
}

.post-image-preview.has-image{display:block}

.post-image-preview img{
  width:100%;
  max-height:400px;
  object-fit:cover;
  border-radius:14px;
}

.remove-photo{
  position:absolute;
  right:8px;
  top:8px;
  width:34px;
  height:34px;
  border-radius:50%;
  background:rgba(0,0,0,.7);
  color:#fff;
}

/* PROFILE */

.profile-card,
.public-profile-card{
  border-radius:17px;
  overflow:hidden;
  margin-bottom:20px;
}

.cover,
.public-cover{
  height:140px;
  background:linear-gradient(135deg,#0b1f3a,#23608f,#62b7f5);
}

.profile-info,
.public-info{
  padding:0 18px 20px;
}

.big-avatar,
.public-avatar{
  width:110px;
  height:110px;
  margin-top:-55px;
  border-radius:50%;
  object-fit:cover;
  border:5px solid white;
  background:var(--sky);
  display:block;
}

.avatar-placeholder,
.public-avatar-placeholder{
  width:110px;
  height:110px;
  margin-top:-55px;
  border-radius:50%;
  border:5px solid white;
  background:var(--navy);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:900;
}

.profile-name,
.public-name{
  margin-top:12px;
  font-size:25px;
  font-weight:900;
  color:var(--navy);
  overflow-wrap:anywhere;
}

.profile-username,
.public-username{
  color:var(--muted);
  margin-top:3px;
}

.profile-bio,
.public-bio{
  margin-top:13px;
  line-height:1.5;
  white-space:pre-wrap;
}

.profile-stats,
.public-stats{
  display:flex;
  gap:28px;
  margin-top:18px;
}

.stat{
  cursor:pointer;
}

.stat-number{
  color:var(--navy);
  font-size:19px;
  font-weight:900;
}

.stat-label{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.profile-buttons,
.public-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:16px;
}

.profile-button,
.public-action{
  background:var(--sky);
  color:var(--navy);
  border-radius:10px;
  padding:10px 13px;
  font-weight:700;
}

.profile-button.dark,
.public-action.dark{
  background:var(--navy);
  color:#fff;
}

.public-action{
  flex:1;
}

.public-action.following{
  background:var(--navy);
  color:#fff;
}

.friend-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-top:12px;
  padding:7px 10px;
  border-radius:10px;
  background:#edf8ef;
  color:#23753a;
  font-size:13px;
  font-weight:800;
}

.profile-wall{
  border-radius:17px;
  padding:17px;
}

.wall-title{
  font-size:21px;
  font-weight:900;
  color:var(--navy);
  margin-bottom:14px;
}

.public-wall{margin-top:20px}

.public-back{
  background:transparent;
  color:var(--muted);
  padding:4px 0 12px;
  font-weight:700;
}

/* SEARCH */

.search-box{
  padding:15px;
  border-radius:17px;
  margin-bottom:15px;
}

.search-input{
  width:100%;
  padding:13px 15px;
  border:1px solid var(--line);
  border-radius:12px;
  outline:none;
  font-size:16px;
  background:#fafdff;
}

.search-results{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.search-user{
  padding:12px;
  border-radius:15px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
}

.search-avatar,
.message-result-avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
  background:var(--sky);
  flex-shrink:0;
}

.search-avatar-placeholder,
.message-result-placeholder{
  width:50px;
  height:50px;
  border-radius:50%;
  background:var(--navy);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  flex-shrink:0;
}

.search-user-name{
  color:var(--navy);
  font-weight:800;
}

.search-user-username{
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}

/* FOLLOWERS */

.follow-list{
  border-radius:17px;
  overflow:hidden;
}

.follow-list-header{
  padding:17px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid var(--line);
}

.follow-list-title{
  font-size:22px;
  font-weight:900;
  color:var(--navy);
}

.follow-back{
  background:var(--sky);
  color:var(--navy);
  padding:8px 11px;
  border-radius:10px;
  font-weight:700;
}

.follow-user{
  padding:12px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #edf1f4;
  cursor:pointer;
}

.follow-user:last-child{border-bottom:0}

.follow-user-info{
  flex:1;
  min-width:0;
}

.follow-user-name{
  font-weight:800;
  color:var(--navy);
}

.follow-user-username{
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}

.follow-status{
  font-size:12px;
  color:#23753a;
  font-weight:800;
}

/* MESSAGES */

.messages-title{
  font-size:30px;
  font-weight:900;
  color:#111;
  margin-bottom:17px;
}

.messages-search{
  position:relative;
  margin-bottom:12px;
}

.messages-search-input{
  width:100%;
  height:54px;
  padding:0 20px 0 50px;
  border:0;
  border-radius:28px;
  background:#e9e9ed;
  outline:none;
  font-size:17px;
}

.messages-search-icon{
  position:absolute;
  left:18px;
  top:50%;
  transform:translateY(-50%);
  font-size:22px;
  color:#555;
}

.conversations{
  border-radius:18px;
  overflow:hidden;
}

.conversation{
  min-height:85px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #e5e5e5;
  cursor:pointer;
}

.conversation:last-child{border-bottom:0}

.conversation-avatar{
  width:58px;
  height:58px;
  border-radius:50%;
  object-fit:cover;
  background:var(--sky);
}

.conversation-placeholder{
  width:58px;
  height:58px;
  border-radius:50%;
  background:var(--navy);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  font-weight:900;
}

.conversation-main{
  flex:1;
  min-width:0;
}

.conversation-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.conversation-name{
  font-size:17px;
  font-weight:800;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.conversation-time{
  color:#777;
  font-size:12px;
}

.conversation-preview{
  color:#777;
  margin-top:5px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.message-user-result{
  background:#fff;
  border-bottom:1px solid #e5e5e5;
  padding:12px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
}

/* GROUP CHAT */

.group-create-button{
  width:100%;
  margin-bottom:12px;
  padding:12px;
  border-radius:12px;
  background:var(--navy);
  color:#fff;
  font-weight:800;
}

.group-card{
  border-radius:18px;
  overflow:hidden;
  margin-bottom:12px;
}

.group-card-main{
  padding:13px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
}

.group-icon{
  width:58px;
  height:58px;
  border-radius:50%;
  background:var(--sky);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  flex-shrink:0;
}

.group-info{
  min-width:0;
  flex:1;
}

.group-name{
  font-weight:900;
  color:var(--navy);
}

.group-members{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.group-create-list{
  max-height:400px;
  overflow:auto;
  margin-top:10px;
  border:1px solid var(--line);
  border-radius:12px;
}

.friend-select{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-bottom:1px solid #edf1f4;
}

.friend-select:last-child{border-bottom:0}

.friend-select input{
  width:18px;
  height:18px;
}

.friend-select-info{
  flex:1;
}

/* CHAT */

.chat-page{
  height:calc(100vh - 154px);
  height:calc(100dvh - 154px);
  flex-direction:column;
}

.chat-page.active{display:flex}

.chat-header{
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  padding:10px;
  display:flex;
  align-items:center;
  gap:10px;
}

.chat-back{
  background:transparent;
  color:var(--navy);
  font-size:28px;
  padding:3px 7px;
}

.chat-avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  object-fit:cover;
}

.chat-avatar-placeholder{
  width:43px;
  height:43px;
  border-radius:50%;
  background:var(--navy);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.chat-user-info{
  min-width:0;
}

.chat-user-name{
  color:var(--navy);
  font-weight:900;
}

.chat-user-username{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.chat-messages{
  flex:1;
  overflow-y:auto;
  padding:15px 4px;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.message-row{
  display:flex;
}

.message-row.mine{justify-content:flex-end}
.message-row.theirs{justify-content:flex-start}

.message-bubble{
  max-width:78%;
  padding:10px 13px;
  border-radius:18px;
  line-height:1.35;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.mine .message-bubble{
  background:var(--navy);
  color:#fff;
  border-bottom-right-radius:5px;
}

.theirs .message-bubble{
  background:#fff;
  border:1px solid var(--line);
  border-bottom-left-radius:5px;
}

.message-time{
  margin-top:4px;
  font-size:10px;
  opacity:.65;
  text-align:right;
}

.chat-input-area{
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  padding:8px;
  display:flex;
  gap:8px;
}

.chat-input{
  flex:1;
  min-height:44px;
  max-height:110px;
  resize:none;
  border:0;
  background:#f1f3f5;
  border-radius:22px;
  padding:11px 15px;
  outline:none;
}

.chat-send{
  width:44px;
  height:44px;
  border-radius:50%;
  background:var(--navy);
  color:#fff;
}

/* NAV */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:68px;
  background:rgba(255,255,255,.96);
  border-top:1px solid var(--line);
  z-index:40;
  backdrop-filter:blur(12px);
}

.nav-inner{
  max-width:650px;
  height:100%;
  margin:auto;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-button{
  background:transparent;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  min-width:65px;
  padding:7px 4px;
  font-size:11px;
  font-weight:700;
}

.nav-icon{font-size:21px}
.nav-button.active{color:var(--navy)}

/* MODALS */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(11,31,58,.45);
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal.active{display:flex}

.modal-card{
  width:100%;
  max-width:430px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.modal-card h2{
  color:var(--navy);
  margin-top:0;
}

.modal-card input,
.modal-card textarea{
  width:100%;
  margin-top:10px;
}

.modal-card input{
  padding:13px;
  border:1px solid var(--line);
  border-radius:11px;
  outline:none;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.modal-actions button{
  flex:1;
  padding:11px;
  border-radius:10px;
  font-weight:700;
}

.cancel{
  background:var(--sky);
  color:var(--navy);
}

@media(max-width:700px){
  .container{margin-top:14px}
  .auth-card{padding:25px}
  .brand{font-size:38px}
  .cover,.public-cover{height:125px}
}
</style>
</head>

<body>

<!-- AUTH -->

<section id="authScreen">

<video class="auth-video" autoplay muted loop playsinline preload="auto">
<source src="https://jrzoexmvgyyitojbcxvr.supabase.co/storage/v1/object/public/Stenka/auth-bg.mp4/3992627239181363251.mp4" type="video/mp4">
</video>

<div class="auth-overlay"></div>

<div class="auth-card">

<div class="brand">No Cap</div>
<div class="tagline">Своя соцсеть. Без лишнего.</div>

<div id="authChoice">
<button class="primary" onclick="showAuthForm('login')">Войти</button>
<button class="secondary" onclick="showAuthForm('signup')">Создать аккаунт</button>
</div>

<div id="loginForm" class="auth-form">
<h2>Войти</h2>

<input id="loginEmail" type="email" placeholder="Email">
<input id="loginPassword" type="password" placeholder="Пароль">

<button class="primary" onclick="signIn()" id="loginButton">Войти</button>
<button class="back-btn" onclick="showAuthChoice()">← Назад</button>
</div>

<div id="signupForm" class="auth-form">
<h2>Создать аккаунт</h2>

<input id="signupUsername" placeholder="Username" maxlength="30">
<input id="signupEmail" type="email" placeholder="Email">

<script>

/* =========================================================

const SUPABASE_URL="https://jrzoexmvgyyitojbcxvr.supabase.co";

const SUPABASE_KEY="sb_publishable_NGzwO7npRZMNPeTSXHNLbQ_TO5apgSJ";

const baseHeaders={
  apikey:SUPABASE_KEY,
  "Content-Type":"application/json"
};

function authHeaders(){
  return{
    ...baseHeaders,
    Authorization:"Bearer "+(
      localStorage.getItem("access_token")||SUPABASE_KEY
    )
  };
}


/* =========================================================

let currentChatUser=null;
let currentGroupChat=null;

/* =========================================================

function showAuthChoice(){
  document.getElementById("authChoice").style.display="block";
  document.getElementById("loginForm").style.display="none";
  document.getElementById("signupForm").style.display="none";
  document.getElementById("authMessage").textContent="";
}

function showAuthForm(type){
  document.getElementById("authChoice").style.display="none";
  document.getElementById("loginForm").style.display=type==="login"?"block":"none";
  document.getElementById("signupForm").style.display=type==="signup"?"block":"none";
  document.getElementById("authMessage").textContent="";
}

function clearSession(){
  localStorage.removeItem("access_token");
  localStorage.removeItem("user_id");
}

async function signUp(){

  const username=document.getElementById("signupUsername").value.trim();
  const email=document.getElementById("signupEmail").value.trim();
  const password=document.getElementById("signupPassword").value;
  const message=document.getElementById("authMessage");
  const button=document.getElementById("signupButton");

  if(!username||!email||!password){
    message.textContent="Заполни все поля.";
    return;
  }

  if(!/^[a-zA-Z0-9_.-]+$/.test(username)){
    message.textContent="Username: только латиница, цифры, _ . -";
    return;
  }

  if(username.length<3){
    message.textContent="Username должен быть минимум 3 символа.";
    return;
  }

  if(password.length<6){
    message.textContent="Пароль должен быть минимум 6 символов.";
    return;
  }

  button.disabled=true;
  message.textContent="Создаём аккаунт...";

  try{

    const response=await fetch(
      SUPABASE_URL+"/auth/v1/signup",
      {
        method:"POST",
        headers:baseHeaders,
        body:JSON.stringify({email,password})
      }
    );

    const data=await response.json();

    if(!response.ok){
      message.textContent=data.msg||data.message||data.error_description||"Ошибка регистрации.";
      return;
    }

    if(!data.user){
      message.textContent="Не удалось создать пользователя.";
      return;
    }

    if(!data.access_token){
      message.textContent="Аккаунт создан. Теперь войди.";
      showAuthForm("login");
      document.getElementById("loginEmail").value=email;
      return;
    }

    localStorage.setItem("access_token",data.access_token);
    localStorage.setItem("user_id",data.user.id);

    const ok=await createProfile(data.user.id,username);

    if(!ok){
      clearSession();
      message.textContent="Аккаунт создан, но профиль не создался.";
      return;
    }

    await showApp();

  }catch(e){
    console.error(e);
    message.textContent="Ошибка соединения.";
  }finally{
    button.disabled=false;
  }
}

async function signIn(){

  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPassword").value;
  const message=document.getElementById("authMessage");
  const button=document.getElementById("loginButton");

  if(!email||!password){
    message.textContent="Введите email и пароль.";
    return;
  }

  button.disabled=true;
  message.textContent="Входим...";

  try{

    const response=await fetch(
      SUPABASE_URL+"/auth/v1/token?grant_type=password",
      {
        method:"POST",
        headers:baseHeaders,
        body:JSON.stringify({email,password})
      }
    );

    const data=await response.json();

    if(!response.ok){
      message.textContent=data.msg||data.message||data.error_description||"Неверный email или пароль.";
      return;
    }

    localStorage.setItem("access_token",data.access_token);
    localStorage.setItem("user_id",data.user.id);

    await showApp();

  }catch(e){
    console.error(e);
    message.textContent="Ошибка соединения.";
  }finally{
    button.disabled=false;
  }
}

async function validateSession(){

  const token=localStorage.getItem("access_token");
  const userId=localStorage.getItem("user_id");

  if(!token||!userId)return false;

  try{

    const response=await fetch(
      SUPABASE_URL+"/auth/v1/user",
      {
        headers:{
          apikey:SUPABASE_KEY,
          Authorization:"Bearer "+token
        }
      }
    );

    if(!response.ok){
      clearSession();
      return false;
    }

    const user=await response.json();

    if(user.id!==userId){
      clearSession();
      return false;
    }

    return true;

  }catch{
    return false;
  }
}

function signOut(){
  stopChatPolling();
  currentChatUser=null;
  currentGroupChat=null;
  publicProfile=null;
  clearSession();
  profilesCache=null;
  showAuth();
}


/* =========================================================
   PROFILE
========================================================= */

async function createProfile(id,username){

  try{

    const response=await fetch(
      SUPABASE_URL+"/rest/v1/profiles",
      {
        method:"POST",
        headers:{
          ...authHeaders(),
          Prefer:"return=minimal"
        },
        body:JSON.stringify({
          id,
          username,
          display_name:username,
          bio:"",
          avatar_url:"",
          cover_url:""
        })
      }
    );

    if(response.ok){
      profilesCache=null;
      return true;
    }

    console.error(await response.text());
    return false;

  }catch(e){
    console.error(e);
    return false;
  }
}

async function loadProfile(){

  const id=localStorage.getItem("user_id");
  if(!id)return null;

  try{

    const response=await fetch(
      SUPABASE_URL+"/rest/v1/profiles?id=eq."+encodeURIComponent(id)+"&select=*",
      {headers:authHeaders()}
    );

    if(!response.ok)return null;

    const rows=await response.json();
    if(!rows.length)return null;

    const profile=rows[0];
    window.currentProfile=profile;

    document.getElementById("profileName").textContent=
      profile.display_name||profile.username;

    document.getElementById("profileUsername").textContent=
      "@"+profile.username;

    document.getElementById("profileBio").textContent=
      profile.bio||"Описание профиля пока не добавлено.";

    renderAvatar("profileAvatarContainer",profile,"big");

    await loadFollowStats(id,"myFollowersCount","myFollowingCount");

    return profile;

  }catch(e){
    console.error(e);
    return null;
  }
}

function renderAvatar(containerId,profile,type){

  const container=document.getElementById(containerId);
  if(!container)return;

  container.innerHTML="";

  if(profile.avatar_url){

    const img=document.createElement("img");
    img.src=profile.avatar_url;
    img.alt="";
    img.loading="lazy";

    img.className=
      type==="big"?"big-avatar":
      type==="public"?"public-avatar":
      type==="chat"?"chat-avatar":
      "mini-avatar";

    container.appendChild(img);
    return;
  }

  const div=document.createElement("div");

  div.className=
    type==="big"?"avatar-placeholder":
    type==="public"?"public-avatar-placeholder":
    type==="chat"?"chat-avatar-placeholder":
    "mini-avatar-placeholder";

  div.textContent=(
    profile.display_name||
    profile.username||
    "N"
  ).charAt(0).toUpperCase();

  container.appendChild(div);
}

function chooseAvatar(){
  document.getElementById("avatarInput").click();
}

async function uploadAvatar(){

  const input=document.getElementById("avatarInput");
  const file=input.files[0];

  if(!file)return;

  if(!file.type.startsWith("image/")){
    alert("Можно загружать только изображения.");
    input.value="";
    return;
  }

  if(file.size>10*1024*1024){
    alert("Максимальный размер: 10 МБ.");
    input.value="";
    return;
  }

  const id=localStorage.getItem("user_id");

  try{

    const prepared=await prepareImageForUpload(file);
    const ext=getImageExtension(prepared.type,file.name);

    const path=id+"/"+Date.now()+"-avatar."+ext;

    const upload=await uploadToStorage(path,prepared);

    if(!upload.ok){
      alert("Ошибка загрузки:\n"+upload.text);
      return;
    }

    const url=
      SUPABASE_URL+
      "/storage/v1/object/public/Stenka/"+
      path;

    const response=await fetch(
      SUPABASE_URL+"/rest/v1/profiles?id=eq."+encodeURIComponent(id),
      {
        method:"PATCH",
        headers:{
          ...authHeaders(),
          Prefer:"return=representation"
        },
        body:JSON.stringify({avatar_url:url})
      }
    );

    if(!response.ok){
      alert("Фото загрузилось, но профиль не обновился.");
      return;
    }

    profilesCache=null;
    input.value="";
    await loadProfile();

  }catch(e){
    console.error(e);
    alert("Ошибка загрузки аватарки.");
  }
}

function openProfileEditor(){

  const p=window.currentProfile;

  if(!p){
    alert("Профиль ещё загружается.");
    return;
  }

  document.getElementById("editDisplayName").value=p.display_name||p.username;
  document.getElementById("editUsername").value=p.username||"";
  document.getElementById("editBio").value=p.bio||"";

  document.getElementById("profileModal").classList.add("active");

function closeProfileEditor(){
  document.getElementById("profileModal").classList.remove("active");

async function saveProfile(){

  const id=localStorage.getItem("user_id");

  const display_name=document.getElementById("editDisplayName").value.trim();
  const username=document.getElementById("editUsername").value.trim();
  const bio=document.getElementById("editBio").value.trim();

  }

  if(!/^[a-zA-Z0-9_.-]+$/.test(username)){
    alert("Username: только латиница, цифры, _ . -");
    return;
  }

  try{

    const response=await fetch(
      SUPABASE_URL+"/rest/v1/profiles?id=eq."+encodeURIComponent(id),
      {
        method:"PATCH",
        headers:{
          ...authHeaders(),
          Prefer:"return=representation"
        },
        body:JSON.stringify({

        })

      }

/* =========================================================
   FOLLOW SYSTEM
========================================================= */

async function loadFollowStats(userId,followersId,followingId){

  try{

    const [a,b]=await Promise.all([

      fetch(
        SUPABASE_URL+"/rest/v1/follows?following_id=eq."+encodeURIComponent(userId)+"&select=follower_id",
        {headers:authHeaders()}
      ),

      fetch(
        SUPABASE_URL+"/rest/v1/follows?follower_id=eq."+encodeURIComponent(userId)+"&select=following_id",
        {headers:authHeaders()}
      )

    ]);

    if(a.ok){
      document.getElementById(followersId).textContent=(await a.json()).length;
    }

    if(b.ok){
      document.getElementById(followingId).textContent=(await b.json()).length;
    }

  }catch(e){
    console.error(e);
  }
}

async function isFollowing(target){

  const me=localStorage.getItem("user_id");

  if(!me||me===target)return false;

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/follows?follower_id=eq."+
      encodeURIComponent(me)+
      "&following_id=eq."+
      encodeURIComponent(target)+
      "&select=follower_id",
      {headers:authHeaders()}
    );

    if(!response.ok)return false;

    return (await response.json()).length>0;

  }catch{
    return false;
  }
}

async function isFriend(target){

  const me=localStorage.getItem("user_id");

  if(!me||me===target)return false;

  try{

    const [a,b]=await Promise.all([

      fetch(
        SUPABASE_URL+
        "/rest/v1/follows?follower_id=eq."+
        encodeURIComponent(me)+
        "&following_id=eq."+
        encodeURIComponent(target)+
        "&select=follower_id",
        {headers:authHeaders()}
      ),

      fetch(
        SUPABASE_URL+
        "/rest/v1/follows?follower_id=eq."+
        encodeURIComponent(target)+
        "&following_id=eq."+
        encodeURIComponent(me)+
        "&select=follower_id",
        {headers:authHeaders()}
      )

    ]);

    if(!a.ok||!b.ok)return false;

    return(
      (await a.json()).length>0 &&
      (await b.json()).length>0
    );

  }catch{
    return false;
  }
}

async function toggleFollow(target){

  const me=localStorage.getItem("user_id");

  if(!me||me===target)return;

  try{

    const following=await isFollowing(target);

    if(following){

      const response=await fetch(
        SUPABASE_URL+
        "/rest/v1/follows?follower_id=eq."+
        encodeURIComponent(me)+
        "&following_id=eq."+
        encodeURIComponent(target),
        {
          method:"DELETE",
          headers:authHeaders()
        }
      );

      if(!response.ok){
        alert("Не удалось отписаться.");
        return;
      }

    }else{

      const response=await fetch(
        SUPABASE_URL+"/rest/v1/follows",
        {
          method:"POST",
          headers:{
            ...authHeaders(),
            Prefer:"return=minimal"
          },
          body:JSON.stringify({
            follower_id:me,
            following_id:target
          })
        }
      );

      if(!response.ok){
        const text=await response.text();

        if(!text.includes("23505")&&!text.includes("duplicate")){
          alert("Не удалось подписаться:\n"+text);
          return;
        }
      }
    }

    await renderPublicActions(target);

    if(publicProfile){
      await loadFollowStats(
        target,
        "publicFollowersCount",
        "publicFollowingCount"
      );
    }

    await loadFollowStats(
      me,
      "myFollowersCount",
      "myFollowingCount"
    );

  }catch(e){
    console.error(e);
    alert("Ошибка подписки.");
  }
}

      "&select="+selectColumn,
      {headers:authHeaders()}

function appendFollowAvatar(container,profile){

  if(profile.avatar_url){

    const img=document.createElement("img");
    img.className="search-avatar";
    img.src=profile.avatar_url;
    img.alt="";
    container.appendChild(img);

    container.appendChild(d);

async function getProfilesByIds(ids){

  if(!ids.length)return [];

  const unique=[...new Set(ids)];

  const filter=unique
    .map(id=>`id.eq.${id}`)
    .join(",");

  const response=await fetch(
    SUPABASE_URL+
    "/rest/v1/profiles?or="+
    encodeURIComponent("("+filter+")")+
    "&select=id,username,display_name,avatar_url",
    {headers:authHeaders()}
  );

  if(!response.ok)return [];

  const rows=await response.json();

  const map={};
  rows.forEach(p=>map[p.id]=p);

  return unique
    .map(id=>map[id])
    .filter(Boolean);
}

async function loadProfilesMap(force=false){

  if(
    !force &&
    profilesCache &&
    Date.now()-profilesCacheTime<PROFILE_CACHE_TIME
  ){
    return profilesCache;
  }

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/profiles?select=id,username,display_name,avatar_url",
      {headers:authHeaders()}
    );

    if(!response.ok)return profilesCache||{};

    const rows=await response.json();
    const map={};

    rows.forEach(p=>map[p.id]=p);

    profilesCache=map;
    profilesCacheTime=Date.now();

    return map;

  }catch{
    return profilesCache||{};
  }
}

function renderPost(post,container,profiles){

  const profile=profiles[post.user_id];

  const username=profile?.username||post.username||"user";
  const display=profile?.display_name||username;

  const div=document.createElement("div");
  div.className="post";

  const user=document.createElement("div");
  user.className="post-user";

  if(profile){

    user.onclick=()=>openFoundProfile(profile);

    if(profile.avatar_url){

      const img=document.createElement("img");
      img.className="mini-avatar";
      img.src=profile.avatar_url;
      img.alt="";
      user.appendChild(img);

    }else{

      const a=document.createElement("div");
      a.className="mini-avatar-placeholder";
      a.textContent=display.charAt(0).toUpperCase();
      user.appendChild(a);
    }

  }

  const info=document.createElement("div");

  const name=document.createElement("div");
  name.className="user-name";
  name.textContent=display;

  const handle=document.createElement("div");
  handle.className="user-handle";
  handle.textContent="@"+username;

  info.appendChild(name);
  info.appendChild(handle);
  user.appendChild(info);
  div.appendChild(user);

  if(post.content){

    const text=document.createElement("div");
    text.className="post-text";
    text.textContent=post.content;
    div.appendChild(text);
  }

  if(post.image_url&&isAllowedImageUrl(post.image_url)){

    const img=document.createElement("img");
    img.className="post-image";
    img.src=post.image_url;
    img.loading="lazy";
    img.alt="Фото";
    div.appendChild(img);
  }

  const actions=document.createElement("div");
  actions.className="actions";

  const reaction=localStorage.getItem("reaction_"+post.id);

  const like=document.createElement("button");
  like.className="reaction-btn"+(reaction==="like"?" active":"");
  like.textContent="👍 "+Number(post.likes||0);
  like.onclick=()=>reactToPost(post.id,"like");

  const dislike=document.createElement("button");
  dislike.className="reaction-btn"+(reaction==="dislike"?" active":"");
  dislike.textContent="👎 "+Number(post.dislikes||0);
  dislike.onclick=()=>reactToPost(post.id,"dislike");

  actions.appendChild(like);
  actions.appendChild(dislike);
  div.appendChild(actions);

  container.appendChild(div);

function previewPostImage(event,type){

  const input=event.target;

  );

    type==="wall"?"wallImageName":"postImageName"

    return;
  }

  if(file.size>10*1024*1024){
    alert("Максимальный размер: 10 МБ.");
    input.value="";
    return;
  }

  name.textContent=file.name;

  const reader=new FileReader();

  reader.onload=()=>{

    const img=document.createElement("img");
    img.src=reader.result;

    const remove=document.createElement("button");

    remove.textContent="×";

    preview.appendChild(img);
    preview.appendChild(remove);
    preview.classList.add("has-image");

  const input=document.getElementById(
    type==="wall"?"wallImageInput":"postImageInput"
  );

function getImageExtension(mime,name){

  if(mime==="image/jpeg")return"jpg";
  if(mime==="image/png")return"png";
  if(mime==="image/webp")return"webp";
  if(mime==="image/gif")return"gif";

  return(
    name.split(".").pop()?.toLowerCase()||"jpg"
  );
}

function loadImage(file){

  return new Promise((resolve,reject)=>{

    const url=URL.createObjectURL(file);
    const image=new Image();

    image.onload=()=>{
      URL.revokeObjectURL(url);
      resolve(image);
    };

    image.onerror=()=>{
      URL.revokeObjectURL(url);
      reject();
    };

    image.src=url;
  });
}

async function prepareImageForUpload(file){

  if(
    !["image/jpeg","image/png","image/webp"].includes(file.type)||
    file.size<1200000
  ){
    return file;
  }

  try{

    const image=await loadImage(file);
    const max=2000;

    const scale=Math.min(
      1,
      max/Math.max(image.naturalWidth,image.naturalHeight)
    );

    const canvas=document.createElement("canvas");

    canvas.width=Math.round(image.naturalWidth*scale);
    canvas.height=Math.round(image.naturalHeight*scale);

    canvas.getContext("2d").drawImage(
      image,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const blob=await new Promise(resolve=>
      canvas.toBlob(resolve,"image/jpeg",.82)
    );

    if(!blob)return file;

    return new File(
      [blob],
      "photo.jpg",
      {type:"image/jpeg"}
    );

  }catch{
    return file;
  }
}

async function uploadToStorage(path,file){

async function createPostInDatabase(text,file){

  const userId=localStorage.getItem("user_id");

  if(!userId)return false;

  let uploadedPath=null;

  try{

    let imageUrl=null;

    if(file){

      const prepared=await prepareImageForUpload(file);
      const ext=getImageExtension(prepared.type,file.name);

      uploadedPath=
        "posts/"+userId+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+ext;

      const upload=await uploadToStorage(uploadedPath,prepared);

      if(!upload.ok){
        alert("Не удалось загрузить фото:\n"+upload.text);
        return false;
      }

      imageUrl=
        SUPABASE_URL+
        "/storage/v1/object/public/Stenka/"+
        uploadedPath;
    }

    const response=await fetch(
      SUPABASE_URL+"/rest/v1/posts",
      {
        method:"POST",
        headers:{
          ...authHeaders(),
          Prefer:"return=minimal"
        },
        body:JSON.stringify({
          user_id:userId,
          username:window.currentProfile?.username||"you",
          content:text||"",
          image_url:imageUrl
        })
      }
    );

    if(!response.ok){

      if(uploadedPath)await deleteStorageFile(uploadedPath);

      alert("Не удалось создать пост:\n"+await response.text());
      return false;
    }

    return true;

  }catch(e){

    if(uploadedPath)await deleteStorageFile(uploadedPath);

    console.error(e);
    alert("Ошибка публикации.");
    return false;
  }
}

/* =========================================================
   REACTIONS
========================================================= */

async function reactToPost(id,type){

  const old=localStorage.getItem("reaction_"+id);

  let like=0;
  let dislike=0;

  if(old===type){

    if(type==="like")like=-1;
    else dislike=-1;

    localStorage.removeItem("reaction_"+id);

  }else{

    if(old==="like")like=-1;
    if(old==="dislike")dislike=-1;

    if(type==="like")like++;
    else dislike++;

    localStorage.setItem("reaction_"+id,type);
  }

  try{

    const get=await fetch(
      SUPABASE_URL+"/rest/v1/posts?id=eq."+encodeURIComponent(id)+"&select=likes,dislikes",
      {headers:authHeaders()}
    );

    if(!get.ok)return;

    const rows=await get.json();
    if(!rows.length)return;

    const post=rows[0];

    const response=await fetch(
      SUPABASE_URL+"/rest/v1/posts?id=eq."+encodeURIComponent(id),
      {
        method:"PATCH",
        headers:{
          ...authHeaders(),
          Prefer:"return=minimal"
        },
        body:JSON.stringify({
          likes:Math.max(0,Number(post.likes||0)+like),
          dislikes:Math.max(0,Number(post.dislikes||0)+dislike)
        })
      }
    );

    if(!response.ok)return;

    await loadPosts();

  }catch(e){
    console.error(e);
  }
}

async function loadConversations(){

  const me=localStorage.getItem("user_id");
  const container=document.getElementById("conversations");

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/messages?or="+
      encodeURIComponent(
        "(sender_id.eq."+me+",receiver_id.eq."+me+")"
      )+
      "&select=*&order=created_at.desc&limit=500",
      {headers:authHeaders()}
    );

    if(!response.ok)throw new Error();

    const messages=await response.json();

    const profiles=await loadProfilesMap();
    const map={};

    messages.forEach(m=>{

      const other=
        m.sender_id===me
          ?m.receiver_id
          :m.sender_id;

      if(!map[other])map[other]=m;
    });

    container.innerHTML="";

    if(!Object.keys(map).length){
      container.innerHTML='<div class="search-empty">Пока нет сообщений.</div>';
      return;
    }

    Object.entries(map).forEach(([id,message])=>{

      const profile=profiles[id];
      if(!profile)return;

      const item=document.createElement("div");
      item.className="conversation";
      item.onclick=()=>openChatWithUser(profile);

      if(profile.avatar_url){

        const img=document.createElement("img");
        img.className="conversation-avatar";
        img.src=profile.avatar_url;
        item.appendChild(img);

      }else{

        const a=document.createElement("div");
        a.className="conversation-placeholder";
        a.textContent=(profile.display_name||profile.username).charAt(0).toUpperCase();
        item.appendChild(a);
      }

      const main=document.createElement("div");
      main.className="conversation-main";

      const top=document.createElement("div");
      top.className="conversation-top";

      const name=document.createElement("div");
      name.className="conversation-name";
      name.textContent=profile.display_name||profile.username;

      const time=document.createElement("div");
      time.className="conversation-time";
      time.textContent=formatMessageTime(message.created_at);

      top.appendChild(name);
      top.appendChild(time);

      const preview=document.createElement("div");
      preview.className="conversation-preview";
      preview.textContent=message.content||"";

      main.appendChild(top);
      main.appendChild(preview);

      item.appendChild(main);
      container.appendChild(item);
    });

  }catch(e){

    console.error(e);
    container.innerHTML='<div class="search-empty">Не удалось загрузить сообщения.</div>';
  }
}

function searchMessageUsers(){

  clearTimeout(messageSearchTimer);
  messageSearchTimer=setTimeout(performMessageSearch,250);
}

async function performMessageSearch(){

  const q=document.getElementById("messageSearchInput").value.trim();
  const results=document.getElementById("messageSearchResults");
  const conversations=document.getElementById("conversations");

  if(!q){

    results.style.display="none";
    conversations.style.display="block";
    await loadConversations();
    return;
  }

  results.style.display="block";
  conversations.style.display="none";
  results.innerHTML='<div class="search-empty">Ищем...</div>';

  try{

    const safe=q.replace(/[,*()]/g,"");
    const pattern="*"+safe+"*";

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/profiles?or="+
      encodeURIComponent(
        "(username.ilike."+pattern+",display_name.ilike."+pattern+")"
      )+
      "&select=id,username,display_name,avatar_url&limit=20",
      {headers:authHeaders()}
    );

    const rows=await response.json();
    const me=localStorage.getItem("user_id");

    results.innerHTML="";

    rows
      .filter(p=>p.id!==me)
      .forEach(profile=>{

        const item=document.createElement("div");
        item.className="message-user-result";
        item.onclick=()=>openChatWithUser(profile);

        appendFollowAvatar(item,profile);

        const info=document.createElement("div");

        const name=document.createElement("div");
        name.className="search-user-name";
        name.textContent=profile.display_name||profile.username;

        const username=document.createElement("div");
        username.className="search-user-username";
        username.textContent="@"+profile.username;

        info.appendChild(name);
        info.appendChild(username);
        item.appendChild(info);

        results.appendChild(item);
      });

    if(!results.children.length){
      results.innerHTML='<div class="search-empty">Пользователь не найден.</div>';
    }

  }catch(e){

    results.innerHTML='<div class="search-empty">Ошибка поиска.</div>';
  }
}


/* =========================================================
   CHAT
========================================================= */

async function openChatWithUser(profile){

  if(!profile?.id)return;

  currentChatUser=profile;
  currentGroupChat=null;

  showPage("chat");
  renderDirectChatHeader(profile);

  document.getElementById("chatInput").value="";

  await loadDirectMessages();
  startChatPolling();
}

function renderDirectChatHeader(profile){

  const header=document.getElementById("chatHeader");

  header.innerHTML="";

  const back=document.createElement("button");
  back.className="chat-back";
  back.textContent="‹";
  back.onclick=closeChat;

  header.appendChild(back);

  if(profile.avatar_url){

    const img=document.createElement("img");
    img.className="chat-avatar";
    img.src=profile.avatar_url;
    header.appendChild(img);

  }else{

    const a=document.createElement("div");
    a.className="chat-avatar-placeholder";
    a.textContent=(profile.display_name||profile.username).charAt(0).toUpperCase();
    header.appendChild(a);
  }

  const info=document.createElement("div");

  const name=document.createElement("div");
  name.className="chat-user-name";
  name.textContent=profile.display_name||profile.username;

  const username=document.createElement("div");
  username.className="chat-user-username";
  username.textContent="@"+profile.username;

  info.appendChild(name);
  info.appendChild(username);
  header.appendChild(info);
}

async function loadDirectMessages(){

  if(!currentChatUser)return;

  const me=localStorage.getItem("user_id");
  const other=currentChatUser.id;
  const container=document.getElementById("chatMessages");

  try{

    const filter=
      "(and(sender_id.eq."+me+",receiver_id.eq."+other+"),and(sender_id.eq."+other+",receiver_id.eq."+me+"))";

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/messages?or="+encodeURIComponent(filter)+
      "&select=*&order=created_at.asc&limit=500",
      {headers:authHeaders()}
    );

    if(!response.ok)throw new Error();

    const messages=await response.json();

    container.innerHTML="";

    if(!messages.length){
      container.innerHTML='<div class="chat-empty">Здесь пока пусто.<br>Напиши первое сообщение.</div>';
      return;
    }

    messages.forEach(m=>renderMessage(m,me));

    container.scrollTop=container.scrollHeight;

  }catch(e){

    container.innerHTML='<div class="chat-empty">Не удалось загрузить сообщения.</div>';
  }
}

function renderMessage(message,me){

  const row=document.createElement("div");
  row.className="message-row "+(
    message.sender_id===me?"mine":"theirs"
  );

  const bubble=document.createElement("div");
  bubble.className="message-bubble";

  bubble.textContent=message.content;

  const time=document.createElement("div");
  time.className="message-time";
  time.textContent=formatChatTime(message.created_at);

  bubble.appendChild(time);
  row.appendChild(bubble);

  document.getElementById("chatMessages").appendChild(row);
}

async function sendMessage(){

  const input=document.getElementById("chatInput");
  const content=input.value.trim();

  if(!content)return;

  const me=localStorage.getItem("user_id");

  input.disabled=true;

  try{

    let url;
    let body;

    if(currentGroupChat){

      url=SUPABASE_URL+"/rest/v1/group_messages";

      body={
        chat_id:currentGroupChat.id,
        sender_id:me,
        content
      };

    }else{

      if(!currentChatUser)return;

      url=SUPABASE_URL+"/rest/v1/messages";

      body={
        sender_id:me,
        receiver_id:currentChatUser.id,
        content
      };
    }

    const response=await fetch(
      url,
      {
        method:"POST",
        headers:{
          ...authHeaders(),
          Prefer:"return=minimal"
        },
        body:JSON.stringify(body)
      }
    );

    if(!response.ok){
      alert("Не удалось отправить сообщение:\n"+await response.text());
      return;
    }

    input.value="";

    if(currentGroupChat){
      await loadGroupMessages();
    }else{
      await loadDirectMessages();
    }

  }catch(e){

    console.error(e);
    alert("Ошибка отправки.");

  }finally{

    input.disabled=false;
    input.focus();
  }
}

function handleChatKey(event){

  if(event.key==="Enter"&&!event.shiftKey){
    event.preventDefault();
    sendMessage();
  }
}

function startChatPolling(){

  stopChatPolling();

  chatPolling=setInterval(()=>{

    if(currentGroupChat){
      loadGroupMessages();
    }else if(currentChatUser){
      loadDirectMessages();
    }

  },5000);
}

function stopChatPolling(){

  if(chatPolling){
    clearInterval(chatPolling);
    chatPolling=null;
  }
}

function closeChat(){

  stopChatPolling();

  currentChatUser=null;
  currentGroupChat=null;

  showPage("messages");
}

async function openCreateGroupModal(){

  const modal=document.getElementById("groupModal");
  const list=document.getElementById("groupFriendsList");

  modal.classList.add("active");
  list.innerHTML='<div class="search-empty">Загружаем друзей...</div>';

  try{

    const me=localStorage.getItem("user_id");

    const followingResponse=await fetch(
      SUPABASE_URL+
      "/rest/v1/follows?follower_id=eq."+encodeURIComponent(me)+
      "&select=following_id",
      {headers:authHeaders()}
    );

    const followersResponse=await fetch(
      SUPABASE_URL+
      "/rest/v1/follows?following_id=eq."+encodeURIComponent(me)+
      "&select=follower_id",
      {headers:authHeaders()}
    );

    const following=await followingResponse.json();
    const followers=await followersResponse.json();

    const followingSet=new Set(
      following.map(x=>x.following_id)
    );

    const friends=followers
      .map(x=>x.follower_id)
      .filter(id=>followingSet.has(id));

    const profiles=await getProfilesByIds(friends);

    list.innerHTML="";

    if(!profiles.length){

      list.innerHTML=
        '<div class="search-empty">У тебя пока нет взаимных друзей.</div>';

      return;
    }

    profiles.forEach(profile=>{

      const row=document.createElement("label");
      row.className="friend-select";

      const checkbox=document.createElement("input");
      checkbox.type="checkbox";
      checkbox.value=profile.id;

      if(profile.avatar_url){

        const img=document.createElement("img");
        img.className="search-avatar";
        img.src=profile.avatar_url;
        row.appendChild(img);

      }else{

        const a=document.createElement("div");
        a.className="search-avatar-placeholder";
        a.textContent=(profile.display_name||profile.username).charAt(0).toUpperCase();
        row.appendChild(a);
      }

      const info=document.createElement("div");
      info.className="friend-select-info";

      const name=document.createElement("div");
      name.className="search-user-name";
      name.textContent=profile.display_name||profile.username;

      const username=document.createElement("div");
      username.className="search-user-username";
      username.textContent="@"+profile.username;

      info.appendChild(name);
      info.appendChild(username);
      row.appendChild(info);

      row.appendChild(checkbox);

      list.appendChild(row);
    });

  }catch(e){

    console.error(e);
    list.innerHTML='<div class="search-empty">Не удалось загрузить друзей.</div>';
  }
}

function closeGroupModal(){
  document.getElementById("groupModal").classList.remove("active");
}

async function createGroupChat(){

  const name=document.getElementById("groupName").value.trim()||"Общий чат";
  const selected=[
    ...document.querySelectorAll("#groupFriendsList input[type=checkbox]:checked")
  ].map(x=>x.value);

  const me=localStorage.getItem("user_id");

  if(!selected.length){
    alert("Выбери хотя бы одного друга.");
    return;
  }

  try{

    const response=await fetch(
      SUPABASE_URL+"/rest/v1/group_chats",
      {
        method:"POST",
        headers:{
          ...authHeaders(),
          Prefer:"return=representation"
        },
        body:JSON.stringify({
          name,
          creator_id:me
        })
      }
    );

    if(!response.ok){
      alert("Не удалось создать чат:\n"+await response.text());
      return;
    }

    const chats=await response.json();
    const chat=chats[0];

    const members=[
      me,
      ...selected
    ];

    const memberResponse=await fetch(
      SUPABASE_URL+"/rest/v1/group_chat_members",
      {
        method:"POST",
        headers:{
          ...authHeaders(),
          Prefer:"return=minimal"
        },
        body:JSON.stringify(
          members.map(user_id=>({
            chat_id:chat.id,
            user_id
          }))
        )
      }
    );

    if(!memberResponse.ok){
      alert("Чат создан, но не удалось добавить участников:\n"+await memberResponse.text());
      return;
    }

    closeGroupModal();

    document.getElementById("groupName").value="";

    await loadGroupChats();

  }catch(e){

    console.error(e);
    alert("Ошибка создания общего чата.");
  }
}

async function loadGroupChats(){

  const container=document.getElementById("groupChats");
  const me=localStorage.getItem("user_id");

  try{

    const membersResponse=await fetch(
      SUPABASE_URL+
      "/rest/v1/group_chat_members?user_id=eq."+encodeURIComponent(me)+
      "&select=chat_id",
      {headers:authHeaders()}
    );

    if(!membersResponse.ok){
      container.innerHTML="";
      return;
    }

    const members=await membersResponse.json();

    if(!members.length){
      container.innerHTML="";
      return;
    }

    const ids=members.map(x=>x.chat_id);

    const filter=ids.map(id=>"id.eq."+id).join(",");

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/group_chats?or="+
      encodeURIComponent("("+filter+")")+
      "&select=*&order=created_at.desc",
      {headers:authHeaders()}
    );

    if(!response.ok)return;

    const chats=await response.json();

    container.innerHTML="";

    for(const chat of chats){

      const item=document.createElement("div");
      item.className="group-card";

      const main=document.createElement("div");
      main.className="group-card-main";
      main.onclick=()=>openGroupChat(chat);

      const icon=document.createElement("div");
      icon.className="group-icon";
      icon.textContent="👥";

      const info=document.createElement("div");
      info.className="group-info";

      const name=document.createElement("div");
      name.className="group-name";
      name.textContent=chat.name;

      const count=document.createElement("div");
      count.className="group-members";
      count.textContent="Общий чат";

      info.appendChild(name);
      info.appendChild(count);

      main.appendChild(icon);
      main.appendChild(info);

      item.appendChild(main);
      container.appendChild(item);
    }

  }catch(e){
    console.error(e);
  }
}

async function openGroupChat(chat){

  currentGroupChat=chat;
  currentChatUser=null;

  showPage("chat");

  renderGroupHeader(chat);

  await loadGroupMessages();

  startChatPolling();
}

function renderGroupHeader(chat){

  const header=document.getElementById("chatHeader");

  header.innerHTML="";

  const back=document.createElement("button");
  back.className="chat-back";
  back.textContent="‹";
  back.onclick=closeChat;

  header.appendChild(back);

  const icon=document.createElement("div");
  icon.className="group-icon";
  icon.style.width="43px";
  icon.style.height="43px";
  icon.style.fontSize="19px";
  icon.textContent="👥";

  header.appendChild(icon);

  const info=document.createElement("div");

  const name=document.createElement("div");
  name.className="chat-user-name";
  name.textContent=chat.name;

  const members=document.createElement("div");
  members.className="chat-user-username";
  members.textContent="Общий чат";

  info.appendChild(name);
  info.appendChild(members);

  header.appendChild(info);
}

async function loadGroupMessages(){

  if(!currentGroupChat)return;

  const container=document.getElementById("chatMessages");
  const me=localStorage.getItem("user_id");

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/group_messages?chat_id=eq."+
      encodeURIComponent(currentGroupChat.id)+
      "&select=*&order=created_at.asc&limit=500",
      {headers:authHeaders()}
    );

    if(!response.ok)throw new Error();

    const messages=await response.json();

    container.innerHTML="";

    if(!messages.length){

      container.innerHTML=
        '<div class="chat-empty">Здесь пока пусто.<br>Напиши первое сообщение.</div>';

      return;
    }

    messages.forEach(message=>{

      const row=document.createElement("div");

      row.className="message-row "+
        (message.sender_id===me?"mine":"theirs");

      const bubble=document.createElement("div");
      bubble.className="message-bubble";

      bubble.textContent=message.content;

      const time=document.createElement("div");
      time.className="message-time";
      time.textContent=formatChatTime(message.created_at);

      bubble.appendChild(time);
      row.appendChild(bubble);

      container.appendChild(row);
    });

    container.scrollTop=container.scrollHeight;

  }catch(e){

    console.error(e);
    container.innerHTML=
      '<div class="chat-empty">Не удалось загрузить сообщения.</div>';
  }
}


/* =========================================================
   TIME
========================================================= */

function formatMessageTime(value){

  const date=new Date(value);
  const now=new Date();

  if(date.toDateString()===now.toDateString()){
    return date.toLocaleTimeString("ru-RU",{
      hour:"2-digit",
      minute:"2-digit"
    });
  }

  return date.toLocaleDateString("ru-RU",{
    day:"2-digit",
    month:"2-digit"
  });
}

function formatChatTime(value){

  return new Date(value).toLocaleTimeString(
    "ru-RU",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


/* =========================================================
   PAGES
========================================================= */

function showPage(page){

  if(page!=="chat")stopChatPolling();

  document
    .querySelectorAll(".page")
    .forEach(p=>p.classList.remove("active"));

  document
    .querySelectorAll(".nav-button")
    .forEach(b=>b.classList.remove("active"));

  if(page==="feed"){

    document.getElementById("feedPage").classList.add("active");
    document.getElementById("feedNav").classList.add("active");

    loadPosts();
    return;
  }

  if(page==="search"){

    document.getElementById("searchPage").classList.add("active");
    document.getElementById("searchNav").classList.add("active");

    return;
  }

  if(page==="messages"){

    document.getElementById("messagesPage").classList.add("active");
    document.getElementById("messagesNav").classList.add("active");

    loadGroupChats();
    loadConversations();

    return;
  }

  if(page==="chat"){

    document.getElementById("chatPage").classList.add("active");
    document.getElementById("messagesNav").classList.add("active");

    return;
  }

  if(page==="profile"){

    document.getElementById("profilePage").classList.add("active");
    document.getElementById("profileNav").classList.add("active");

    loadProfile();
    loadWall();

    return;
  }

  if(page==="publicProfile"){

    document.getElementById("publicProfilePage").classList.add("active");
    document.getElementById("searchNav").classList.add("active");

    return;
  }

  if(page==="followList"){

    document.getElementById("followListPage").classList.add("active");

    return;
  }
}
