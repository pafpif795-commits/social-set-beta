<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Cap</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --navy: #0b1f3a;
  --sky-soft: #e9f6ff;
  --bg: #f4f9fd;
  --line: #d8e6f0;
  --text: #102033;
  --muted: #718397;
  --red: #ef4056;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

button {
  border: 0;
  cursor: pointer;
  font: inherit;
}

button:disabled {
  opacity: .6;
  cursor: default;
}

/* ================= AUTH ================= */

#authScreen {
  position: relative;
  overflow: hidden;

  min-height: 100vh;
  min-height: 100dvh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 24px;

  background: #000;
}

.auth-video {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;
  object-position: center;

  z-index: 0;

  pointer-events: none;
}

.auth-overlay {
  position: absolute;
  inset: 0;

  background: rgba(0, 0, 0, .18);

  z-index: 1;

  pointer-events: none;
}

.auth-card {
  position: relative;
  z-index: 10;

  width: 100%;
  max-width: 420px;

  padding: 34px;

  background: rgba(255,255,255,.94);

  border: 1px solid rgba(255,255,255,.7);

  border-radius: 24px;

  box-shadow:
    0 22px 65px rgba(0,0,0,.35);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.brand {
  font-size: 44px;
  font-weight: 900;

  letter-spacing: -2.5px;

  color: var(--navy);

  text-align: center;
}

.tagline {
  text-align: center;

  color: var(--muted);

  margin: 8px 0 28px;
}

.auth-choice button,
.auth-form button {
  width: 100%;

  padding: 13px 16px;

  border-radius: 12px;

  margin-top: 10px;

  font-weight: 700;
}

.primary {
  background: var(--navy);
  color: white;
}

.secondary {
  background: var(--sky-soft);
  color: var(--navy);
}

.auth-form {
  display: none;
}

.auth-form h2 {
  margin-top: 0;
  color: var(--navy);
}

.auth-form input {
  width: 100%;

  padding: 13px;

  margin-top: 10px;

  border: 1px solid var(--line);

  border-radius: 11px;

  outline: none;

  background: white;
  color: var(--text);

  font-size: 15px;
}

.back-btn {
  background: transparent;
  color: var(--muted);

  margin-top: 12px;

  padding: 8px 0;
}

#authMessage {
  min-height: 20px;

  margin-top: 12px;

  color: var(--muted);

  font-size: 14px;
}

/* ================= APP ================= */

#app {
  display: none;
  min-height: 100vh;
}

header {
  height: 64px;

  background: white;

  border-bottom: 1px solid var(--line);

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 20px;

  position: sticky;
  top: 0;

  z-index: 20;
}

.header-logo {
  font-size: 23px;
  font-weight: 900;

  color: var(--navy);
}

.logout {
  background: var(--navy);

  color: white;

  border-radius: 10px;

  padding: 9px 13px;

  font-size: 13px;

  font-weight: 700;
}

.container {
  max-width: 650px;

  margin: 25px auto 90px;

  padding: 0 15px;
}

/* ================= PAGES ================= */

.page {
  display: none;
}

.page.active {
  display: block;
}

/* ================= FEED ================= */

.create-post,
.post,
.profile-card,
.profile-wall {
  background: white;

  border: 1px solid var(--line);

  border-radius: 17px;
}

.create-post {
  padding: 17px;

  margin-bottom: 20px;
}

textarea {
  width: 100%;

  min-height: 90px;

  resize: vertical;

  background: #fafdff;

  color: var(--text);

  border: 1px solid var(--line);

  border-radius: 12px;

  padding: 12px;

  font-size: 16px;

  outline: none;
}

.publish {
  margin-top: 10px;

  background: var(--navy);

  color: white;

  border-radius: 10px;

  padding: 11px 18px;

  font-weight: 700;
}

.post {
  margin-bottom: 15px;

  padding: 16px;
}

.post-user {
  display: flex;

  align-items: center;

  gap: 10px;

  margin-bottom: 12px;
}

.mini-avatar {
  width: 42px;
  height: 42px;

  border-radius: 50%;

  object-fit: cover;

  background: var(--sky-soft);

  border: 1px solid var(--line);
}

.mini-avatar-placeholder {
  width: 42px;
  height: 42px;

  border-radius: 50%;

  background: var(--navy);

  color: white;

  display: flex;

  align-items: center;
  justify-content: center;

  font-weight: 800;
}

.user-name {
  color: var(--navy);

  font-weight: 800;
}

.post-date {
  color: var(--muted);

  font-size: 12px;

  margin-top: 3px;
}

.post-text {
  font-size: 16px;

  line-height: 1.5;

  white-space: pre-wrap;
}

.actions {
  margin-top: 15px;

  display: flex;

  gap: 8px;
}

.reaction-btn {
  background: white;

  border: 1px solid var(--line);

  color: var(--muted);

  border-radius: 10px;

  padding: 8px 12px;

  font-weight: 700;
}

.reaction-btn.active {
  color: var(--red);

  border-color: #f1a0aa;

  background: #fff5f6;
}

/* ================= PROFILE ================= */

.profile-card {
  overflow: hidden;

  margin-bottom: 20px;
}

.cover {
  height: 145px;

  background:
    linear-gradient(
      135deg,
      #0b1f3a,
      #23608f,
      #62b7f5
    );
}

.profile-info {
  padding: 0 20px 20px;

  position: relative;
}

.big-avatar {
  width: 110px;
  height: 110px;

  border-radius: 50%;

  object-fit: cover;

  background: var(--sky-soft);

  border: 5px solid white;

  margin-top: -55px;

  display: block;
}

.avatar-placeholder {
  width: 110px;
  height: 110px;

  border-radius: 50%;

  background: var(--navy);

  color: white;

  border: 5px solid white;

  margin-top: -55px;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 36px;

  font-weight: 900;
}

.profile-name {
  font-size: 25px;

  font-weight: 900;

  color: var(--navy);

  margin-top: 12px;
}

.profile-username {
  color: var(--muted);

  margin-top: 3px;
}

.profile-bio {
  margin-top: 13px;

  line-height: 1.5;

  color: var(--text);
}

.profile-buttons {
  display: flex;

  gap: 8px;

  margin-top: 15px;

  flex-wrap: wrap;
}

.profile-button {
  background: var(--sky-soft);

  color: var(--navy);

  border-radius: 10px;

  padding: 10px 14px;

  font-weight: 700;
}

.profile-button.dark {
  background: var(--navy);

  color: white;
}

.profile-wall {
  padding: 17px;
}

.wall-title {
  color: var(--navy);

  font-size: 21px;

  font-weight: 900;

  margin-bottom: 15px;
}

.wall-empty {
  color: var(--muted);

  text-align: center;

  padding: 25px 10px;
}

/* ================= SEARCH ================= */

.search-box {
  background: white;

  border: 1px solid var(--line);

  border-radius: 17px;

  padding: 15px;

  margin-bottom: 15px;
}

.search-input {
  width: 100%;

  padding: 13px 15px;

  border: 1px solid var(--line);

  border-radius: 12px;

  outline: none;

  background: #fafdff;

  color: var(--text);

  font-size: 16px;
}

.search-results {
  display: flex;

  flex-direction: column;

  gap: 10px;
}

.search-user {
  background: white;

  border: 1px solid var(--line);

  border-radius: 15px;

  padding: 12px;

  display: flex;

  align-items: center;

  gap: 12px;

  cursor: pointer;
}

.search-user:hover {
  background: #fafdff;
}

.search-avatar {
  width: 48px;
  height: 48px;

  border-radius: 50%;

  object-fit: cover;

  background: var(--sky-soft);

  border: 1px solid var(--line);

  flex-shrink: 0;
}

.search-avatar-placeholder {
  width: 48px;
  height: 48px;

  border-radius: 50%;

  background: var(--navy);

  color: white;

  display: flex;

  align-items: center;
  justify-content: center;

  font-weight: 900;

  font-size: 18px;

  flex-shrink: 0;
}

.search-user-name {
  font-weight: 800;

  color: var(--navy);
}

.search-user-username {
  color: var(--muted);

  font-size: 13px;

  margin-top: 3px;
}

.search-empty {
  text-align: center;

  color: var(--muted);

  padding: 30px 10px;
}

/* ================= NAV ================= */

.bottom-nav {
  position: fixed;

  bottom: 0;

  left: 0;
  right: 0;

  height: 68px;

  background: rgba(255,255,255,.96);

  border-top: 1px solid var(--line);

  display: flex;

  justify-content: center;

  z-index: 30;

  backdrop-filter: blur(12px);

  -webkit-backdrop-filter: blur(12px);
}

.nav-inner {
  width: 100%;

  max-width: 650px;

  display: flex;

  justify-content: space-around;

  align-items: center;
}

.nav-button {
  background: transparent;

  color: var(--muted);

  min-width: 90px;

  padding: 8px;

  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 3px;

  font-size: 12px;

  font-weight: 700;
}

.nav-icon {
  font-size: 23px;
}

.nav-button.active {
  color: var(--navy);
}

/* ================= MODAL ================= */

.modal {
  display: none;

  position: fixed;

  inset: 0;

  background: rgba(11,31,58,.45);

  z-index: 100;

  align-items: center;

  justify-content: center;

  padding: 20px;
}

.modal.active {
  display: flex;
}

.modal-card {
  width: 100%;

  max-width: 420px;

  background: white;

  border-radius: 20px;

  padding: 22px;

  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}

.modal-card h2 {
  margin-top: 0;

  color: var(--navy);
}

.modal-card input,
.modal-card textarea {
  margin-top: 10px;
}

.modal-card input {
  width: 100%;

  padding: 13px;

  border: 1px solid var(--line);

  border-radius: 11px;

  outline: none;

  font-size: 15px;
}

.modal-actions {
  display: flex;

  gap: 8px;

  margin-top: 12px;
}

.modal-actions button {
  flex: 1;

  padding: 11px;

  border-radius: 10px;

  font-weight: 700;
}

.cancel {
  background: var(--sky-soft);

  color: var(--navy);
}

/* ================= MOBILE ================= */

@media(max-width:700px) {

  .container {
    margin-top: 15px;
  }

  .cover {
    height: 125px;
  }

  .profile-info {
    padding-left: 16px;
    padding-right: 16px;
  }

  .auth-card {
    padding: 26px;
  }

  .brand {
    font-size: 38px;
  }

  .nav-button {
    min-width: 80px;
  }
}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->

<section id="authScreen">

  <video
    class="auth-video"
    autoplay
    muted

    playsinline
    preload="auto"
  >
    <source
      src="https://jrzoexmvgyyitojbcxvr.supabase.co/storage/v1/object/public/Stenka/auth-bg.mp4/3992627239181363251.mp4"

    >

  <div class="auth-overlay"></div>

<!-- ================= APP ================= -->

</div>

<!-- ================= PROFILE MODAL ================= -->

<div
  id="profileModal"

>

      Редактировать профиль

      id="editDisplayName"
      type="text"

  id="avatarInput"

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://jrzoexmvgyyitojbcxvr.supabase.co";

/*
  ВСТАВЬ СЮДА СВОЙ ТЕКУЩИЙ PUBLISHABLE KEY
*/

const SUPABASE_KEY =
  "sb_publishable_NGzwO7npRZMNPeTSXHNLbQ_TO5apgSJ";



const headers = {
  "apikey": SUPABASE_KEY,

  "Authorization":
    "Bearer " + SUPABASE_KEY,

  "Content-Type":
    "application/json"
};


function authHeaders() {

  const token =
    localStorage.getItem(
      "access_token"
    );

  return {

    ...headers,

    "Authorization":
      "Bearer " +
      (token || SUPABASE_KEY)

  };

}


/* =====================================================
   AUTH UI
===================================================== */

function showAuthChoice() {

  const choice =
    document.getElementById(
      "authChoice"
    );

  const login =
    document.getElementById(
      "loginForm"
    );

  const signup =
    document.getElementById(
      "signupForm"
    );

  const message =
    document.getElementById(
      "authMessage"
    );

  choice.style.display =
    "block";

  login.style.display =
    "none";

  signup.style.display =
    "none";

  message.textContent =
    "";

}


function showAuthForm(type) {

  document.getElementById(
    "authChoice"
  ).style.display =
    "none";

  document.getElementById(
    "loginForm"
  ).style.display =
    type === "login"
      ? "block"
      : "none";

  document.getElementById(
    "signupForm"
  ).style.display =
    type === "signup"
      ? "block"
      : "none";

  document.getElementById(
    "authMessage"
  ).textContent =
    "";

}


/* =====================================================
   SIGN UP
===================================================== */

async function signUp() {

  const username =
    document.getElementById(
      "signupUsername"
    ).value.trim();

  const email =
    document.getElementById(
      "signupEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "signupPassword"
    ).value;

  const message =
    document.getElementById(
      "authMessage"
    );


  if (
    !username ||
    !email ||
    !password
  ) {

    message.textContent =
      "Заполни username, email и пароль.";

    return;

  }


  if (username.length < 3) {

    message.textContent =
      "Username должен быть минимум 3 символа.";

    return;

  }


  if (password.length < 6) {

    message.textContent =
      "Пароль должен быть минимум 6 символов.";

    return;

  }


  message.textContent =
    "Создаём аккаунт...";


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/signup",
        {

          method: "POST",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              email,
              password

            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      message.textContent =
        data.msg ||
        data.message ||
        data.error_description ||
        "Ошибка регистрации.";

      return;

    }


    if (
      !data.user ||
      !data.access_token
    ) {

      message.textContent =
        "Аккаунт создан. Теперь войди.";

      showAuthForm(
        "login"
      );

      document.getElementById(
        "loginEmail"
      ).value =
        email;

      return;

    }


    localStorage.setItem(
      "access_token",
      data.access_token
    );

    localStorage.setItem(
      "user_id",
      data.user.id
    );


    await createProfile(
      data.user.id,
      username
    );


    showApp();

  } catch (error) {

    console.error(error);

    message.textContent =

async function signIn() {

    document.getElementById(
      "loginEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "loginPassword"
    ).value;

  const message =
    document.getElementById(
      "authMessage"
    );


  if (
    !email ||
    !password
  ) {

    message.textContent =
      "Введите email и пароль.";

    return;

  }


  message.textContent =
    "Входим...";


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {

          method: "POST",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              email,
              password

            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      message.textContent =
        data.msg ||
        data.message ||
        data.error_description ||
        "Ошибка входа.";

      return;

    }


    localStorage.setItem(
      "access_token",
      data.access_token
    );

    localStorage.setItem(
      "user_id",
      data.user.id
    );


    showApp();

  } catch (error) {

    console.error(error);

    message.textContent =
      "Ошибка соединения с сервером.";

  }

}

async function uploadAvatar() {

  const input =
    document.getElementById(
      "avatarInput"
    );

  const file =
    input.files[0];


  if (!file) return;


  if (
    !file.type.startsWith(
      "image/"
    )
  ) {

    alert(
      "Можно загружать только изображения."
    );

    input.value = "";

    return;

  }


  if (
    file.size >
    5 * 1024 * 1024
  ) {

    alert(
      "Максимальный размер аватарки: 5 МБ."
    );

    input.value = "";

    return;

  }


  const userId =
    localStorage.getItem(
      "user_id"
    );

  const accessToken =
    localStorage.getItem(
      "access_token"
    );


  if (!userId || !accessToken) {

    alert(
      "Нужно войти в аккаунт."
    );

    return;

  }


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const filePath =
    userId +
    "/" +
    Date.now() +
    "." +
    extension;


  try {

    const uploadResponse =
      await fetch(
        SUPABASE_URL +
        "/storage/v1/object/Stenka/" +
        filePath,
        {

          method: "POST",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              accessToken,

            "Content-Type":
              file.type,

            "x-upsert":
              "true"

          },

          body:
            file

        }
      );


    if (!uploadResponse.ok) {

      alert(
        "Не удалось загрузить аватарку:\n" +
        await uploadResponse.text()
      );

      return;

    }


    const avatarUrl =
      SUPABASE_URL +
      "/storage/v1/object/public/Stenka/" +
      filePath;


    const updateResponse =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/profiles?id=eq." +
        encodeURIComponent(userId),
        {

          method: "PATCH",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              accessToken,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"

          },

          body:
            JSON.stringify({

              avatar_url:
                avatarUrl

            })

        }
      );


    if (!updateResponse.ok) {

      alert(
        "Фото загрузилось, но профиль не обновился."
      );

      return;

    }


    input.value = "";

    await loadProfile();

    await loadPosts();

    await loadWall();

  } catch (error) {

    console.error(error);

    alert(
      "Ошибка загрузки аватарки."
    );

  }

}

async function performUserSearch() {

  const input =
    document.getElementById(
      "userSearchInput"
    );

  const results =
    document.getElementById(
      "searchResults"
    );


  if (!input || !results) {
    return;
  }


  const query =
    input.value.trim();


  if (!query) {

    results.innerHTML = `

      <div class="search-empty">
        Начни вводить username или имя
      </div>

    `;

    return;

  }


  results.innerHTML = `

    <div class="search-empty">
      Ищем...
    </div>

  `;


  try {

    const pattern =
      "*" +
      query.replace(
        /[,*()]/g,
        ""
      ) +
      "*";


    const encodedPattern =
      encodeURIComponent(
        pattern
      );


    const url =
      SUPABASE_URL +
      "/rest/v1/profiles" +
      "?or=" +
      encodeURIComponent(
        "(username.ilike." +
        pattern +
        ",display_name.ilike." +
        pattern +
        ")"
      ) +
      "&select=id,username,display_name,avatar_url" +
      "&limit=30";


    const response =
      await fetch(
        url,
        {
          headers
        }
      );


    if (!response.ok) {

      results.innerHTML = `

        <div class="search-empty">
          Не удалось выполнить поиск
        </div>

      `;

      console.error(
        await response.text()
      );

      return;

    }


    const profiles =
      await response.json();


    results.innerHTML = "";


    if (!profiles.length) {

      results.innerHTML = `

        <div class="search-empty">
          Пользователей не найдено
        </div>

      `;

      return;

    }


    profiles.forEach(
      profile => {

        const user =
          document.createElement(
            "div"
          );


        user.className =
          "search-user";


        user.onclick = () => {

          openFoundProfile(
            profile
          );

        };


        let avatarHTML;


        if (profile.avatar_url) {

          avatarHTML = `

            <img
              class="search-avatar"
              src="${escapeHtml(
                profile.avatar_url
              )}"
              alt=""
            >

          `;

        } else {

          const letter =
            (
              profile.display_name ||
              profile.username ||
              "N"
            )
            .charAt(0)
            .toUpperCase();


          avatarHTML = `

            <div class="search-avatar-placeholder">
              ${escapeHtml(letter)}
            </div>

          `;

        }


        user.innerHTML = `

          ${avatarHTML}

          <div>

            <div class="search-user-name">
              ${escapeHtml(
                profile.display_name ||
                profile.username
              )}
            </div>

            <div class="search-user-username">
              @${escapeHtml(
                profile.username
              )}
            </div>

          </div>

        `;


        results.appendChild(
          user
        );

      }
    );

  } catch (error) {

    console.error(
      "Search error:",
      error
    );

    results.innerHTML = `

      <div class="search-empty">
        Ошибка поиска
      </div>

    `;

  }

}

async function loadProfilesMap() {

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/profiles?select=id,username,display_name,avatar_url",
        {
          headers
        }
      );


    if (!response.ok) {

      console.error(
        await response.text()
      );

      return {};

    }


    const profiles =
      await response.json();


    const map = {};


    profiles.forEach(
      profile => {

        map[profile.id] =
          profile;

      }
    );


    return map;

  } catch (error) {

    console.error(
      "loadProfilesMap:",
      error
    );

    return {};

  }

}

/* =====================================================
   RENDER POST
===================================================== */

function renderPost(
  post,
  container,
  profiles
) {

  const reaction =
    localStorage.getItem(
      "reaction_" +
      post.id
    );


  const profile =
    profiles[post.user_id];


  const username =
    profile?.username ||
    post.username ||
    "user";


  const displayName =
    profile?.display_name ||
    username;


  const avatar =
    profile?.avatar_url;


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "post";


  let avatarHTML;


  if (avatar) {

    avatarHTML = `

      <img
        class="mini-avatar"
        src="${escapeHtml(avatar)}"
        alt=""
      >

    `;

  } else {

    avatarHTML = `

      <div class="mini-avatar-placeholder">
        ${escapeHtml(
          displayName
            .charAt(0)
            .toUpperCase()
        )}
      </div>

    `;

  }


  const likes =
    Number(post.likes || 0);

  const dislikes =
    Number(post.dislikes || 0);


  div.innerHTML = `

    <div class="post-user">

      ${avatarHTML}

      <div>

        <div class="user-name">
          ${escapeHtml(displayName)}
        </div>

        <div class="post-date">
          @${escapeHtml(username)}
        </div>

      </div>

    </div>

    <div class="post-text">
      ${escapeHtml(post.content)}
    </div>

    <div class="actions">

      <button
        class="reaction-btn ${
          reaction === "like"
            ? "active"
            : ""
        }"
        onclick="reactToPost(
          ${Number(post.id)},
          'like'
        )"
      >
        👍 ${likes}
      </button>

      <button
        class="reaction-btn ${
          reaction === "dislike"
            ? "active"
            : ""
        }"
        onclick="reactToPost(
          ${Number(post.id)},
          'dislike'
        )"
      >
        👎 ${dislikes}
      </button>

    </div>

  `;


  container.appendChild(
    div
  );

}

/* =====================================================
   REACTIONS
===================================================== */

async function reactToPost(
  postId,
  type
) {

  const oldReaction =
    localStorage.getItem(
      "reaction_" +
      postId
    );


  let likeChange = 0;

  let dislikeChange = 0;

  let newReaction =
    type;


  if (
    oldReaction === type
  ) {

    newReaction = null;


    if (
      type === "like"
    ) {

      likeChange = -1;

    } else {

      dislikeChange = -1;

    }

  } else {

    if (
      oldReaction === "like"
    ) {

      likeChange = -1;

    }


    if (
      oldReaction === "dislike"
    ) {

      dislikeChange = -1;

    }


    if (
      type === "like"
    ) {

      likeChange += 1;

    } else {

      dislikeChange += 1;

    }

  }


  try {

    const getResponse =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/posts?id=eq." +
        encodeURIComponent(postId) +
        "&select=likes,dislikes",
        {
          headers
        }
      );


    if (!getResponse.ok) {

      alert(
        "Не удалось получить реакцию."
      );

      return;

    }


    const rows =
      await getResponse.json();


    if (!rows.length) {

      return;

    }


    const post =
      rows[0];


    const newLikes =
      Math.max(
        0,
        Number(post.likes || 0) +
        likeChange
      );


    const newDislikes =
      Math.max(
        0,
        Number(post.dislikes || 0) +
        dislikeChange
      );


    const updateResponse =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/posts?id=eq." +
        encodeURIComponent(postId),
        {

          method: "PATCH",

          headers: {

            ...authHeaders(),

            "Prefer":
              "return=representation"

          },

          body:
            JSON.stringify({

              likes:
                newLikes,

              dislikes:
                newDislikes

            })

        }
      );


    if (!updateResponse.ok) {

      alert(
        "Не удалось сохранить реакцию:\n" +
        await updateResponse.text()
      );

      return;

    }


    if (newReaction) {

      localStorage.setItem(
        "reaction_" +
        postId,
        newReaction
      );

    } else {

      localStorage.removeItem(
        "reaction_" +
        postId
      );

    }


    await loadPosts();

    await loadWall();

  } catch (error) {

    console.error(
      "reaction error:",
      error
    );

    alert(
      "Ошибка соединения с сервером."
    );

  }

}


/* =====================================================
   SECURITY
===================================================== */

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text == null
      ? ""
      : String(text);


  return div.innerHTML;

}


/* =====================================================
   START
===================================================== */

function startApp() {

  const token =
    localStorage.getItem(
      "access_token"
    );

  const userId =
    localStorage.getItem(
      "user_id"
    );


  if (
    token &&
    userId
  ) {

    showApp();

  } else {

    showAuth();

  }

}


startApp();
