<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>NoCap</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --navy:#0b1f3a;
  --navy2:#12345d;
  --blue:#3d9cff;
  --sky:#e9f6ff;
  --bg:#f4f9fd;
  --line:#d8e6f0;
  --text:#102033;
  --muted:#718397;
  --red:#ef4056;
  --green:#23753a;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button{
  border:0;
  cursor:pointer;
  font:inherit;
}

button:disabled{
  opacity:.6;
  cursor:default;
}

input,
textarea{
  font-family:inherit;
}

/* =========================================================
   AUTH
========================================================= */

#authScreen{
  position:relative;
  overflow:hidden;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:25px 20px;
  background:#000;
}

.auth-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
  pointer-events:none;
}

.auth-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.30);
  z-index:1;
  pointer-events:none;
}

.auth-content{
  position:relative;
  z-index:2;
  width:100%;
  max-width:430px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.auth-welcome{
  text-align:center;
  margin-bottom:24px;
  color:#fff;
  font-size:38px;
  line-height:1.05;
  font-weight:900;
  font-style:italic;
  letter-spacing:-1.4px;
  text-shadow:0 5px 25px rgba(0,0,0,.45);
  animation:welcomeIn .8s cubic-bezier(.2,.8,.2,1) both;
}

.auth-welcome .nocap{
  color:#72d98b;
  font-style:italic;
  text-shadow:none;
}

@keyframes welcomeIn{
  from{
    opacity:0;
    transform:translateY(25px) scale(.94);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.auth-card{
  position:relative;
  width:100%;
  padding:28px 25px;
  background:rgba(4,35,20,.50);
  border:1px solid rgba(255,255,255,.13);
  border-radius:26px;
  box-shadow:
    0 25px 80px rgba(0,0,0,.52),
    inset 0 1px 0 rgba(255,255,255,.05);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  animation:cardIn .75s cubic-bezier(.2,.8,.2,1) .08s both;
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

#authChoice{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.auth-form{
  display:none;
  width:100%;
}

.auth-form h2{
  color:#fff;
  margin:0 0 12px;
  font-size:25px;
}

.auth-form input{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:12px;
  outline:none;
  font-size:15px;
  background:rgba(255,255,255,.95);
  color:var(--text);
}

.auth-form input:focus{
  border-color:#55aaff;
  box-shadow:0 0 0 3px rgba(61,156,255,.18);
}

.auth-form button,
.auth-choice-button{
  width:100%;
  min-height:58px;
  padding:16px 20px;
  border-radius:16px;
  margin-top:14px;
  font-size:18px;
  font-weight:800;
  letter-spacing:.2px;
  transition:
    transform .2s ease,
    box-shadow .2s ease,
    opacity .2s ease;
}

.auth-choice-button:active,
.auth-form button:active{
  transform:scale(.98);
}

.auth-choice-button{
  max-width:350px;
}

.primary{
  background:linear-gradient(135deg,#2f9b57,#1f713e);
  color:#fff;
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 10px 28px rgba(24,100,50,.24);
}

.primary:hover{
  box-shadow:0 13px 34px rgba(24,100,50,.32);
}

.secondary{
  background:rgba(255,255,255,.08);
  color:#fff;
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 8px 24px rgba(0,0,0,.16);
}

.secondary:hover{
  background:rgba(255,255,255,.13);
}

.remember-me{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:12px;
  margin-bottom:4px;
  color:rgba(255,255,255,.85);
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}

.remember-me input{
  width:18px;
  height:18px;
  margin:0;
  accent-color:#3d9cff;
  cursor:pointer;
}

.back-btn{
  background:transparent;
  color:rgba(255,255,255,.72);
  margin-top:12px;
  padding:8px 0;
}

.back-btn:hover{
  color:#fff;
}

#authMessage{
  min-height:20px;
  margin-top:13px;
  color:rgba(255,255,255,.88);
  font-size:14px;
  text-align:center;
}

/* =========================================================
   APP
========================================================= */

#app{
  display:none;
  min-height:100vh;
}

header{
  height:64px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:50;
  overflow:hidden;
}

.header-logo{
  height:50px;
  width:129px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  overflow:hidden;
  flex-shrink:0;
}

.header-logo-image{
  width:124px;
  height:46px;
  object-fit:contain;
  object-position:left center;
  display:block;
  margin-left:5px;
  flex-shrink:0;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.notification-button{
  position:relative;
  width:40px;
  height:40px;
  border-radius:50%;
  background:#f1f5f8;
  color:var(--navy);
  font-size:20px;
}

.notification-badge{
  position:absolute;
  top:-2px;
  right:-2px;
  min-width:18px;
  height:18px;
  padding:0 5px;
  border-radius:10px;
  background:var(--red);
  color:#fff;
  font-size:10px;
  font-weight:900;
  display:none;
  align-items:center;
  justify-content:center;
}

.logout{
  background:var(--navy);
  color:#fff;
  border-radius:10px;
  padding:9px 13px;
  font-size:13px;
  font-weight:700;
}

.container{
  width:100%;
  max-width:650px;
  margin:20px auto 90px;
  padding:0 15px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* =========================================================
   COMMON
========================================================= */

.create-post,
.profile-card,
.profile-wall,
.public-profile-card,
.search-box,
.search-user,
.conversations,
.follow-list,
.group-card,
.notification-list{
  background:#fff;
  border:1px solid var(--line);
}

.create-post{
  padding:16px;
  border-radius:17px;
  margin-bottom:18px;
}

textarea{
  width:100%;
  min-height:90px;
  resize:vertical;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  outline:none;
  background:#fafdff;
  font-size:16px;
}

textarea:focus,
.search-input:focus,
.messages-search-input:focus{
  border-color:#77bfff;
  box-shadow:0 0 0 3px rgba(61,156,255,.10);
}

.publish{
  margin-top:10px;
  padding:11px 18px;
  border-radius:10px;
  background:var(--navy);
  color:#fff;
  font-weight:700;
}

.wall-empty,
.search-empty{
  color:var(--muted);
  text-align:center;
  padding:25px 10px;
}

/* =========================================================
   POSTS
========================================================= */

.post{
  padding:18px 4px;
  border:0;
  border-radius:0;
  margin:0;
  background:transparent;
  width:100%;
}

@keyframes postIn{
  from{opacity:0;transform:translateY(24px);}
  to{opacity:1;transform:translateY(0);}
}

.post{
  animation:postIn .42s cubic-bezier(.2,.8,.2,1) both;
}

.post:nth-child(2){animation-delay:.04s}
.post:nth-child(3){animation-delay:.08s}
.post:nth-child(4){animation-delay:.12s}
.post:nth-child(5){animation-delay:.16s}
.post:nth-child(6){animation-delay:.20s}

.post + .post{
  border-top:0;
}

.post-user{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
  cursor:pointer;
  min-width:0;
}

.mini-avatar,
.search-avatar,
.message-result-avatar{
  width:58px;
  height:58px;
  border-radius:14px;
  object-fit:cover;
  background:var(--sky);
  border:1px solid var(--line);
  flex-shrink:0;
}

.mini-avatar-placeholder,
.search-avatar-placeholder,
.message-result-placeholder{
  width:58px;
  height:58px;
  border-radius:14px;
  background:var(--navy);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  flex-shrink:0;
}

.user-name{
  color:var(--navy);
  font-weight:800;
}

.user-handle{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.post-text{
  font-size:16px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.post-image{
  display:block;
  width:100%;
  max-height:650px;
  object-fit:contain;
  border-radius:14px;
  margin-top:12px;
  background:#f1f3f5;
}

.post-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.post-menu{
  position:relative;
}

.post-menu-button{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#f1f3f5;
  color:#555;
  font-weight:900;
}

.post-menu-list{
  display:none;
  position:absolute;
  right:0;
  top:39px;
  width:150px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.12);
  overflow:hidden;
  z-index:5;
}

.post-menu.open .post-menu-list{
  display:block;
}

.post-menu-list button{
  width:100%;
  text-align:left;
  padding:11px 13px;
  background:#fff;
  color:var(--text);
}

.post-menu-list button:hover{
  background:var(--sky);
}

.post-menu-list .danger{
  color:var(--red);
}

.actions{
  display:flex;
  gap:8px;
  margin-top:14px;
  align-items:center;
  flex-wrap:wrap;
}

.reaction-btn,
.comment-toggle{
  background:#fff;
  border:1px solid var(--line);
  color:var(--muted);
  border-radius:10px;
  padding:6px 10px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:3px;
  transition:
    transform .18s ease,
    background .18s ease,
    border-color .18s ease,
    color .18s ease;
}

.reaction-btn:active{
  transform:scale(.92);
}

.reaction-btn.reaction-pop{
  animation:reactionPop .32s cubic-bezier(.2,.8,.2,1);
}

@keyframes reactionPop{
  0%{
    transform:scale(1);
  }
  45%{
    transform:scale(1.16);
  }
  100%{
    transform:scale(1);
  }
}

.reaction-icon{
  width:26px;
  height:26px;
  object-fit:contain;
  display:block;
  pointer-events:none;
  transition:
    transform .18s ease,
    filter .18s ease;
}

.reaction-btn.active{
  color:var(--muted);
  border-color:var(--line);
  background:#fff;
}

.reaction-btn.active .reaction-icon{
  transform:scale(1.08);
}

.reaction-btn[data-reaction="like"].active .reaction-icon{
  filter:brightness(0) saturate(100%) invert(49%) sepia(92%) saturate(1550%) hue-rotate(184deg) brightness(96%) contrast(96%);
}

.reaction-btn[data-reaction="dislike"].active .reaction-icon{
  filter:brightness(0) saturate(100%) invert(35%) sepia(94%) saturate(2300%) hue-rotate(333deg) brightness(96%) contrast(96%);
}

.comment-toggle{
  width:auto;
  min-width:44px;
  height:40px;
  padding:5px 7px;
  color:var(--navy);
}

.comment-toggle .reaction-icon{
  width:25px;
  height:25px;
}

.comment-count{
  margin-left:1px;
  font-size:13px;
  line-height:1;
  font-weight:500;
  font-variant-numeric:tabular-nums;
}

/* =========================================================
   COMMENTS
========================================================= */

.comments{
  display:none;
  margin-top:14px;
  border-top:1px solid var(--line);
  padding-top:13px;
}

.comments.open{
  display:block;
}

.comment-form{
  display:flex;
  gap:7px;
  margin-bottom:12px;
}

.comment-input{
  flex:1;
  min-height:42px;
  max-height:100px;
  resize:none;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  outline:none;
  background:#fafdff;
}

.comment-send{
  width:44px;
  height:42px;
  border-radius:11px;
  background:var(--navy);
  color:#fff;
}

.comment{
  display:flex;
  gap:9px;
  padding:9px 0;
  border-bottom:1px solid #edf1f4;
}

.comment:last-child{
  border-bottom:0;
}

.comment-avatar{
  width:35px;
  height:35px;
  border-radius:10px;
  object-fit:cover;
  background:var(--sky);
  flex-shrink:0;
}

.comment-main{
  flex:1;
  min-width:0;
}

.comment-head{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.comment-author{
  color:var(--navy);
  font-weight:800;
  font-size:14px;
}

.comment-date{
  color:var(--muted);
  font-size:10px;
}

.comment-text{
  margin-top:3px;
  line-height:1.4;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.comment-actions{
  display:flex;
  gap:7px;
  margin-top:5px;
}

.comment-actions button{
  background:transparent;
  color:var(--muted);
  font-size:11px;
  padding:2px 0;
}

.comment-actions .delete{
  color:var(--red);
}

/* =========================================================
   PHOTOS
========================================================= */

.post-photo-tools{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:10px;
}

.photo-button{
  background:var(--sky);
  color:var(--navy);
  padding:9px 13px;
  border-radius:10px;
  font-weight:700;
}

.photo-name{
  color:var(--muted);
  font-size:13px;
  max-width:230px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.post-image-preview{
  display:none;
  margin-top:12px;
  position:relative;
}

.post-image-preview.has-image{
  display:block;
}

.post-image-preview img{
  width:100%;
  max-height:400px;
  object-fit:cover;
  border-radius:14px;
}

.remove-photo{
  position:absolute;
  right:8px;
  top:8px;
  width:34px;
  height:34px;
  border-radius:50%;
  background:rgba(0,0,0,.7);
  color:#fff;
}

/* =========================================================
   PROFILE
========================================================= */

.profile-card,
.public-profile-card{
  border:0;
  border-radius:0;
  overflow:visible;
  margin-bottom:20px;
  background:#fff;
}

/* Концепт: аватар слева, шапка только справа от него */
.profile-hero,
.public-hero{
  position:relative;
  height:144px;
  background:#fff;
  overflow:hidden;
}

.cover,
.public-cover{
  position:absolute;
  left:144px;
  right:-15px;
  top:13px;
  height:127px;
  background:#fff;
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
  border:0;
}

.profile-avatar-wrap,
.public-avatar-wrap{
  position:absolute;
  left:0;
  top:0;
  z-index:3;
}

.big-avatar,
.public-avatar,
.avatar-placeholder,
.public-avatar-placeholder{
  width:144px;
  height:144px;
  border-radius:9px;
  object-fit:cover;
  border:0;
  background:#fff;
  display:block;
  box-shadow:0 1px 0 rgba(0,0,0,.04);
}

.avatar-placeholder,
.public-avatar-placeholder{
  background:var(--navy);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  font-weight:900;
}

.profile-identity,
.public-identity{
  position:absolute;
  left:163px;
  right:18px;
  top:28px;
  z-index:4;
  pointer-events:none;
}

.profile-name,
.public-name{
  margin:0;
  font-size:29px;
  line-height:1.05;
  font-weight:900;
  color:#fff;
  text-shadow:0 2px 12px rgba(0,0,0,.32);
  overflow-wrap:anywhere;
}

.profile-username,
.public-username{
  color:rgba(255,255,255,.88);
  margin-top:5px;
  font-size:16px;
  text-shadow:0 2px 8px rgba(0,0,0,.30);
}

.profile-bio,
.public-bio,
.profile-info>.status-label,
.public-info>.status-label{
  display:none;
}

.profile-main-stats,
.public-main-stats{
  background:#fff;
  padding:19px 0 13px;
}

.profile-stats,
.public-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:0;
  text-align:center;
}

.stat{
  cursor:pointer;
}

.stat-number{
  color:#111;
  font-size:22px;
  line-height:1.1;
  font-weight:500;
  font-variant-numeric:tabular-nums;
}

.stat-label{
  color:#777;
  font-size:15px;
  margin-top:7px;
  font-weight:400;
}

.profile-buttons,
.public-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:0 0 12px;
}

.profile-button,
.public-action{
  background:var(--sky);
  color:var(--navy);
  border-radius:10px;
  padding:10px 13px;
  font-weight:700;
}

.profile-button.dark,
.public-action.dark{
  background:var(--navy);
  color:#fff;
}

.public-action{
  flex:1;
}

.public-action.following{
  background:var(--navy);
  color:#fff;
}

.friend-badge{
  display:none;
}

.profile-tabs{
  display:flex;
  margin:0;
  border-bottom:1px solid #e8edf1;
  background:#fff;
}

.profile-tab{
  flex:1;
  padding:17px 10px 14px;
  background:#fff;
  color:#777;
  font-size:18px;
  font-weight:400;
  border-bottom:3px solid transparent;
}

.profile-tab.active{
  color:#111;
  font-weight:700;
  border-bottom-color:#111;
}

.profile-tab-content{
  display:none;
}

.profile-tab-content.active{
  display:block;
}

.profile-wall{
  border-radius:0;
  padding:17px 0 0;
  border:0;
}

.wall-title{
  font-size:21px;
  font-weight:900;
  color:var(--navy);
  margin-bottom:14px;
}

.public-wall{
  margin-top:20px;
}

.public-back{
  background:transparent;
  color:var(--muted);
  padding:4px 0 12px;
  font-weight:700;
}

.favorite-button{
  background:#fff;
  border:1px solid var(--line);
  color:var(--muted);
  border-radius:10px;
  padding:6px 10px;
  font-size:13px;
  font-weight:600;
}

.favorite-button.active{
  color:#b88700;
  background:#fffaf0;
  border-color:#ead7a3;
}

.edit-profile-page{
  background:#fff;
  border-radius:18px;
  padding:18px;
  border:1px solid var(--line);
}

.edit-profile-page h2{
  margin:0 0 15px;
  color:var(--navy);
}

.edit-profile-cover-preview{
  width:100%;
  height:150px;
  border-radius:12px;
  background:#fff;
  background-size:cover;
  background-position:center;
  border:1px solid #edf1f4;
}

.edit-cover-tools{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.edit-profile-page input,
.edit-profile-page textarea{
  width:100%;
  margin-top:10px;
  padding:13px;
  border:1px solid var(--line);
  border-radius:11px;
  outline:none;
}

.edit-profile-page textarea{
  min-height:110px;
}

/* =========================================================
   SEARCH
========================================================= */

.search-box{
  padding:15px;
  border-radius:17px;
  margin-bottom:15px;
}

.search-input{
  width:100%;
  padding:13px 15px;
  border:1px solid var(--line);
  border-radius:12px;
  outline:none;
  font-size:16px;
  background:#fafdff;
}

.search-results{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.search-user{
  padding:12px;
  border-radius:15px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
}

.search-avatar{
  width:50px;
  height:50px;
  border-radius:14px;
}

.search-avatar-placeholder{
  width:50px;
  height:50px;
  border-radius:14px;
}

.search-user-name{
  color:var(--navy);
  font-weight:800;
}

.search-user-username{
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}

/* =========================================================
   FOLLOW
========================================================= */

.follow-list{
  border-radius:17px;
  overflow:hidden;
}

.follow-list-header{
  padding:17px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid var(--line);
}

.follow-list-title{
  font-size:22px;
  font-weight:900;
  color:var(--navy);
}

.follow-back{
  background:var(--sky);
  color:var(--navy);
  padding:8px 11px;
  border-radius:10px;
  font-weight:700;
}

.follow-user{
  padding:12px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #edf1f4;
  cursor:pointer;
}

.follow-user:last-child{
  border-bottom:0;
}

.follow-user-info{
  flex:1;
  min-width:0;
}

.follow-user-name{
  font-weight:800;
  color:var(--navy);
}

.follow-user-username{
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}

.follow-status{
  font-size:12px;
  color:var(--green);
  font-weight:800;
}

/* =========================================================
   NOTIFICATIONS
========================================================= */

.notifications-title{
  font-size:30px;
  font-weight:900;
  color:#111;
  margin-bottom:15px;
}

.notifications-actions{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.notification-action{
  padding:9px 12px;
  border-radius:10px;
  background:var(--sky);
  color:var(--navy);
  font-weight:700;
}

.notification-list{
  border-radius:18px;
  overflow:hidden;
}

.notification-item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:13px;
  border-bottom:1px solid #edf1f4;
  cursor:pointer;
}

.notification-item:last-child{
  border-bottom:0;
}

.notification-item.unread{
  background:#f1f8ff;
}

.notification-avatar{
  width:45px;
  height:45px;
  border-radius:14px;
  object-fit:cover;
  background:var(--sky);
  flex-shrink:0;
}

.notification-avatar-placeholder{
  width:45px;
  height:45px;
  border-radius:14px;
  background:var(--navy);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  flex-shrink:0;
}

.notification-main{
  flex:1;
  min-width:0;
}

.notification-text{
  line-height:1.35;
}

.notification-name{
  font-weight:900;
  color:var(--navy);
}

.notification-time{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.notification-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--red);
  flex-shrink:0;
}

/* =========================================================
   MESSAGES
========================================================= */

.messages-title{
  font-size:30px;
  font-weight:900;
  color:#111;
  margin-bottom:17px;
}

.messages-search{
  position:relative;
  margin-bottom:12px;
}

.messages-search-input{
  width:100%;
  height:54px;
  padding:0 20px 0 50px;
  border:0;
  border-radius:28px;
  background:#e9e9ed;
  outline:none;
  font-size:17px;
}

.messages-search-icon{
  position:absolute;
  left:18px;
  top:50%;
  transform:translateY(-50%);
  font-size:22px;
  color:#555;
}

.conversations{
  border-radius:18px;
  overflow:hidden;
}

.conversation{
  min-height:85px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #e5e5e5;
  cursor:pointer;
}

.conversation:last-child{
  border-bottom:0;
}

.conversation-avatar{
  width:58px;
  height:58px;
  border-radius:14px;
  object-fit:cover;
  background:var(--sky);
  flex-shrink:0;
  order:3;
}

.conversation-placeholder{
  width:58px;
  height:58px;
  border-radius:14px;
  background:var(--navy);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  font-weight:900;
  order:3;
}

.conversation-main{
  flex:1;
  min-width:0;
  order:1;
}

.conversation-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.conversation-name{
  font-size:17px;
  font-weight:800;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.conversation-name.unread{
  font-weight:900;
}

.conversation-time{
  color:#777;
  font-size:12px;
}

.conversation-preview{
  color:#777;
  margin-top:5px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.conversation-preview.unread{
  color:var(--navy);
  font-weight:800;
}

.unread-count{
  order:2;
  min-width:21px;
  height:21px;
  padding:0 6px;
  border-radius:11px;
  background:var(--red);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:900;
}

.message-user-result{
  background:#fff;
  border-bottom:1px solid #e5e5e5;
  padding:12px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
}

/* =========================================================
   GROUP
========================================================= */

.group-create-button{
  width:100%;
  margin-bottom:12px;
  padding:12px;
  border-radius:12px;
  background:var(--navy);
  color:#fff;
  font-weight:800;
}

.group-card{
  border-radius:18px;
  overflow:hidden;
  margin-bottom:12px;
}

.group-card-main{
  padding:13px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
}

.group-icon{
  width:58px;
  height:58px;
  border-radius:14px;
  background:var(--sky);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  flex-shrink:0;
}

.group-info{
  min-width:0;
  flex:1;
}

.group-name{
  font-weight:900;
  color:var(--navy);
}

.group-members{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.group-create-list{
  max-height:400px;
  overflow:auto;
  margin-top:10px;
  border:1px solid var(--line);
  border-radius:12px;
}

.friend-select{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  border-bottom:1px solid #edf1f4;
}

.friend-select:last-child{
  border-bottom:0;
}

.friend-select input{
  width:18px;
  height:18px;
  order:3;
}

.friend-select-info{
  flex:1;
}

/* =========================================================
   CHAT
========================================================= */

.chat-page{
  height:calc(100vh - 154px);
  height:calc(100dvh - 154px);
  flex-direction:column;
}

.chat-page.active{
  display:flex;
}

.chat-header{
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  padding:10px;
  display:flex;
  align-items:center;
  gap:10px;
}

.chat-back{
  background:transparent;
  color:var(--navy);
  font-size:28px;
  padding:3px 7px;
}

.chat-avatar{
  width:43px;
  height:43px;
  border-radius:14px;
  object-fit:cover;
}

.chat-avatar-placeholder{
  width:43px;
  height:43px;
  border-radius:14px;
  background:var(--navy);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.chat-user-info{
  min-width:0;
}

.chat-user-name{
  color:var(--navy);
  font-weight:900;
}

.chat-user-username{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.chat-messages{
  flex:1;
  overflow-y:auto;
  padding:15px 4px;
  display:flex;
  flex-direction:column;
  gap:7px;
  min-height:0;
}

.chat-empty{
  text-align:center;
  color:var(--muted);
  padding:30px 10px;
}

.message-row{
  display:flex;
}

.message-row.mine{
  justify-content:flex-end;
}

.message-row.theirs{
  justify-content:flex-start;
}

.message-wrap{
  max-width:78%;
  position:relative;
}

.message-sender{
  color:var(--navy);
  font-size:11px;
  font-weight:900;
  margin:0 0 4px 7px;
  opacity:.8;
}

.message-bubble{
  padding:10px 13px;
  border-radius:18px;
  line-height:1.35;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.mine .message-bubble{
  background:var(--navy);
  color:#fff;
  border-bottom-right-radius:5px;
}

.theirs .message-bubble{
  background:#fff;
  border:1px solid var(--line);
  border-bottom-left-radius:5px;
}

.message-time{
  margin-top:4px;
  font-size:10px;
  opacity:.65;
  text-align:right;
}

.message-actions{
  display:flex;
  gap:8px;
  margin-top:3px;
  justify-content:flex-end;
}

.message-actions button{
  background:transparent;
  color:var(--muted);
  font-size:11px;
  padding:1px;
}

.message-actions .delete{
  color:var(--red);
}

.chat-input-area{
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  padding:8px;
  display:flex;
  gap:8px;
}

.chat-input{
  flex:1;
  min-height:44px;
  max-height:110px;
  resize:none;
  border:0;
  background:#f1f3f5;
  border-radius:22px;
  padding:11px 15px;
  outline:none;
}

.chat-send{
  width:44px;
  height:44px;
  border-radius:50%;
  background:var(--navy);
  color:#fff;
}

/* =========================================================
   NAV
========================================================= */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:68px;
  background:rgba(255,255,255,.96);
  border-top:1px solid var(--line);
  z-index:40;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}

.nav-inner{
  max-width:650px;
  height:100%;
  margin:auto;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-button{
  position:relative;
  background:transparent;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  min-width:65px;
  padding:7px 4px;
  font-size:11px;
  font-weight:700;
}

.nav-icon{
  font-size:21px;
}

.nav-button.active{
  color:var(--navy);
}

.nav-badge{
  position:absolute;
  top:1px;
  right:13px;
  min-width:17px;
  height:17px;
  padding:0 4px;
  border-radius:9px;
  background:var(--red);
  color:#fff;
  font-size:9px;
  font-weight:900;
  display:none;
  align-items:center;
  justify-content:center;
}

/* =========================================================
   MODALS
========================================================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(11,31,58,.45);
  align-items:center;
  justify-content:center;
  padding:18px;
}

.modal.active{
  display:flex;
}

.modal-card{
  width:100%;
  max-width:430px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.modal-card h2{
  color:var(--navy);
  margin-top:0;
}

.modal-card input,
.modal-card textarea{
  width:100%;
  margin-top:10px;
}

.modal-card input{
  padding:13px;
  border:1px solid var(--line);
  border-radius:11px;
  outline:none;
}

.status-modal-label{
  display:block;
  margin-top:12px;
  font-size:12px;
  color:var(--muted);
  font-weight:800;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.modal-actions button{
  flex:1;
  padding:11px;
  border-radius:10px;
  font-weight:700;
}

.cancel{
  background:var(--sky);
  color:var(--navy);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  .container{
    margin-top:14px;
    padding-left:12px;
    padding-right:12px;
  }

  .auth-card{
    padding:24px 20px;
  }

  .auth-welcome{
    font-size:34px;
  }

  .profile-hero,
  .public-hero{
    height:128px;
  }

  .cover,
  .public-cover{
    left:128px;
    right:-12px;
    top:11px;
    height:113px;
  }

  .big-avatar,
  .public-avatar,
  .avatar-placeholder,
  .public-avatar-placeholder{
    width:128px;
    height:128px;
    border-radius:8px;
  }

  .profile-identity,
  .public-identity{
    left:145px;
    right:12px;
    top:24px;
  }

  .profile-name,
  .public-name{
    font-size:25px;
  }

  .profile-username,
  .public-username{
    font-size:14px;
  }

  .header-logo{
    width:119px;
  }

  .header-logo-image{
    width:114px;
    height:44px;
    margin-left:5px;
  }

  header{
    padding:0 14px;
  }

  .logout{
    padding:8px 11px;
  }

  .post{
    padding-left:0;
    padding-right:0;
  }

  .post-image{
    width:calc(100% + 24px);
    max-width:none;
    margin-left:-12px;
    border-radius:0;
  }

  .mini-avatar,
  .mini-avatar-placeholder{
    width:58px;
    height:58px;
  }
}

@media(max-width:380px){

  .auth-welcome{
    font-size:30px;
  }

  .auth-card{
    padding:21px 17px;
  }

  .auth-choice-button,
  .auth-form button{
    min-height:54px;
    font-size:17px;
  }

  .header-logo{
    width:114px;
  }

  .header-logo-image{
    width:110px;
  }

  .logout{
    padding:8px 9px;
  }
}
</style>
</head>

<body>

<section id="authScreen">

  <video
    class="auth-video"
    autoplay
    muted
    loop
    playsinline
    preload="auto">
    <source
      src="https://jrzoexmvgyyitojbcxvr.supabase.co/storage/v1/object/public/Stenka/auth-bg.mp4/No%20Cap%20zastavka.mp4"
      type="video/mp4">
  </video>

  <div class="auth-overlay"></div>

  <div class="auth-content">

    <div class="auth-welcome">
      Добро пожаловать<br>
      в <span class="nocap">NoCap</span>
    </div>

    <div class="auth-card">

      <div id="authChoice">

        <button
          class="primary auth-choice-button"
          onclick="showAuthForm('login')">
          Войти
        </button>

        <button
          class="secondary auth-choice-button"
          onclick="showAuthForm('signup')">
          Создать аккаунт
        </button>

      </div>

      <div id="loginForm" class="auth-form">

        <h2>Войти</h2>

        <input
          id="loginEmail"
          type="email"
          placeholder="Email"
          autocomplete="email">

        <input
          id="loginPassword"
          type="password"
          placeholder="Пароль"
          autocomplete="current-password">

        <label class="remember-me">
          <input id="rememberMe" type="checkbox">
          <span>Запомнить меня</span>
        </label>

        <button
          class="primary"
          onclick="signIn()"
          id="loginButton">
          Войти
        </button>

        <button
          class="back-btn"
          onclick="showAuthChoice()">
          ← Назад
        </button>

      </div>

      <div id="signupForm" class="auth-form">

        <h2>Создать аккаунт</h2>

        <input
          id="signupUsername"
          placeholder="Username"
          maxlength="30"
          autocomplete="username">

        <input
          id="signupEmail"
          type="email"
          placeholder="Email"
          autocomplete="email">

        <input
          id="signupPassword"
          type="password"
          placeholder="Пароль"
          autocomplete="new-password">

        <button
          class="primary"
          onclick="signUp()"
          id="signupButton">
          Создать аккаунт
        </button>

        <button
          class="back-btn"
          onclick="showAuthChoice()">
          ← Назад
        </button>

      </div>

      <div id="authMessage"></div>

    </div>

  </div>

</section>


<div id="app">

<header>

  <div class="header-logo">
    <img
      src="nocap-logo.png1.png"
      class="header-logo-image"
      alt="NoCap">
  </div>

  <div class="header-actions">

    <button
      class="notification-button"
      onclick="showPage('notifications')"
      aria-label="Уведомления">
      🔔
      <span
        id="notificationBadge"
        class="notification-badge">
      </span>
    </button>

    <button
      class="logout"
      onclick="signOut()">
      Выйти
    </button>

  </div>

</header>

<main class="container">

<section id="feedPage" class="page">

  <div class="create-post">

    <textarea
      id="postInput"
      maxlength="5000"
      placeholder="Что у тебя нового?"></textarea>

    <div class="post-photo-tools">

      <button
        class="photo-button"
        onclick="choosePostImage('feed')">
        📷 Фото
      </button>

      <span
        id="postImageName"
        class="photo-name"></span>

    </div>

    <div
      id="postImagePreview"
      class="post-image-preview">
    </div>

    <input
      id="postImageInput"
      type="file"
      accept="image/*"
      hidden
      onchange="previewPostImage(event,'feed')">

    <button
      class="publish"
      id="publishPostButton"
      onclick="createPost()">
      Опубликовать
    </button>

  </div>

  <div id="feed"></div>

</section>


<section id="searchPage" class="page">

  <div class="search-box">

    <input
      id="userSearchInput"
      class="search-input"
      placeholder="🔎 Найти пользователя..."
      oninput="searchUsers()">

  </div>

  <div
    id="searchResults"
    class="search-results">

    <div class="search-empty">
      Начни вводить username или имя
    </div>

  </div>

</section>


<section id="messagesPage" class="page">

  <div class="messages-title">
    СООБЩЕНИЯ
  </div>

  <button
    class="group-create-button"
    onclick="openCreateGroupModal()">
    ＋ Создать общий чат
  </button>

  <div class="messages-search">

    <span class="messages-search-icon">
      ⌕
    </span>

    <input
      id="messageSearchInput"
      class="messages-search-input"
      placeholder="Поиск"
      oninput="searchMessageUsers()">

  </div>

  <div
    id="messageSearchResults"
    style="display:none">
  </div>

  <div id="groupChats"></div>

  <div
    id="conversations"
    class="conversations">
  </div>

</section>


<section
  id="chatPage"
  class="page chat-page">

  <div
    id="chatHeader"
    class="chat-header">
  </div>

  <div
    id="chatMessages"
    class="chat-messages">
  </div>

  <div class="chat-input-area">

    <textarea
      id="chatInput"
      class="chat-input"
      rows="1"
      placeholder="Сообщение..."
      onkeydown="handleChatKey(event)"></textarea>

    <button
      class="chat-send"
      onclick="sendMessage()">
      ↑
    </button>

  </div>

</section>


<section
  id="notificationsPage"
  class="page">

  <div class="notifications-title">
    Уведомления
  </div>

  <div class="notifications-actions">

    <button
      class="notification-action"
      onclick="markAllNotificationsRead()">
      Отметить всё прочитанным
    </button>

  </div>

  <div
    id="notificationList"
    class="notification-list">
  </div>

</section>


<section id="profilePage" class="page">

  <div class="profile-card">
    <div class="profile-hero">
      <div id="profileCover" class="cover"></div>

      <div class="profile-avatar-wrap">
        <div id="profileAvatarContainer"></div>
      </div>

      <div class="profile-identity">
        <div id="profileName" class="profile-name"></div>

/* =========================================================

const SUPABASE_URL =

const SUPABASE_KEY =

const baseHeaders = {

function authHeaders(){

  const token =
    getStoredValue("access_token") ||

/* =========================================================
   AUTH VIDEO
========================================================= */

function armAuthVideoSound(){

  const authScreen =
    document.getElementById("authScreen");

  if(!authScreen)return;

  if(authSoundHandler){

    authScreen.removeEventListener(
      "click",
      authSoundHandler
    );
  }

  authSoundHandler=()=>{

    if(
      authScreen.style.display==="none"
    ){
      return;
    }

    const video =
      document.querySelector(".auth-video");

    if(!video)return;

    video.muted=false;
    video.volume=1;

    video.play().catch(()=>{});
  };

  authScreen.addEventListener(
    "click",
    authSoundHandler
  );
}


/* =========================================================
   AUTH UI
========================================================= */

function showAuthChoice(){

  document.getElementById("authChoice").style.display="flex";
  document.getElementById("loginForm").style.display="none";
  document.getElementById("signupForm").style.display="none";
  document.getElementById("authMessage").textContent="";
}

function showAuthForm(type){

  document.getElementById("authChoice").style.display="none";

  document.getElementById("loginForm").style.display =
    type==="login" ? "block" : "none";

  document.getElementById("signupForm").style.display =
    type==="signup" ? "block" : "none";

  document.getElementById("authMessage").textContent="";
}

function getStoredValue(key){
  return localStorage.getItem(key) || sessionStorage.getItem(key);
}

function clearSession(){
  localStorage.removeItem("access_token");
  localStorage.removeItem("user_id");
  localStorage.removeItem("remember_me");
  localStorage.removeItem("refresh_token");
  sessionStorage.removeItem("access_token");
  sessionStorage.removeItem("user_id");
  sessionStorage.removeItem("remember_me");
  sessionStorage.removeItem("refresh_token");
}

function storeSession(data,remember){
  clearSession();
  const storage=remember ? localStorage : sessionStorage;
  storage.setItem("access_token",data.access_token);
  storage.setItem("user_id",data.user.id);
  storage.setItem("remember_me",remember ? "1" : "0");
  if(data.refresh_token){
    storage.setItem("refresh_token",data.refresh_token);
  }
}

function showAuth(){

  stopChatPolling();

  if(badgeTimer){
    clearInterval(badgeTimer);
    badgeTimer=null;
  }

  document.getElementById("authScreen").style.display="flex";
  document.getElementById("app").style.display="none";

  showAuthChoice();

  const video =
    document.querySelector(".auth-video");

  if(video){

    video.pause();
    video.currentTime=0;

    /*
      На iPhone Safari autoplay со звуком
      блокируется браузером.
      Поэтому стартуем без звука,
      а первый тап включает звук.
    */
    video.muted=true;
    video.volume=1;

    video.play().catch(()=>{});
  }

  armAuthVideoSound();
}


/* =========================================================
   SIGN UP
========================================================= */

async function signUp(){

  const username =
    document.getElementById("signupUsername").value.trim();

  const email =
    document.getElementById("signupEmail").value.trim();

  const password =
    document.getElementById("signupPassword").value;

  const message =
    document.getElementById("authMessage");

  const button =
    document.getElementById("signupButton");

  if(!username || !email || !password){

    message.textContent="Заполни все поля.";

    return;
  }

  if(!/^[a-zA-Z0-9_.-]+$/.test(username)){

    message.textContent=
      "Username: только латиница, цифры, _ . -";

    return;
  }

  if(username.length<3){

    message.textContent=
      "Username должен быть минимум 3 символа.";

    return;
  }

  if(password.length<6){

    message.textContent=
      "Пароль должен быть минимум 6 символов.";

    return;
  }

  button.disabled=true;
  message.textContent="Создаём аккаунт...";

  try{

    const response=await fetch(
      SUPABASE_URL+"/auth/v1/signup",
      {
        method:"POST",
        headers:baseHeaders,
        body:JSON.stringify({
          email,
          password
        })
      }
    );

    const data=await response.json();

    if(!response.ok){

      message.textContent =
        data.msg ||
        data.message ||
        data.error_description ||
        "Ошибка регистрации.";

      return;
    }

    if(!data.user){

      message.textContent=
        "Не удалось создать пользователя.";

      return;
    }

    if(!data.access_token){

      message.textContent=
        "Аккаунт создан. Теперь войди.";

      showAuthForm("login");

      document.getElementById("loginEmail").value=email;

      return;
    }

    localStorage.setItem(
      "access_token",
      data.access_token
    );

    localStorage.setItem(
      "user_id",
      data.user.id
    );

    localStorage.setItem(
      "remember_me",
      "1"
    );

    const ok =
      await createProfile(
        data.user.id,
        username
      );

    if(!ok){

      clearSession();

      message.textContent=
        "Аккаунт создан, но профиль не создался.";

      return;
    }

    await showApp();

  }catch(e){

    console.error(e);

    message.textContent=
      "Ошибка соединения.";

  }finally{

    button.disabled=false;
  }
}


/* =========================================================
   SIGN IN
========================================================= */

async function signIn(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("authMessage");

  const button =
    document.getElementById("loginButton");

  if(!email || !password){

    message.textContent=
      "Введите email и пароль.";

    return;
  }

  button.disabled=true;
  message.textContent="Входим...";

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/auth/v1/token?grant_type=password",
      {
        method:"POST",
        headers:baseHeaders,
        body:JSON.stringify({
          email,
          password
        })
      }
    );

    const data=await response.json();

    if(!response.ok){

      message.textContent =
        data.msg ||
        data.message ||
        data.error_description ||
        "Неверный email или пароль.";

      return;
    }

    const rememberMe =
      document.getElementById("rememberMe").checked;

    storeSession(data,rememberMe);

    await showApp();

  }catch(e){

    console.error(e);

    message.textContent=
      "Ошибка соединения.";

  }finally{

    button.disabled=false;
  }
}


/* =========================================================
   SESSION
========================================================= */

async function refreshSession(){

  const refreshToken=getStoredValue("refresh_token");
  const userId=getStoredValue("user_id");
  const remember=getStoredValue("remember_me")==="1";

  if(!refreshToken || !userId)return false;

  try{
    const response=await fetch(
      SUPABASE_URL+"/auth/v1/token?grant_type=refresh_token",
      {
        method:"POST",
        headers:baseHeaders,
        body:JSON.stringify({refresh_token:refreshToken})
      }
    );

    if(!response.ok)return false;

    const data=await response.json();
    if(!data.access_token || !data.user)return false;

    storeSession(data,remember);
    return data.user.id===userId;
  }catch(e){
    console.error(e);
    return false;
  }
}

async function validateSession(){

  const token=getStoredValue("access_token");
  const userId=getStoredValue("user_id");

  if(!token || !userId)return false;

  try{
    const response=await fetch(
      SUPABASE_URL+"/auth/v1/user",
      {headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+token}}
    );

    if(response.ok){
      const user=await response.json();
      if(user.id===userId)return true;
    }

    const refreshed=await refreshSession();
    if(refreshed)return true;

    clearSession();
    return false;
  }catch(e){
    console.error(e);
    return await refreshSession();
  }
}

  stopChatPolling();

  if(badgeTimer){

    badgeTimer=null;

  currentChatUser=null;

async function createProfile(id,username){

  try{

    const response=await fetch(
      SUPABASE_URL+"/rest/v1/profiles",
      {
        method:"POST",
        headers:{
          ...authHeaders(),
          Prefer:"return=minimal"
        },
        body:JSON.stringify({
          id,
          username,
          display_name:username,
          bio:"",
          avatar_url:"",
          cover_url:""
        })
      }
    );

    if(response.ok){

      profilesCache=null;
      profilesCacheTime=0;

      return true;
    }

    console.error(await response.text());

    return false;

  }catch(e){

    console.error(e);

    return false;
  }
}

async function loadProfile(){

  const id = getStoredValue("user_id");

  if(!id)return null;

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/profiles?id=eq."+
      encodeURIComponent(id)+
      "&select=*",
      {
        headers:authHeaders()
      }
    );

    if(!response.ok)return null;

    let rows=await response.json();

    if(!rows.length){
      const userResponse=await fetch(
        SUPABASE_URL+"/auth/v1/user",
        {headers:authHeaders()}
      );
      if(!userResponse.ok)return null;
      const user=await userResponse.json();
      const rawBase=(user.email||"user").split("@")[0].replace(/[^a-zA-Z0-9_.-]/g,"").slice(0,24) || "user";
      const base=rawBase+"_"+Date.now().toString(36).slice(-4);
      const create=await fetch(
        SUPABASE_URL+"/rest/v1/profiles",
        {
          method:"POST",
          headers:{...authHeaders(),Prefer:"return=representation"},
          body:JSON.stringify({id,username:base,display_name:base,bio:"",avatar_url:"",cover_url:""})
        }
      );
      if(!create.ok)return null;
      const created=await create.json();
      if(!created.length)return null;
      rows=created;
    }

    const profile=rows[0];

    window.currentProfile=profile;

    document.getElementById("profileName").textContent =
      profile.display_name ||
      profile.username;

    document.getElementById("profileUsername").textContent =
      "@"+profile.username;

    renderAvatar(
      "profileAvatarContainer",
      profile,
      "big"
    );
    renderCover("profileCover",profile);

    const postCountPromise=fetch(
      SUPABASE_URL+"/rest/v1/posts?user_id=eq."+encodeURIComponent(id)+"&select=id",
      {headers:authHeaders()}
    );
    const [postCountResponse]=await Promise.all([
      postCountPromise,
      loadFollowStats(id,"myFollowersCount","myFollowingCount")
    ]);
    const postRows=postCountResponse.ok ? await postCountResponse.json() : [];
    document.getElementById("myPostsCount").textContent=postRows.length;

    return profile;

  }catch(e){

    console.error(e);

    return null;
  }
}

function renderAvatar(containerId,profile,type){

  const container =
    document.getElementById(containerId);

  if(!container)return;

  container.innerHTML="";

  if(profile.avatar_url){

    img.src=profile.avatar_url;
    img.alt="";
    img.loading="lazy";
    img.decoding="async";

    img.className =
      type==="big"
        ? "big-avatar"
        : type==="public"
        ? "public-avatar"
        : type==="chat"
        ? "chat-avatar"
        : "mini-avatar";

    container.appendChild(img);

    return;
  }

  const div=document.createElement("div");

  div.className =
    type==="big"
      ? "avatar-placeholder"
      : type==="public"
      ? "public-avatar-placeholder"
      : type==="chat"
      ? "chat-avatar-placeholder"
      : "mini-avatar-placeholder";

  div.textContent=(
    profile.display_name ||
    profile.username ||
    "N"
  ).charAt(0).toUpperCase();

  container.appendChild(div);
}

async function uploadAvatar(){

  const input =
    document.getElementById("avatarInput");

  const file=input.files[0];

  if(!file)return;

  if(!file.type.startsWith("image/")){

    alert("Можно загружать только изображения.");

    input.value="";

    return;
  }

  if(file.size>10*1024*1024){

    alert("Максимальный размер: 10 МБ.");

    input.value="";

    return;
  }

  const id =
    getStoredValue("user_id");

  try{

    const prepared =
      await prepareImageForUpload(file);

    const ext =
      getImageExtension(
        prepared.type,
        file.name
      );

    const path =
      id+
      "/"+
      Date.now()+
      "-avatar."+
      ext;

    const upload =
      await uploadToStorage(
        path,
        prepared
      );

    if(!upload.ok){

      alert(
        "Ошибка загрузки:\n"+
        upload.text
      );

      return;
    }

    const url =
      SUPABASE_URL+
      "/storage/v1/object/public/Stenka/"+
      path;

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/profiles?id=eq."+
      encodeURIComponent(id),
      {
        method:"PATCH",
        headers:{
          ...authHeaders(),
          Prefer:"return=representation"
        },
        body:JSON.stringify({
          avatar_url:url
        })
      }
    );

    if(!response.ok){

      alert(
        "Фото загрузилось, но профиль не обновился."
      );

      return;
    }

    profilesCache=null;
    profilesCacheTime=0;

    input.value="";

    await loadProfile();

  }catch(e){

    console.error(e);

    alert("Ошибка загрузки аватарки.");
  }
}

async function saveProfile(){

  const id =
    getStoredValue("user_id");

  const display_name =
    document
      .getElementById("editDisplayName")
      .value
      .trim();

  const username =
    document
      .getElementById("editUsername")
      .value
      .trim();

  const bio =
    document
      .getElementById("editBio")
      .value
      .trim();

  if(!username){

    alert("Username не может быть пустым.");

    return;
  }

  if(!/^[a-zA-Z0-9_.-]+$/.test(username)){

    alert(
      "Username: только латиница, цифры, _ . -"
    );

    return;
  }

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/profiles?id=eq."+
      encodeURIComponent(id),
      {
        method:"PATCH",
        headers:{
          ...authHeaders(),
          Prefer:"return=representation"
        },
        body:JSON.stringify({
          display_name,
          username,
          bio
        })
      }
    );

    if(!response.ok){

      const text=await response.text();

      if(
        text.includes("23505") ||
        text.includes("duplicate")
      ){

        alert(
          "Этот username уже занят."
        );

      }else{

        alert(
          "Не удалось сохранить:\n"+
          text
        );
      }

      return;
    }

    profilesCache=null;
    profilesCacheTime=0;

    await loadProfile();
    showPage("profile");

  }catch(e){

    console.error(e);

    alert("Ошибка сохранения.");
  }
}

async function isFollowing(target){

  const me =
    getStoredValue("user_id");

  if(!me || me===target)return false;

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/follows?follower_id=eq."+
      encodeURIComponent(me)+
      "&following_id=eq."+
      encodeURIComponent(target)+
      "&select=follower_id",
      {
        headers:authHeaders()
      }
    );

    if(!response.ok)return false;

    return (await response.json()).length>0;

  }catch{

    return false;
  }
}

async function isFriend(target){

  const me =
    getStoredValue("user_id");

  if(!me || me===target)return false;

  try{

    const [a,b]=await Promise.all([

      fetch(
        SUPABASE_URL+
        "/rest/v1/follows?follower_id=eq."+
        encodeURIComponent(me)+
        "&following_id=eq."+
        encodeURIComponent(target)+
        "&select=follower_id",
        {
          headers:authHeaders()
        }
      ),

      fetch(
        SUPABASE_URL+
        "/rest/v1/follows?follower_id=eq."+
        encodeURIComponent(target)+
        "&following_id=eq."+
        encodeURIComponent(me)+
        "&select=follower_id",
        {
          headers:authHeaders()
        }
      )

    ]);

    if(!a.ok || !b.ok)return false;

    return(
      (await a.json()).length>0 &&
      (await b.json()).length>0
    );

  }catch{

    return false;
  }
}

async function toggleFollow(target){

  const me =
    getStoredValue("user_id");

  if(!me || me===target)return;

  try{

    const following =
      await isFollowing(target);

    if(following){

      const response=await fetch(
        SUPABASE_URL+
        "/rest/v1/follows?follower_id=eq."+
        encodeURIComponent(me)+
        "&following_id=eq."+
        encodeURIComponent(target),
        {
          method:"DELETE",
          headers:authHeaders()
        }
      );

      if(!response.ok){

        alert("Не удалось отписаться.");

        return;
      }

    }else{

      const response=await fetch(
        SUPABASE_URL+
        "/rest/v1/follows",
        {
          method:"POST",
          headers:{
            ...authHeaders(),
            Prefer:"return=minimal"
          },
          body:JSON.stringify({
            follower_id:me,
            following_id:target
          })
        }
      );

      if(!response.ok){

        const text=await response.text();

        if(
          !text.includes("23505") &&
          !text.includes("duplicate")
        ){

          alert(
            "Не удалось подписаться:\n"+
            text
          );

          return;
        }
      }
    }

    await renderPublicActions(target);

    if(publicProfile){

      await loadFollowStats(
        target,
        "publicFollowersCount",
        "publicFollowingCount"
      );
    }

    await loadFollowStats(
      me,
      "myFollowersCount",
      "myFollowingCount"
    );

  }catch(e){

    console.error(e);

    alert("Ошибка подписки.");
  }
}

  publicProfile=profile;

  showPage("publicProfile");

    "publicName"
  ).textContent="Загрузка...";

  document.getElementById(
    "publicUsername"
  ).textContent="";

  document.getElementById(
    "publicActions"
  ).innerHTML="";

  document.getElementById(
    "publicFriendBadge"
  ).innerHTML="";

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/profiles?id=eq."+
      encodeURIComponent(profile.id)+
      "&select=*",
      {
        headers:authHeaders()
      }
    );

    if(!response.ok){

      throw new Error(
        await response.text()
      );
    }

    const rows=await response.json();

    await loadFollowStats(
      publicProfile.id,
      "publicFollowersCount",
      "publicFollowingCount"
    );

      publicProfile.id
    );

    );

  }catch(e){

      "Не удалось открыть профиль."
    );
  }

async function renderPublicActions(target){

  const container =
    document.getElementById("publicActions");

  const badge =
    document.getElementById("publicFriendBadge");

  const me =
    getStoredValue("user_id");

  container.innerHTML="";
  badge.innerHTML="";

  if(!me)return;

  if(me===target){

    const b=document.createElement("button");

    b.className="public-action";
    b.textContent="Это ваш профиль";
    b.disabled=true;

    container.appendChild(b);

    return;
  }

  const following =
    await isFollowing(target);

  const friend =
    await isFriend(target);

  if(friend){

    badge.innerHTML =
      '<div class="friend-badge">🤝 Друзья</div>';
  }

  const follow=document.createElement("button");

  follow.className =
    "public-action"+
    (following ? " following" : "");

  follow.textContent =
    following
      ? "✓ Вы подписаны"
      : "Подписаться";

  follow.onclick=async()=>{

    follow.disabled=false;

  message.className="public-action";
  message.textContent="💬 Написать";

    document.getElementById(
      "followListTitle"

        ? "following_id"

        : "following_id";

      "/rest/v1/follows?"+
      column+

        headers:authHeaders()

        document.createElement("div");

      username.className=

        "@"+profile.username;

      info.appendChild(name);

          document.createElement("div");

        item.appendChild(status);
      }

      };

    }

  }catch(e){

    console.error(e);

    content.innerHTML =
      '<div class="search-empty">Не удалось загрузить список.</div>';
  }
}

function appendFollowAvatar(
  container,
  profile
){

  if(profile.avatar_url){

    const img =
      document.createElement("img");

    img.className="search-avatar";
    img.src=profile.avatar_url;
    img.alt="";
    img.loading="lazy";
    img.decoding="async";

    container.appendChild(img);

  }else{

    const d =
      document.createElement("div");

    d.className=
      "search-avatar-placeholder";

    d.textContent=(
      profile.display_name ||
      profile.username ||
      "N"
    ).charAt(0).toUpperCase();

    container.appendChild(d);
  }
}

async function getProfilesByIds(ids){

  if(!ids.length)return [];

  const unique=[
    ...new Set(ids)
  ];

  const response=await fetch(
    SUPABASE_URL+
    "/rest/v1/profiles?id=in.("+
    unique
      .map(encodeURIComponent)
      .join(",")+
    ")"+
    "&select=id,username,display_name,avatar_url,cover_url,bio",
    {
      headers:authHeaders()
    }
  );

  if(!response.ok)return [];

  const rows=await response.json();

  const map={};

  rows.forEach(p=>{
    map[p.id]=p;
  });

  return unique
    .map(id=>map[id])
    .filter(Boolean);
}

function searchUsers(){

async function performUserSearch(){

  const input =
    document.getElementById(
      "userSearchInput"
    );

  const results =
    document.getElementById(
      "searchResults"
    );

  const q =
    input.value.trim();

  if(!q){

    results.innerHTML =
      '<div class="search-empty">Начни вводить username или имя</div>';

    return;
  }

  results.innerHTML =
    '<div class="search-empty">Ищем...</div>';

  const safe =
    q.replace(/[,*()]/g,"");

  if(!safe){

    results.innerHTML =
      '<div class="search-empty">Введи имя пользователя.</div>';

    return;
  }

  try{

    const pattern =
      "*"+safe+"*";

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/profiles?or="+
      encodeURIComponent(
        "(username.ilike."+pattern+
        ",display_name.ilike."+pattern+")"
      )+
      "&select=id,username,display_name,avatar_url"+
      "&limit=30",
      {
        headers:authHeaders()
      }
    );

    if(!response.ok){
      throw new Error();
    }

    const rows=await response.json();

    results.innerHTML="";

    if(!rows.length){

      results.innerHTML =
        '<div class="search-empty">Пользователей не найдено.</div>';

      return;
    }

    rows.forEach(profile=>{

      const item =
        document.createElement("div");

      item.className="search-user";

      item.onclick=()=>{
        openFoundProfile(profile);
      };

      appendFollowAvatar(
        item,
        profile
      );

      const info =
        document.createElement("div");

      const name =
        document.createElement("div");

      name.className=
        "search-user-name";

      name.textContent =
        profile.display_name ||
        profile.username;

      const username =
        document.createElement("div");

      username.className=
        "search-user-username";

      username.textContent =
        "@"+profile.username;

      info.appendChild(name);
      info.appendChild(username);

      item.appendChild(info);

      results.appendChild(item);
    });

  }catch(e){

    console.error(e);

    results.innerHTML =
      '<div class="search-empty">Ошибка поиска.</div>';
  }
}


/* =========================================================
   PROFILE CACHE
========================================================= */

async function loadProfilesMap(force=false){

  if(
    !force &&
    profilesCache &&
    Date.now()-profilesCacheTime<
      PROFILE_CACHE_TIME
  ){

    return profilesCache;
  }

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/profiles?select=id,username,display_name,avatar_url,cover_url",
      {
        headers:authHeaders()
      }
    );

    if(!response.ok){

      return profilesCache || {};
    }

    const rows=await response.json();

    const map={};

    rows.forEach(p=>{
      map[p.id]=p;
    });

    profilesCache=map;
    profilesCacheTime=Date.now();

    return map;

  }catch{

    return profilesCache || {};
  }
}


/* =========================================================
   COMMENTS
========================================================= */

async function getCommentsForPosts(posts){

  if(!posts.length)return {};

  const ids =
    posts.map(p=>p.id);

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/comments?post_id=in.("+
      ids.join(",")+
      ")"+
      "&select=*&order=created_at.asc",
      {
        headers:authHeaders()
      }
    );

    if(!response.ok)return {};

    const rows=await response.json();

    const map={};

    rows.forEach(comment=>{

      if(!map[comment.post_id]){
        map[comment.post_id]=[];
      }

      map[comment.post_id].push(comment);
    });

    return map;

  }catch{

    return {};
  }
}

function renderPost(
  post,
  container,
  profiles,
  comments=[]
){

  const profile =
    profiles[post.user_id];

  const username =
    (profile ? profile.username : null) ||
    post.username ||
    "user";

  const display =
    (profile ? profile.display_name : null) ||
    username;

  const me =
    getStoredValue("user_id");

  const own =
    post.user_id===me;

  const div =
    document.createElement("div");

  div.className="post";

  div.dataset.postId=post.id;

  const top =
    document.createElement("div");

  top.className="post-top";

  const user =
    document.createElement("div");

  user.className="post-user";

  if(profile){

    user.onclick=()=>{
      openFoundProfile(profile);
    };

    if(profile.avatar_url){

      const img =
        document.createElement("img");

      img.className="mini-avatar";
      img.src=profile.avatar_url;
      img.alt="";
      img.loading="lazy";
      img.decoding="async";

      user.appendChild(img);

    }else{

      const a =
        document.createElement("div");

      a.className=
        "mini-avatar-placeholder";

      a.textContent =
        display
          .charAt(0)
          .toUpperCase();

      user.appendChild(a);
    }
  }

  const info =
    document.createElement("div");

  const name =
    document.createElement("div");

  name.className="user-name";
  name.textContent=display;

  const handle =
    document.createElement("div");

  handle.className="user-handle";
  handle.textContent="@"+username;

  info.appendChild(name);
  info.appendChild(handle);

  user.appendChild(info);
  top.appendChild(user);

  if(own){

    const menu =
      document.createElement("div");

    menu.className="post-menu";

    const menuButton =
      document.createElement("button");

    menuButton.className=
      "post-menu-button";

    menuButton.textContent="•••";

    const list =
      document.createElement("div");

    list.className="post-menu-list";

    const edit =
      document.createElement("button");

    edit.textContent="✏️ Редактировать";

    edit.onclick=()=>{

      menu.classList.remove("open");

      editPost(post);
    };

    const remove =
      document.createElement("button");

    remove.className="danger";
    remove.textContent="🗑️ Удалить";

    remove.onclick=()=>{

      menu.classList.remove("open");

      deletePost(post);
    };

    list.appendChild(edit);
    list.appendChild(remove);

    menuButton.onclick=e=>{

      e.stopPropagation();

      menu.classList.toggle("open");
    };

    menu.appendChild(menuButton);
    menu.appendChild(list);

    top.appendChild(menu);
  }

  div.appendChild(top);

  if(post.content){

    const text =
      document.createElement("div");

    text.className="post-text";
    text.textContent=post.content;

    div.appendChild(text);
  }

  if(
    post.image_url &&
    isAllowedImageUrl(post.image_url)
  ){

    const img =
      document.createElement("img");

    img.className="post-image";
    img.src=post.image_url;
    img.loading="lazy";
    img.decoding="async";
    img.alt="Фото";

    div.appendChild(img);
  }

  const actions =
    document.createElement("div");

  actions.className="actions";

  const reaction =
    localStorage.getItem(
      "reaction_"+post.id

let favoriteIdsCache=null;
let favoriteIdsPromise=null;

async function loadFavoriteIds(force){
  if(!force && favoriteIdsCache)return favoriteIdsCache;
  if(!force && favoriteIdsPromise)return favoriteIdsPromise;
  const userId=getStoredValue("user_id");
  if(!userId)return new Set();
  favoriteIdsPromise=(async function(){
    try{
      const r=await fetch(SUPABASE_URL+"/rest/v1/Favorites?user_id=eq."+encodeURIComponent(userId)+"&select=post_id",{headers:authHeaders()});
      if(!r.ok)return favoriteIdsCache || new Set();
      const rows=await r.json();
      favoriteIdsCache=new Set(rows.map(function(x){return String(x.post_id);}));
      return favoriteIdsCache;
    }catch(e){ return favoriteIdsCache || new Set(); }
    finally{favoriteIdsPromise=null;}
  })();
  return favoriteIdsPromise;
}

async function updateFavoriteButton(button,postId){
  const ids=await loadFavoriteIds(false);
  const active=ids.has(String(postId));
  button.classList.toggle("active",active);
  button.textContent=active ? "★ Сохранено" : "☆ Сохранить";
}

async function toggleFavorite(postId,button){
  const userId=getStoredValue("user_id");
  if(!userId)return;
  button.disabled=true;
  try{
    const ids=await loadFavoriteIds(false);
    const active=ids.has(String(postId));
    let r;
    if(active){
      r=await fetch(SUPABASE_URL+"/rest/v1/Favorites?user_id=eq."+encodeURIComponent(userId)+"&post_id=eq."+encodeURIComponent(postId),{method:"DELETE",headers:authHeaders()});
    }else{
      r=await fetch(SUPABASE_URL+"/rest/v1/Favorites",{method:"POST",headers:{...authHeaders(),Prefer:"return=minimal"},body:JSON.stringify({user_id:userId,post_id:postId})});
    }
    if(!r.ok){ alert("Не удалось изменить Избранное.\n"+await r.text()); return; }
    favoriteIdsCache=null;
    await updateFavoriteButton(button,postId);
  }catch(e){ console.error(e); alert("Ошибка Избранного."); }
  finally{ button.disabled=false; }
}

async function loadFavorites(){
  const wall=document.getElementById("favoritesWall");
  if(!wall)return;
  const userId=getStoredValue("user_id");
  wall.innerHTML='<div class="wall-empty">Загружаем...</div>';
  try{
    const f=await fetch(SUPABASE_URL+"/rest/v1/Favorites?user_id=eq."+encodeURIComponent(userId)+"&select=post_id,created_at&order=created_at.desc&limit=100",{headers:authHeaders()});
    if(!f.ok)throw new Error(await f.text());
    const favs=await f.json();
    if(!favs.length){wall.innerHTML='<div class="wall-empty">Сохранённых постов пока нет.</div>';return;}
    const ids=favs.map(function(x){return x.post_id;});
    const p=await fetch(SUPABASE_URL+"/rest/v1/posts?id=in.("+ids.map(encodeURIComponent).join(",")+")&select=*&limit=100",{headers:authHeaders()});
    if(!p.ok)throw new Error(await p.text());
    const posts=await p.json();
    const byId={}; posts.forEach(function(x){byId[String(x.id)]=x;});
    const ordered=ids.map(function(id){return byId[String(id)];}).filter(Boolean);
    const profiles=await loadProfilesMap();
    const comments=await getCommentsForPosts(ordered);
    wall.innerHTML="";
    ordered.forEach(function(post){renderPost(post,wall,profiles,comments[post.id] || []);});
  }catch(e){console.error(e);wall.innerHTML='<div class="wall-empty">Не удалось загрузить Избранное.</div>';}
}

function showProfileTab(tab){
  const wall=tab==="wall";
  document.getElementById("profileWallSection").classList.toggle("active",wall);
  document.getElementById("profileFavoritesSection").classList.toggle("active",!wall);
  document.getElementById("profileWallTab").classList.toggle("active",wall);
  document.getElementById("profileFavoritesTab").classList.toggle("active",!wall);
  if(!wall)loadFavorites();
}

async function editPost(post){

  const value =
    prompt(
      "Измени публикацию:",
      post.content || ""
    );

  if(value===null)return;

  const content=value.trim();

  if(!content && !post.image_url){

    alert(
      "Публикация не может быть полностью пустой."
    );

    return;
  }

  const me =
    getStoredValue("user_id");

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/posts?id=eq."+
      encodeURIComponent(post.id)+
      "&user_id=eq."+
      encodeURIComponent(me),
      {
        method:"PATCH",
        headers:{
          ...authHeaders(),
          Prefer:"return=minimal"
        },
        body:JSON.stringify({
          content,
          updated_at:new Date().toISOString()
        })
      }
    );

    if(!response.ok){

      alert(
        "Не удалось изменить публикацию:\n"+
        await response.text()
      );

      return;
    }

    await loadPosts();
    await loadWall();

    if(publicProfile){

      await loadPublicWall(
        publicProfile.id
      );
    }

  }catch(e){

    console.error(e);

    alert("Ошибка редактирования.");
  }
}

async function deletePost(post){

  if(!confirm("Удалить эту публикацию?")){
    return;
  }

  const me =
    getStoredValue("user_id");

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/posts?id=eq."+
      encodeURIComponent(post.id)+
      "&user_id=eq."+
      encodeURIComponent(me),
      {
        method:"DELETE",
        headers:{
          ...authHeaders(),
          Prefer:"return=representation"
        }
      }
    );

    const deleted =
      response.ok
        ? await response.json().catch(()=>[])
        : [];

    if(!response.ok){

      alert(
        "Не удалось удалить публикацию:\n"+
        await response.text()
      );

      return;
    }

    if(
      Array.isArray(deleted) &&
      deleted.length===0
    ){

      alert(
        "Сервер не удалил публикацию. Проверь RLS-политику DELETE для posts."
      );

      return;
    }

    if(
      post.image_url &&
      isAllowedImageUrl(post.image_url)
    ){

      const marker =
        "/storage/v1/object/public/Stenka/";

      const index =
        post.image_url.indexOf(marker);

      if(index!==-1){

        const path =
          decodeURIComponent(
            post.image_url.slice(
              index+marker.length
            )
          );

        await deleteStorageFile(path);
      }
    }

    await loadPosts();
    await loadWall();

    if(publicProfile){

      await loadPublicWall(
        publicProfile.id
      );
    }

  }catch(e){

    console.error(e);

    alert("Ошибка удаления.");
  }
}

      if(profile){
        openFoundProfile(profile);
      }
    };

    wrapper.appendChild(avatar);
  }

    document.createElement("div");

  main.className="comment-main";

  const head =
    document.createElement("div");

  head.className="comment-head";

    document.createElement("div");

  author.className="comment-author";

  author.textContent =
    (profile ? profile.display_name : null) ||

  if(profile){

    author.style.cursor="pointer";

    author.onclick=()=>{
      openFoundProfile(profile);
    };
  }

  const date =
    document.createElement("div");

  date.className="comment-date";

      comment.created_at
    );

  head.appendChild(author);
  head.appendChild(date);

    document.createElement("div");

        comment,
        container

    actions.appendChild(edit);
    actions.appendChild(remove);

  }

  container.appendChild(wrapper);

function previewPostImage(
  event,
  type
){

  const input =
    event.target;

  const file =
    input.files[0];

  const preview =
    document.getElementById(
      type==="wall"
        ? "wallImagePreview"
        : "postImagePreview"
    );

  const name =
    document.getElementById(
      type==="wall"
        ? "wallImageName"
        : "postImageName"
    );

  preview.innerHTML="";
  preview.classList.remove("has-image");
  name.textContent="";

  if(!file)return;

  if(!file.type.startsWith("image/")){

    alert(
      "Можно выбрать только изображение."
    );

    input.value="";

    return;
  }

  if(file.size>10*1024*1024){

    alert(
      "Максимальный размер: 10 МБ."
    );

    input.value="";

    return;
  }

  name.textContent=file.name;

  const reader =
    new FileReader();

  reader.onload=()=>{

    const img =
      document.createElement("img");

    img.src=reader.result;

    const remove =
      document.createElement("button");

    remove.className="remove-photo";
    remove.textContent="×";

    remove.onclick=()=>{

      input.value="";
      preview.innerHTML="";
      preview.classList.remove(

      );
      name.textContent="";
    };

    preview.appendChild(img);
    preview.appendChild(remove);

    preview.classList.add(
      "has-image"
    );
  };

  reader.readAsDataURL(file);

function getImageExtension(
  mime,
  name
){

  if(mime==="image/jpeg")return"jpg";
  if(mime==="image/png")return"png";
  if(mime==="image/webp")return"webp";
  if(mime==="image/gif")return"gif";

  return(
    name
      .split(".")
      .pop()
       .toLowerCase() ||
    "jpg"
  );
}

function loadImage(file){

  return new Promise(
    (resolve,reject)=>{

      const url =
        URL.createObjectURL(file);

      const image =
        new Image();

      image.onload=()=>{

        URL.revokeObjectURL(url);

        resolve(image);
      };

      image.onerror=()=>{

        URL.revokeObjectURL(url);

        reject();
      };

      image.src=url;
    }
  );
}

async function prepareImageForUpload(file){

  if(
    ![
      "image/jpeg",
      "image/png",
      "image/webp"
    ].includes(file.type) ||
    file.size<1200000
  ){

    return file;
  }

  try{

    const image =
      await loadImage(file);

    const max=2000;

    const scale =
      Math.min(
        1,
        max/
        Math.max(
          image.naturalWidth,
          image.naturalHeight
        )
      );

    const canvas =
      document.createElement("canvas");

    canvas.width =
      Math.round(
        image.naturalWidth*scale
      );

    canvas.height =
      Math.round(
        image.naturalHeight*scale
      );

    const ctx =
      canvas.getContext("2d");

    ctx.drawImage(
      image,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const blob =
      await new Promise(
        resolve=>
          canvas.toBlob(
            resolve,
            "image/jpeg",
            .82
          )
      );

    if(!blob)return file;

    return new File(
      [blob],
      "photo.jpg",
      {
        type:"image/jpeg"
      }
    );

  }catch{

    return file;
  }
}

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/storage/v1/object/Stenka/"+
      path,
      {
        method:"POST",
        headers:{
          apikey:SUPABASE_KEY,
          Authorization:
            "Bearer "+token,
          "Content-Type":
            file.type ||

async function createPostInDatabase(
  text,
  file
){

  const userId =
    localStorage.getItem(
      "user_id"
    );

  if(!userId)return false;

  let uploadedPath=null;

  try{

    let imageUrl=null;

    if(file){

      const prepared =
        await prepareImageForUpload(file);

      const ext =
        getImageExtension(
          prepared.type,
          file.name
        );

      uploadedPath =
        "posts/"+
        userId+
        "/"+
        Date.now()+
        "-"+
        Math.random()
          .toString(36)
          .slice(2,8)+
        "."+
        ext;

      const upload =
        await uploadToStorage(
          uploadedPath,
          prepared
        );

      if(!upload.ok){

        alert(
          "Не удалось загрузить фото:\n"+
          upload.text
        );

        return false;
      }

      imageUrl =
        SUPABASE_URL+
        "/storage/v1/object/public/Stenka/"+
        uploadedPath;
    }

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/posts",
      {
        method:"POST",
        headers:{
          ...authHeaders(),
          Prefer:"return=minimal"
        },
        body:JSON.stringify({
          user_id:userId,
          username:
            (window.currentProfile ? window.currentProfile.username : null) ||
            "you",
          content:text || "",
          image_url:imageUrl
        })
      }
    );

    if(!response.ok){

      if(uploadedPath){
        await deleteStorageFile(
          uploadedPath
        );
      }

      alert(
        "Не удалось создать пост:\n"+
        await response.text()
      );

      return false;
    }

    return true;

  }catch(e){

    if(uploadedPath){
      await deleteStorageFile(
        uploadedPath
      );
    }

    console.error(e);

    alert("Ошибка публикации.");

    return false;
  }
}
