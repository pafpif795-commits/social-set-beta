<script>
const SUPABASE_URL =
  "https://jrzoexmvgyyitojbcxvr.supabase.co";
const SUPABASE_KEY =
  "sb_publishable_NGzwO7npRZMNPeTSXHNLbQ_TO5apgSJ";
const baseHeaders = {
  apikey:SUPABASE_KEY,
  "Content-Type":"application/json"
};
function authHeaders(){
  const token =
    localStorage.getItem("access_token") ||
    SUPABASE_KEY;
  return {
    ...baseHeaders,
    Authorization:"Bearer "+token
  };
}
function safeSelector(value){
  return String(value)
    .replace(/\\/g,"\\\\")
    .replace(/"/g,'\\\"');
}
function updateCommentButton(postId,count){
  const post=document.querySelector(
    '.post[data-post-id="'+safeSelector(postId)+'"]'
  );
  if(!post)return;
  const button=post.querySelector(".comment-toggle");
  if(!button)return;
  const n=Number(count)||0;
  button.title="Комментарии: "+n;
  button.setAttribute("aria-label","Комментарии: "+n);
  button.innerHTML=
    '<img src="comment.png" class="reaction-icon" alt=""><span class="comment-count">'+n+'</span>';
}
async function loadFavoriteIds(posts){
  favoriteIds=new Set();
  const me=localStorage.getItem("user_id");
  if(!me||!posts.length)return favoriteIds;
  const ids=posts.map(p=>p.id).join(",");
  try{
    const r=await fetch(
      SUPABASE_URL+
      "/rest/v1/Favorites?user_id=eq."+
      encodeURIComponent(me)+
      "&post_id=in.("+ids+")&select=post_id",
      {headers:authHeaders()}
    );
    if(r.ok){
      (await r.json()).forEach(x=>favoriteIds.add(String(x.post_id)));
    }
  }catch(e){
    console.error(e);
  }
  return favoriteIds;
}
function updateFavoriteButton(postId,button){
  if(!button)return;
  const active=favoriteIds.has(String(postId));
  button.classList.toggle("active",active);
  const icon=button.querySelector(".favorite-icon");
  if(icon)icon.textContent=active?"★":"☆";
  button.title=active?"Убрать из избранного":"В избранное";
  button.setAttribute("aria-label",button.title);
}
async function toggleFavorite(postId,button){
  const me=localStorage.getItem("user_id");
  if(!me)return;
  const key=String(postId);
  const was=favoriteIds.has(key);
  if(was){
    favoriteIds.delete(key);
    updateFavoriteButton(postId,button);
    try{
      const r=await fetch(
        SUPABASE_URL+
        "/rest/v1/Favorites?user_id=eq."+
        encodeURIComponent(me)+
        "&post_id=eq."+encodeURIComponent(postId),
        {method:"DELETE",headers:authHeaders()}
      );
      if(!r.ok)throw new Error(await r.text());
    }catch(e){
      favoriteIds.add(key);
      updateFavoriteButton(postId,button);
      console.error(e);
    }

  favoriteIds.add(key);

async function loadFavoritesPage(){
  const box=document.getElementById("favoritesList");
  const me=localStorage.getItem("user_id");
  if(!box||!me)return;
  box.innerHTML='<div class="wall-empty">Загружаем избранное...</div>';
  try{
    const r=await fetch(
      SUPABASE_URL+
      "/rest/v1/Favorites?user_id=eq."+
      encodeURIComponent(me)+
      "&select=post_id,created_at&order=created_at.desc&limit=100",
      {headers:authHeaders()}
    );
    if(!r.ok)throw new Error(await r.text());
    const rows=await r.json();
    if(!rows.length){
      favoriteIds=new Set();
      box.innerHTML='<div class="wall-empty">В избранном пока ничего нет.</div>';
      return;
    }
    const ids=rows.map(x=>x.post_id);
    const postsR=await fetch(
      SUPABASE_URL+
      "/rest/v1/posts?id=in.("+ids.join(",")+")"+
      "&select=id,username,content,created_at,updated_at,likes,dislikes,user_id,image_url",
      {headers:authHeaders()}
    );
    if(!postsR.ok)throw new Error(await postsR.text());
    const allPosts=await postsR.json();
    const byId={};
    allPosts.forEach(p=>byId[String(p.id)]=p);
    const posts=rows
      .map(x=>byId[String(x.post_id)])
      .filter(Boolean);
    const [profiles,comments]=await Promise.all([
      loadProfilesMap(),
      getCommentsForPosts(posts)
    ]);
    favoriteIds=new Set(rows.map(x=>String(x.post_id)));
    box.innerHTML="";
    posts.forEach(p=>{
      renderPost(
        p,
        box,
        profiles,
        comments[p.id]||[],
        favoriteIds
      );
    });
  }catch(e){
    console.error(e);
    box.innerHTML='<div class="wall-empty">Не удалось загрузить избранное.</div>';
  }
}

  }

      }

async function validateSession(){
  const token=localStorage.getItem("access_token");
  const userId=localStorage.getItem("user_id");
  if(!token||!userId)return false;
  const controller=
    typeof AbortController!=="undefined"
      ? new AbortController()
      : null;
  const timer=controller
    ? setTimeout(()=>controller.abort(),8000)
    : null;
  try{
    const options={
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:"Bearer "+token
      }
    };
    if(controller)options.signal=controller.signal;
    const response=await fetch(
      SUPABASE_URL+"/auth/v1/user",
      options
    );
    if(!response.ok){
      clearSession();
      return false;
    }
    const user=await response.json();
    if(user.id!==userId){
      clearSession();
      return false;
    }
    return true;
  }catch(e){
    return false;
  }finally{
    if(timer)clearTimeout(timer);
  }
}

async function getProfilesByIds(ids){
  if(!ids.length)return [];
  const unique=[
    ...new Set(ids)
  ];
  const response=await fetch(
    SUPABASE_URL+
    "/rest/v1/profiles?id=in.("+
    unique
      .map(encodeURIComponent)
      .join(",")+
    ")"+
    "&select=id,username,display_name,avatar_url,bio",
    {
      headers:authHeaders()
    }
  );
  if(!response.ok)return [];
  const rows=await response.json();
  const map={};
  rows.forEach(p=>{
    map[p.id]=p;
  });
  return unique
    .map(id=>map[id])
    .filter(Boolean);
}

async function loadProfilesMap(force=false){
  if(
    !force &&
    profilesCache &&
    Date.now()-profilesCacheTime<
      PROFILE_CACHE_TIME
  ){
    return profilesCache;
  }
  try{
    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/profiles?select=id,username,display_name,avatar_url",
      {
        headers:authHeaders()
      }
    );
    if(!response.ok){
      return profilesCache || {};
    }
    const rows=await response.json();
    const map={};
    rows.forEach(p=>{
      map[p.id]=p;
    });
    profilesCache=map;
    profilesCacheTime=Date.now();
    return map;
  }catch(e){
    return profilesCache || {};
  }
}
async function getCommentsForPosts(posts){
  if(!posts.length)return {};
  const ids =
    posts.map(p=>p.id);
  try{
    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/comments?post_id=in.("+
      ids.join(",")+
      ")"+
      "&select=id,post_id,user_id,content,created_at,updated_at&order=created_at.asc",
      {
        headers:authHeaders()
      }
    );
    if(!response.ok)return {};
    const rows=await response.json();
    const map={};
    rows.forEach(comment=>{
      if(!map[comment.post_id]){
        map[comment.post_id]=[];
      }
      map[comment.post_id].push(comment);
    });
    return map;
  }catch(e){
    return {};
  }
}

async function editPost(post){
  const value =
    prompt(
      "Измени публикацию:",
      post.content || ""
    );
  if(value===null)return;
  const content=value.trim();
  if(!content && !post.image_url){
    alert(
      "Публикация не может быть полностью пустой."
    );
    return;
  }
  const me =
    localStorage.getItem("user_id");
  try{
    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/posts?id=eq."+
      encodeURIComponent(post.id)+
      "&user_id=eq."+
      encodeURIComponent(me),
      {
        method:"PATCH",
        headers:{
          ...authHeaders(),
          Prefer:"return=minimal"
        },
        body:JSON.stringify({
          content,
          updated_at:new Date().toISOString()
        })
      }
    );
    if(!response.ok){
      alert(
        "Не удалось изменить публикацию:\n"+
        await response.text()
      );
      return;
    }
    await loadPosts();
    await loadWall();
    if(publicProfile){
      await loadPublicWall(
        publicProfile.id
      );
    }
  }catch(e){
    console.error(e);
    alert("Ошибка редактирования.");
  }
}
async function deletePost(post){
  if(!confirm("Удалить эту публикацию?")){
    return;
  }
  const me =
    localStorage.getItem("user_id");
  try{
    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/posts?id=eq."+
      encodeURIComponent(post.id)+
      "&user_id=eq."+
      encodeURIComponent(me),
      {
        method:"DELETE",
        headers:{
          ...authHeaders(),
          Prefer:"return=representation"
        }
      }
    );
    const deleted =
      response.ok
        ? await response.json().catch(()=>[])
        : [];
    if(!response.ok){
      alert(
        "Не удалось удалить публикацию:\n"+
        await response.text()
      );
      return;
    }
    if(
      Array.isArray(deleted) &&
      deleted.length===0
    ){
      alert(
        "Сервер не удалил публикацию. Проверь RLS-политику DELETE для posts."
      );
      return;
    }
    if(
      post.image_url &&
      isAllowedImageUrl(post.image_url)
    ){
      const marker =
        "/storage/v1/object/public/Stenka/";
      const index =
        post.image_url.indexOf(marker);
      if(index!==-1){
        const path =
          decodeURIComponent(
            post.image_url.slice(
              index+marker.length
            )
          );
        await deleteStorageFile(path);
      }
    }
    await loadPosts();
    await loadWall();
    if(publicProfile){
      await loadPublicWall(
        publicProfile.id
      );
    }
  }catch(e){
    console.error(e);
    alert("Ошибка удаления.");
  }
}

function getImageExtension(
  mime,
  name
){
  if(mime==="image/jpeg")return"jpg";
  if(mime==="image/png")return"png";
  if(mime==="image/webp")return"webp";
  if(mime==="image/gif")return"gif";
  return(
    ((name.split(".").pop()||"").toLowerCase()) ||
    "jpg"
  );
}
function loadImage(file){
  return new Promise(
    (resolve,reject)=>{
      const url =
        URL.createObjectURL(file);
      const image =
        new Image();
      image.onload=()=>{
        URL.revokeObjectURL(url);
        resolve(image);
      };
      image.onerror=()=>{
        URL.revokeObjectURL(url);
        reject();
      };
      image.src=url;
    }
  );
}
async function prepareImageForUpload(file){
  if(
    ![
      "image/jpeg",
      "image/png",
      "image/webp"
    ].includes(file.type) ||
    file.size<1200000
  ){
    return file;
  }
  try{
    const image =
      await loadImage(file);
    const max=2000;
    const scale =
      Math.min(
        1,
        max/
        Math.max(
          image.naturalWidth,
          image.naturalHeight
        )
      );
    const canvas =
      document.createElement("canvas");
    canvas.width =
      Math.round(
        image.naturalWidth*scale
      );
    canvas.height =
      Math.round(
        image.naturalHeight*scale
      );
    const ctx =
      canvas.getContext("2d");
    ctx.drawImage(
      image,
      0,
      0,
      canvas.width,
      canvas.height
    );
    const blob =
      await new Promise(
        resolve=>
          canvas.toBlob(
            resolve,
            "image/jpeg",
            .82
          )
      );
    if(!blob)return file;
    return new File(
      [blob],
      "photo.jpg",
      {
        type:"image/jpeg"
      }
    );
  }catch(e){
    return file;
  }
}

async function createPostInDatabase(
  text,
  file
){
  const userId =
    localStorage.getItem(
      "user_id"
    );
  if(!userId)return false;
  let uploadedPath=null;
  try{
    let imageUrl=null;
    if(file){
      const prepared =
        await prepareImageForUpload(file);
      const ext =
        getImageExtension(
          prepared.type,
          file.name
        );
      uploadedPath =
        "posts/"+
        userId+
        "/"+
        Date.now()+
        "-"+
        Math.random()
          .toString(36)
          .slice(2,8)+
        "."+
        ext;
      const upload =
        await uploadToStorage(
          uploadedPath,
          prepared
        );
      if(!upload.ok){
        alert(
          "Не удалось загрузить фото:\n"+
          upload.text
        );
        return false;
      }
      imageUrl =
        SUPABASE_URL+
        "/storage/v1/object/public/Stenka/"+
        uploadedPath;
    }
    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/posts",
      {
        method:"POST",
        headers:{
          ...authHeaders(),
          Prefer:"return=minimal"
        },
        body:JSON.stringify({
          user_id:userId,
          username:
            (window.currentProfile && window.currentProfile.username) ||
            "you",
          content:text || "",
          image_url:imageUrl
        })
      }
    );
    if(!response.ok){
      if(uploadedPath){
        await deleteStorageFile(
          uploadedPath
        );
      }
      alert(
        "Не удалось создать пост:\n"+
        await response.text()
      );
      return false;
    }
    return true;
  }catch(e){
    if(uploadedPath){
      await deleteStorageFile(
        uploadedPath
      );
    }
    console.error(e);
    alert("Ошибка публикации.");
    return false;
  }
}

async function reactToPost(
  id,
  type,
  postOwnerId
){
  const key =
    "reaction_"+id;
  const old =
    localStorage.getItem(key);
  let likeDelta=0;
  let dislikeDelta=0;
  let nextReaction=null;
  if(old===type){
    if(type==="like"){
      likeDelta=-1;
    }else{
      dislikeDelta=-1;
    }
  }else{
    if(old==="like"){
      likeDelta=-1;
    }
    if(old==="dislike"){
      dislikeDelta=-1;
    }
    if(type==="like"){
      likeDelta=1;
    }else{
      dislikeDelta=1;
    }
    nextReaction=type;
  }
  
  const postElement =
    document.querySelector(
      '.post[data-post-id="'+
      safeSelector(String(id))+
      '"]'
    );
  let previousLike=0;
  let previousDislike=0;
  if(postElement){
    const buttons =
      postElement.querySelectorAll(
        ".reaction-btn"
      );
    const likeButton =
      postElement.querySelector(
        '[data-reaction="like"]'
      );
    const dislikeButton =
      postElement.querySelector(
        '[data-reaction="dislike"]'
      );
    if(likeButton){
      previousLike =
        parseInt(
          likeButton.textContent.trim(),
          10
        ) || 0;
    }
    if(dislikeButton){
      previousDislike =
        parseInt(
          dislikeButton.textContent.trim(),
          10
        ) || 0;
    }
    updateReactionButtons(
      id,
      Math.max(
        0,
        previousLike+likeDelta
      ),
      Math.max(
        0,
        previousDislike+dislikeDelta
      ),
      nextReaction
    );
    animateReaction(id,type);
  }
  if(nextReaction){
    localStorage.setItem(
      key,
      nextReaction
    );
  }else{
    localStorage.removeItem(key);
  }
  try{
    const get=await fetch(
      SUPABASE_URL+
      "/rest/v1/posts?id=eq."+
      encodeURIComponent(id)+
      "&select=likes,dislikes",
      {
        headers:authHeaders()
      }
    );
    if(!get.ok){
      throw new Error(
        "Не удалось получить пост."
      );
    }
    const rows=await get.json();
    if(!rows.length){
      throw new Error("Пост не найден.");
    }
    const post=rows[0];
    const newLikes =
      Math.max(
        0,
        Number(post.likes || 0)+likeDelta
      );
    const newDislikes =
      Math.max(
        0,
        Number(post.dislikes || 0)+dislikeDelta
      );
    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/posts?id=eq."+
      encodeURIComponent(id),
      {
        method:"PATCH",
        headers:{
          ...authHeaders(),
          Prefer:"return=minimal"
        },
        body:JSON.stringify({
          likes:newLikes,
          dislikes:newDislikes
        })
      }
    );
    if(!response.ok){
      throw new Error(
        await response.text()
      );
    }
    
    updateReactionButtons(
      id,
      newLikes,
      newDislikes,
      nextReaction
    );
    const me =
      localStorage.getItem("user_id");
    if(
      type==="like" &&
      old!=="like" &&
      postOwnerId &&
      postOwnerId!==me
    ){
      await createNotification(
        postOwnerId,
        me,
        "like",
        id,
        null,
        "понравился ваш пост"
      );
    }
    await updateNotificationBadges();
  }catch(e){
    console.error(e);
    
    if(old){
      localStorage.setItem(
        key,
        old
      );
    }else{
      localStorage.removeItem(key);
    }
    if(postElement){
      updateReactionButtons(
        id,
        previousLike,
        previousDislike,
        old
      );
    }
  }
}

async function loadConversations(){
  const me =
    localStorage.getItem("user_id");
  const container =
    document.getElementById(
      "conversations"
    );
  if(!me)return;
  try{
    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/messages?or="+
      encodeURIComponent(
        "(sender_id.eq."+me+
        ",receiver_id.eq."+me+")"
      )+
      "&select=*&order=created_at.desc&limit=500",
      {
        headers:authHeaders()
      }
    );
    if(!response.ok){
      throw new Error();
    }
    const messages=await response.json();
    const profiles =
      await loadProfilesMap();
    const map={};
    const unreadMap={};
    messages.forEach(m=>{
      const other =
        m.sender_id===me
          ? m.receiver_id
          : m.sender_id;
      if(!map[other]){
        map[other]=m;
      }
      if(
        m.receiver_id===me &&
        !m.is_read
      ){
        unreadMap[other] =
          (unreadMap[other] || 0)+1;
      }
    });
    container.innerHTML="";
    if(!Object.keys(map).length){
      container.innerHTML =
        '<div class="search-empty">Пока нет сообщений.</div>';
      return;
    }
    Object.entries(map).forEach(
      ([id,message])=>{
        const profile =
          profiles[id];
        if(!profile)return;
        const unread =
          unreadMap[id] || 0;
        const item =
          document.createElement("div");
        item.className="conversation";
        item.onclick=()=>{
          openChatWithUser(profile);
        };
        if(profile.avatar_url){
          const img =
            document.createElement("img");
          img.className=
            "conversation-avatar";
          img.src=profile.avatar_url;
          img.alt="";
          img.loading="lazy";
          img.decoding="async";
          item.appendChild(img);
        }else{
          const a =
            document.createElement("div");
          a.className=
            "conversation-placeholder";
          a.textContent=(
            profile.display_name ||
            profile.username
          ).charAt(0).toUpperCase();
          item.appendChild(a);
        }
        const main =
          document.createElement("div");
        main.className=
          "conversation-main";
        const top =
          document.createElement("div");
        top.className=
          "conversation-top";
        const name =
          document.createElement("div");
        name.className =
          "conversation-name"+
          (unread ? " unread" : "");
        name.textContent =
          profile.display_name ||
          profile.username;
        const time =
          document.createElement("div");
        time.className=
          "conversation-time";
        time.textContent =
          formatMessageTime(
            message.created_at
          );
        top.appendChild(name);
        top.appendChild(time);
        const preview =
          document.createElement("div");
        preview.className =
          "conversation-preview"+
          (unread ? " unread" : "");
        preview.textContent =
          unread>0
            ? "Новое сообщение"
            : (message.content || "");
        main.appendChild(top);
        main.appendChild(preview);
        item.appendChild(main);
        if(unread>0){
          const badge =
            document.createElement("div");
          badge.className=
            "unread-count";
          badge.textContent =
            unread>99
              ? "99+"
              : unread;
          item.appendChild(badge);
        }
        container.appendChild(item);
      }
    );
  }catch(e){
    console.error(e);
    container.innerHTML =
      '<div class="search-empty">Не удалось загрузить сообщения.</div>';
  }
}

async function performMessageSearch(){
  const q =
    document
      .getElementById(
        "messageSearchInput"
      )
      .value
      .trim();
  const results =
    document.getElementById(
      "messageSearchResults"
    );
  const conversations =
    document.getElementById(
      "conversations"
    );
  if(!q){
    results.style.display="none";
    conversations.style.display="block";
    await loadConversations();
    return;
  }
  results.style.display="block";
  conversations.style.display="none";
  results.innerHTML =
    '<div class="search-empty">Ищем...</div>';
  try{
    const safe =
      q.replace(/[,*()]/g,"");
    if(!safe){
      results.innerHTML =
        '<div class="search-empty">Введи имя пользователя.</div>';
      return;
    }
    const pattern =
      "*"+safe+"*";
    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/profiles?or="+
      encodeURIComponent(
        "(username.ilike."+pattern+
        ",display_name.ilike."+pattern+")"
      )+
      "&select=id,username,display_name,avatar_url"+
      "&limit=20",
      {
        headers:authHeaders()
      }
    );
    if(!response.ok){
      throw new Error();
    }
    const rows=await response.json();
    const me =
      localStorage.getItem("user_id");
    results.innerHTML="";
    rows
      .filter(p=>p.id!==me)
      .forEach(profile=>{
        const item =
          document.createElement("div");
        item.className=
          "message-user-result";
        item.onclick=()=>{
          openChatWithUser(profile);
        };
        appendFollowAvatar(
          item,
          profile
        );
        const info =
          document.createElement("div");
        const name =
          document.createElement("div");
        name.className=
          "search-user-name";
        name.textContent =
          profile.display_name ||
          profile.username;
        const username =
          document.createElement("div");
        username.className=
          "search-user-username";
        username.textContent =
          "@"+profile.username;
        info.appendChild(name);
        info.appendChild(username);
        item.appendChild(info);
        results.appendChild(item);
      });
    if(!results.children.length){
      results.innerHTML =
        '<div class="search-empty">Пользователь не найден.</div>';
    }
  }catch(e){
    console.error(e);
    results.innerHTML =
      '<div class="search-empty">Ошибка поиска.</div>';
  }
}

async function sendMessage(){
  const input =
    document.getElementById(
      "chatInput"
    );
  const content =
    input.value.trim();
  if(!content)return;
  const me =
    localStorage.getItem("user_id");
  input.disabled=true;
  try{
    let url;
    let body;
    if(currentGroupChat){
      url =
        SUPABASE_URL+
        "/rest/v1/group_messages";
      body={
        chat_id:currentGroupChat.id,
        sender_id:me,
        content
      };
    }else{
      if(!currentChatUser)return;
      url =
        SUPABASE_URL+
        "/rest/v1/messages";
      body={
        sender_id:me,
        receiver_id:
          currentChatUser.id,
        content,
        is_read:false
      };
    }
    const response=await fetch(
      url,
      {
        method:"POST",
        headers:{
          ...authHeaders(),
          Prefer:"return=representation"
        },
        body:JSON.stringify(body)
      }
    );
    if(!response.ok){
      alert(
        "Не удалось отправить сообщение:\n"+
        await response.text()
      );
      return;
    }
    const created =
      await response.json();
    if(
      !currentGroupChat &&
      currentChatUser &&
      currentChatUser.id!==me
    ){
      const sentMessage =
        Array.isArray(created)
          ? created[0]
          : created;
      await createNotification(
        currentChatUser.id,
        me,
        "message",
        null,
        (sentMessage && sentMessage.id) || null,
        "отправил вам сообщение"
      );
    }
    input.value="";
    if(currentGroupChat){
      await loadGroupMessages();
    }else{
      await loadDirectMessages();
    }
    await updateNotificationBadges();
  }catch(e){
    console.error(e);
    alert("Ошибка отправки.");
  }finally{
    input.disabled=false;
    input.focus();
  }
}
function handleChatKey(event){
  if(

    !event.shiftKey
  ){
    event.preventDefault();
    sendMessage();

async function deleteMessage(
  message
){
  if(!confirm("Удалить сообщение?")){
    return;
  }
  const me =
    localStorage.getItem("user_id");
  try{
    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/messages?id=eq."+
      encodeURIComponent(message.id)+
      "&sender_id=eq."+
      encodeURIComponent(me),
      {
        method:"DELETE",
        headers:{
          ...authHeaders(),
          Prefer:"return=representation"
        }
      }
    );
    if(!response.ok){
      alert(
        "Не удалось удалить сообщение:\n"+
        await response.text()
      );
      return;
    }
    const deleted =
      await response.json().catch(()=>[]);
    if(
      Array.isArray(deleted) &&
      deleted.length===0
    ){
      alert(
        "Сообщение не удалилось. Проверь RLS-политику DELETE для таблицы messages."
      );
      return;
    }
    const row =
      document.querySelector(
        '.message-row[data-message-id="'+
        safeSelector(String(message.id))+
        '"]'
      );
    if(row){
      row.style.transition=
        "opacity .18s ease, transform .18s ease";
      row.style.opacity="0";
      row.style.transform="translateY(-4px)";
      setTimeout(()=>{
        row.remove();
      },180);
    }else{
      await loadDirectMessages();
    }
  }catch(e){
    console.error(e);
    alert(
      "Ошибка удаления сообщения."
    );
  }
}

        ).charAt(0).toUpperCase();

      }

        document.createElement("div");
      info.className=
        "friend-select-info";
      const name =
        document.createElement("div");
      name.className=
        "search-user-name";
      name.textContent =
        profile.display_name ||
        profile.username;
      const username =
        document.createElement("div");
      username.className=
        "search-user-username";
      username.textContent =
        "@"+profile.username;
      info.appendChild(name);
      info.appendChild(username);

        document.createElement("input");

}

async function createGroupChat(){
  const name =
    document
      .getElementById("groupName")
      .value
      .trim() ||
    "Общий чат";
  const selected=[
    ...document.querySelectorAll(
      "#groupFriendsList input[type=checkbox]:checked"
    )
  ].map(x=>x.value);
  const me =
    localStorage.getItem("user_id");
  if(!selected.length){
    alert(
      "Выбери хотя бы одного друга."
    );
    return;
  }
  try{
    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/group_chats",
      {
        method:"POST",
        headers:{
          ...authHeaders(),
          Prefer:"return=representation"
        },
        body:JSON.stringify({
          name,
          creator_id:me
        })
      }
    );
    if(!response.ok){
      alert(
        "Не удалось создать чат:\n"+
        await response.text()
      );
      return;
    }
    const chats =
      await response.json();
    const chat=chats[0];
    if(!chat){
      alert(
        "Сервер не вернул созданный чат."
      );
      return;
    }
    const members=[
      me,
      ...selected
    ];
    const memberResponse =
      await fetch(
        SUPABASE_URL+
        "/rest/v1/group_chat_members",
        {
          method:"POST",
          headers:{
            ...authHeaders(),
            Prefer:"return=minimal"
          },
          body:JSON.stringify(
            members.map(
              user_id=>({
                chat_id:chat.id,
                user_id
              })
            )
          )
        }
      );
    if(!memberResponse.ok){
      alert(
        "Чат создан, но не удалось добавить участников:\n"+
        await memberResponse.text()
      );
      return;
    }
    closeGroupModal();
    document.getElementById(
      "groupName"
    ).value="";
    await loadGroupChats();
  }catch(e){
    console.error(e);
    alert(
      "Ошибка создания общего чата."
    );
  }
}
async function loadGroupChats(){
  const container =
    document.getElementById(
      "groupChats"
    );
  const me =
    localStorage.getItem("user_id");
  if(!me)return;
  try{
    const membersResponse =
      await fetch(
        SUPABASE_URL+
        "/rest/v1/group_chat_members?user_id=eq."+
        encodeURIComponent(me)+
        "&select=chat_id",
        {
          headers:authHeaders()
        }
      );
    if(!membersResponse.ok){
      container.innerHTML="";
      return;
    }
    const members =
      await membersResponse.json();
    if(!members.length){
      container.innerHTML="";
      return;
    }
    const ids =
      members.map(x=>x.chat_id);
    const filter =
      ids
        .map(id=>"id.eq."+id)
        .join(",");
    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/group_chats?or="+
      encodeURIComponent(
        "("+filter+")"
      )+
      "&select=*&order=created_at.desc",
      {
        headers:authHeaders()
      }
    );
    if(!response.ok)return;
    const chats=await response.json();
    container.innerHTML="";
    chats.forEach(chat=>{
      const item =
        document.createElement("div");
      item.className="group-card";
      const main =
        document.createElement("div");
      main.className=
        "group-card-main";
      main.onclick=()=>{
        openGroupChat(chat);
      };
      const icon =
        document.createElement("div");
      icon.className="group-icon";
      icon.textContent="👥";
      const info =
        document.createElement("div");
      info.className="group-info";
      const name =
        document.createElement("div");
      name.className="group-name";
      name.textContent=chat.name;
      const count =
        document.createElement("div");
      count.className="group-members";
      count.textContent="Общий чат";
      info.appendChild(name);
      info.appendChild(count);
      main.appendChild(icon);
      main.appendChild(info);
      item.appendChild(main);
      container.appendChild(item);
    });
  }catch(e){
    console.error(e);
  }
}

async function loadGroupMessages(){
  if(!currentGroupChat)return;
  const container =
    document.getElementById(
      "chatMessages"
    );
  const me =
    localStorage.getItem("user_id");
  try{
    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/group_messages?chat_id=eq."+
      encodeURIComponent(
        currentGroupChat.id
      )+
      "&select=*&order=created_at.asc&limit=500",
      {
        headers:authHeaders()
      }
    );
    if(!response.ok){
      throw new Error();
    }
    const messages =
      await response.json();
    const profiles =
      await loadProfilesMap();
    container.innerHTML="";
    if(!messages.length){
      container.innerHTML =
        '<div class="chat-empty">Здесь пока пусто.<br>Напиши первое сообщение.</div>';
      return;
    }
    messages.forEach(
      message=>{
        renderGroupMessage(
          message,
          me,
          profiles
        );
      }
    );
    container.scrollTop =
      container.scrollHeight;
  }catch(e){
    console.error(e);
    container.innerHTML =
      '<div class="chat-empty">Не удалось загрузить сообщения.</div>';
  }
}
function renderGroupMessage(
  message,
  me,
  profiles
){
  const row =
    document.createElement("div");
  row.className =
    "message-row "+
    (
      message.sender_id===me
        ? "mine"
        : "theirs"
    );
  row.dataset.messageId=message.id;
  const wrap =
    document.createElement("div");
  wrap.className=
    "message-wrap";
  
  if(message.sender_id!==me){
    const profile =
      profiles[message.sender_id];
    const sender =
      document.createElement("div");
    sender.className="message-sender";
    sender.textContent =
      (profile && profile.display_name) ||
      (profile && profile.username) ||
      "Пользователь";
    wrap.appendChild(sender);
  }
  const bubble =
    document.createElement("div");
  bubble.className="message-bubble";
  bubble.textContent=
    message.content;
  const time =
    document.createElement("div");
  time.className="message-time";
  time.textContent =
    formatChatTime(
      message.created_at
    );
  bubble.appendChild(time);
  wrap.appendChild(bubble);
  if(
    message.sender_id===me
  ){
    const actions =
      document.createElement("div");
    actions.className="message-actions";
    const edit =
      document.createElement("button");
    edit.textContent=
      "Изменить";
    edit.onclick=()=>{
      editGroupMessage(
        message
      );
    };
    const remove =
      document.createElement("button");
    remove.className=
      "delete";
    remove.textContent=
      "Удалить";
    remove.onclick=()=>{
      deleteGroupMessage(
        message
      );
    };
    actions.appendChild(edit);
    actions.appendChild(remove);
    wrap.appendChild(actions);
  }
  row.appendChild(wrap);
  document
    .getElementById("chatMessages")
    .appendChild(row);
}
async function editGroupMessage(
  message
){
  const value =
    prompt(
      "Измени сообщение:",
      message.content
    );
  if(value===null)return;
  const content =
    value.trim();
  if(!content)return;
  const me =
    localStorage.getItem("user_id");
  try{
    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/group_messages?id=eq."+
      encodeURIComponent(message.id)+
      "&sender_id=eq."+
      encodeURIComponent(me),
      {
        method:"PATCH",
        headers:{
          ...authHeaders(),
          Prefer:"return=minimal"
        },
        body:JSON.stringify({
          content,
          updated_at:
            new Date().toISOString()
        })
      }
    );
    if(!response.ok){
      alert(
        "Не удалось изменить сообщение:\n"+
        await response.text()
      );
      return;
    }
    await loadGroupMessages();
  }catch(e){
    console.error(e);
    alert(
      "Ошибка редактирования сообщения."
    );
  }
}
async function deleteGroupMessage(
  message
){
  if(!confirm("Удалить сообщение?")){
    return;
  }
  const me =
    localStorage.getItem("user_id");
  try{
    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/group_messages?id=eq."+
      encodeURIComponent(message.id)+
      "&sender_id=eq."+
      encodeURIComponent(me),
      {
        method:"DELETE",
        headers:{
          ...authHeaders(),
          Prefer:"return=representation"
        }
      }
    );
    if(!response.ok){
      alert(
        "Не удалось удалить сообщение:\n"+
        await response.text()
      );
      return;
    }
    const deleted =
      await response.json().catch(()=>[]);
    if(
      Array.isArray(deleted) &&
      deleted.length===0
    ){
      alert(
        "Сообщение не удалилось. Проверь RLS-политику DELETE для group_messages."
      );
      return;
    }
    const row =
      document.querySelector(
        '.message-row[data-message-id="'+
        safeSelector(String(message.id))+
        '"]'
      );
    if(row){
      row.style.transition=
        "opacity .18s ease, transform .18s ease";
      row.style.opacity="0";
      row.style.transform="translateY(-4px)";
      setTimeout(()=>{
        row.remove();
      },180);
    }else{
      await loadGroupMessages();
    }
  }catch(e){
    console.error(e);
    alert(
      "Ошибка удаления сообщения."
    );
  }
}
function formatMessageTime(value){
  const date =
    new Date(value);
  const now =
    new Date();
  if(
    date.toDateString()===
    now.toDateString()
  ){
    return date.toLocaleTimeString(
      "ru-RU",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );
  }
  return date.toLocaleDateString(
    "ru-RU",
    {
      day:"2-digit",
      month:"2-digit"
    }
  );
}
function formatChatTime(value){
  return new Date(
    value
  ).toLocaleTimeString(
    "ru-RU",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}
function showPage(page){
  if(page!=="chat"){
    stopChatPolling();
  }
  document
    .querySelectorAll(".page")
    .forEach(
      p=>p.classList.remove("active")
    );
  document
    .querySelectorAll(".nav-button")
    .forEach(
      b=>b.classList.remove("active")
    );
  if(page==="feed"){
    document
      .getElementById("feedPage")
      .classList.add("active");
    document
      .getElementById("feedNav")
      .classList.add("active");
    loadPosts();
    return;
  }
  if(page==="search"){
    document
      .getElementById("searchPage")
      .classList.add("active");
    document
      .getElementById("searchNav")
      .classList.add("active");
    return;
  }
  if(page==="messages"){
    document
      .getElementById("messagesPage")
      .classList.add("active");
    document
      .getElementById("messagesNav")
      .classList.add("active");
    loadGroupChats();
    loadConversations();
    return;
  }
  if(page==="chat"){
    document
      .getElementById("chatPage")
      .classList.add("active");
    document
      .getElementById("messagesNav")
      .classList.add("active");
    return;
  }
  if(page==="notifications"){
    document
      .getElementById("notificationsPage")
      .classList.add("active");
    loadNotifications();
    updateNotificationBadges();
    return;
  }
  if(page==="favorites"){
    document
      .getElementById("favoritesPage")
      .classList.add("active");
    document
      .getElementById("favoritesNav")
      .classList.add("active");
    loadFavoritesPage();
    return;
  }
  if(page==="profile"){
    publicProfile=null;
    document
      .getElementById("profilePage")
      .classList.add("active");
    document
      .getElementById("profileNav")
      .classList.add("active");
    loadProfile();
    loadWall();
    return;
  }
  if(page==="publicProfile"){
    document
      .getElementById("publicProfilePage")
      .classList.add("active");
    document
      .getElementById("searchNav")
      .classList.add("active");
    return;
  }
  if(page==="followList"){
    document
      .getElementById("followListPage")
      .classList.add("active");
    return;
  }
}

  "keydown",
  e=>{
    if(
      e.key!=="Enter" ||
      e.shiftKey
    ){
      return;
    }
    if(
      e.target.tagName==="TEXTAREA"
    ){
      return;
    }
    if(
      document
        .getElementById("loginForm")
        .style.display==="block"
    ){
      e.preventDefault();
      signIn();
      return;
    }
    if(
      document
        .getElementById("signupForm")

    ){
      e.preventDefault();
      signUp();

);

async function showApp(){
  const video =
    document.querySelector(
      ".auth-video"
    );
  
  if(video){
    video.pause();
    video.currentTime=0;
    video.muted=true;
    video.volume=0;
  }
  document.getElementById(
    "authScreen"
  ).style.display="none";
  document.getElementById(
    "app"
  ).style.display="block";
  const profile =
    await loadProfile();
  if(!profile){
    alert(
      "Не удалось загрузить профиль."
    );
    signOut();
    return;
  }
  showPage("feed");
  await updateNotificationBadges();
  if(badgeTimer){
    clearInterval(badgeTimer);
  }
  badgeTimer =
    setInterval(
      updateNotificationBadges,
      15000
    );
}

      await validateSession();
    if(valid){

    }else{

    }
  }else{
