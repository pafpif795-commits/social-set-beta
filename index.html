<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Cap</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --navy: #0b1f3a;
  --navy2: #12365d;
  --sky: #62b7f5;
  --sky-soft: #e9f6ff;
  --bg: #f4f9fd;
  --white: #fff;
  --line: #d8e6f0;
  --text: #102033;
  --muted: #718397;
  --red: #ef4056;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

button {
  border: 0;
  cursor: pointer;
  font: inherit;
}

/* ================= AUTH ================= */

#authScreen {
  background: #000;
position: relative;
overflow: hidden;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;

  background:
    radial-gradient(circle at 15% 15%, #c7eaff 0, transparent 30%),
    radial-gradient(circle at 85% 85%, #dcefff 0, transparent 30%),
    var(--bg);
}

.auth-card {
  position: relative;
z-index: 2;
  width: 100%;
  max-width: 420px;
  background: rgba(255,255,255,.97);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 34px;
  box-shadow: 0 22px 65px rgba(11,31,58,.13);
}
.auth-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 0;
  pointer-events: none;
}

.brand {
  font-size: 44px;
  font-weight: 900;
  letter-spacing: -2.5px;
  color: var(--navy);
  text-align: center;
}

.tagline {
  text-align: center;
  color: var(--muted);
  margin: 8px 0 28px;
}

.auth-choice button,
.auth-form button {
  width: 100%;
  padding: 13px 16px;
  border-radius: 12px;
  margin-top: 10px;
  font-weight: 700;
}

.primary {
  background: var(--navy);
  color: white;
}

.secondary {
  background: var(--sky-soft);
  color: var(--navy);
}

.auth-form {
  display: none;
}

.auth-form h2 {
  margin-top: 0;
  color: var(--navy);
}

.auth-form input {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border: 1px solid var(--line);
  border-radius: 11px;
  outline: none;
  background: white;
  color: var(--text);
  font-size: 15px;
}

.back-btn {
  background: transparent;
  color: var(--muted);
  margin-top: 12px;
  padding: 8px 0;
}

#authMessage {
  min-height: 20px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 14px;
}

/* ================= APP ================= */

#app {
  display: none;
  min-height: 100vh;
}

header {
  height: 64px;
  background: white;
  border-bottom: 1px solid var(--line);

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 20px;

  position: sticky;
  top: 0;
  z-index: 20;
}

.header-logo {
  font-size: 23px;
  font-weight: 900;
  color: var(--navy);
}

.logout {
  background: var(--navy);
  color: white;
  border-radius: 10px;
  padding: 9px 13px;
  font-size: 13px;
  font-weight: 700;
}

.container {
  max-width: 650px;
  margin: 25px auto 90px;
  padding: 0 15px;
}

/* ================= PAGES ================= */

.page {
  display: none;
}

.page.active {
  display: block;
}

/* ================= FEED ================= */

.create-post,
.post,
.profile-card,
.profile-wall {
  background: white;
  border: 1px solid var(--line);
  border-radius: 17px;
}

.create-post {
  padding: 17px;
  margin-bottom: 20px;
}

textarea {
  width: 100%;
  min-height: 90px;
  resize: vertical;

  background: #fafdff;
  color: var(--text);

  border: 1px solid var(--line);
  border-radius: 12px;

  padding: 12px;
  font-size: 16px;
  outline: none;
}

.publish {
  margin-top: 10px;
  background: var(--navy);
  color: white;
  border-radius: 10px;
  padding: 11px 18px;
  font-weight: 700;
}

.post {
  margin-bottom: 15px;
  padding: 16px;
}

.post-user {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.mini-avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  object-fit: cover;
  background: var(--sky-soft);
  border: 1px solid var(--line);
}

.mini-avatar-placeholder {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: var(--navy);
  color: white;

  display: flex;
  align-items: center;
  justify-content: center;

  font-weight: 800;
}

.user-name {
  color: var(--navy);
  font-weight: 800;
}

.post-date {
  color: var(--muted);
  font-size: 12px;
  margin-top: 3px;
}

.post-text {
  font-size: 16px;
  line-height: 1.5;
  white-space: pre-wrap;
}

.actions {
  margin-top: 15px;
  display: flex;
  gap: 8px;
}

.reaction-btn {
  background: white;
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 10px;
  padding: 8px 12px;
  font-weight: 700;
}

.reaction-btn.active {
  color: var(--red);
  border-color: #f1a0aa;
  background: #fff5f6;
}

/* ================= PROFILE ================= */

.profile-card {
  overflow: hidden;
  margin-bottom: 20px;
}

.cover {
  height: 145px;

  background:
    linear-gradient(
      135deg,
      #0b1f3a,
      #23608f,
      #62b7f5
    );
}

.profile-info {
  padding: 0 20px 20px;
  position: relative;
}

.big-avatar {
  width: 110px;
  height: 110px;

  border-radius: 50%;

  object-fit: cover;

  background: var(--sky-soft);

  border: 5px solid white;

  margin-top: -55px;

  display: block;
}

.avatar-placeholder {
  width: 110px;
  height: 110px;

  border-radius: 50%;

  background: var(--navy);
  color: white;

  border: 5px solid white;

  margin-top: -55px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 36px;
  font-weight: 900;
}

.profile-name {
  font-size: 25px;
  font-weight: 900;
  color: var(--navy);
  margin-top: 12px;
}

.profile-username {
  color: var(--muted);
  margin-top: 3px;
}

.profile-bio {
  margin-top: 13px;
  line-height: 1.5;
  color: var(--text);
}

.profile-buttons {
  display: flex;
  gap: 8px;
  margin-top: 15px;
  flex-wrap: wrap;
}

.profile-button {
  background: var(--sky-soft);
  color: var(--navy);
  border-radius: 10px;
  padding: 10px 14px;
  font-weight: 700;
}

.profile-button.dark {
  background: var(--navy);
  color: white;
}

.profile-wall {
  padding: 17px;
}

.wall-title {
  color: var(--navy);
  font-size: 21px;
  font-weight: 900;
  margin-bottom: 15px;
}

.wall-empty {
  color: var(--muted);
  text-align: center;
  padding: 25px 10px;
}

/* ================= NAVIGATION ================= */

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;

  height: 68px;

  background: rgba(255,255,255,.96);

  border-top: 1px solid var(--line);

  display: flex;

  justify-content: center;

  z-index: 30;

  backdrop-filter: blur(12px);
}

.nav-inner {
  width: 100%;
  max-width: 650px;

  display: flex;
  justify-content: space-around;
  align-items: center;
}

.nav-button {
  background: transparent;
  color: var(--muted);

  min-width: 100px;

  padding: 8px;

  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;

  font-size: 12px;
  font-weight: 700;
}

.nav-icon {
  font-size: 23px;
}

.nav-button.active {
  color: var(--navy);
}

/* ================= MODAL ================= */

.modal {
  display: none;

  position: fixed;
  inset: 0;

  background: rgba(11,31,58,.45);

  z-index: 100;

  align-items: center;
  justify-content: center;

  padding: 20px;
}

.modal.active {
  display: flex;
}

.modal-card {
  width: 100%;
  max-width: 420px;

  background: white;

  border-radius: 20px;

  padding: 22px;

  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}

.modal-card h2 {
  margin-top: 0;
  color: var(--navy);
}

.modal-card input,
.modal-card textarea {
  margin-top: 10px;
}

.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.modal-actions button {
  flex: 1;
  padding: 11px;
  border-radius: 10px;
  font-weight: 700;
}

.cancel {
  background: var(--sky-soft);
  color: var(--navy);
}

/* ================= RESPONSIVE ================= */

@media(max-width:700px) {

  .container {
    margin-top: 15px;
  }

  .cover {
    height: 125px;
  }

  .profile-info {
    padding-left: 16px;
    padding-right: 16px;
  }

  .auth-card {
    padding: 26px;
  }

}
</style>
</head>

<body>

<section id="authScreen">
  <video class="auth-video" autoplay muted loop playsinline>
 <source src="https://jrzoexmvgyyitojbcxvr.supabase.co/storage/v1/object/public/Stenka/auth-bg.mp4/3992627239181363251.mp4" type="video/mp4">

  <div class="auth-card">

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://jrzoexmvgyyitojbcxvr.supabase.co";


/*
  ВСТАВЬ СЮДА СВОЙ ТЕКУЩИЙ PUBLISHABLE KEY
*/

const SUPABASE_KEY =
  "sb_publishable_NGzwO7npRZMNPeTSXHNLbQ_TO5apgSJ";



const headers = {

  "apikey":
    SUPABASE_KEY,

  "Authorization":
    "Bearer " + SUPABASE_KEY,

  "Content-Type":
    "application/json"

};


function authHeaders() {

  return {

    ...headers,

    "Authorization":
      "Bearer " +
      localStorage.getItem(
        "access_token"
      )

  };

}


/* =====================================================
   AUTH
===================================================== */

function showAuthChoice() {

  document.getElementById(
    "authChoice"
  ).style.display = "block";

  document.getElementById(
    "loginForm"
  ).style.display = "none";

  document.getElementById(
    "signupForm"
  ).style.display = "none";

  document.getElementById(
    "authMessage"
  ).textContent = "";

}


function showAuthForm(type) {

  document.getElementById(
    "authChoice"
  ).style.display = "none";

  document.getElementById(
    "loginForm"
  ).style.display =
    type === "login"
      ? "block"
      : "none";

  document.getElementById(
    "signupForm"
  ).style.display =
    type === "signup"
      ? "block"
      : "none";

  document.getElementById(
    "authMessage"
  ).textContent = "";

}


async function signUp() {

  const username =
    document.getElementById(
      "signupUsername"
    ).value.trim();

  const email =
    document.getElementById(
      "signupEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "signupPassword"
    ).value;

  const message =
    document.getElementById(
      "authMessage"
    );


  if (
    !username ||
    !email ||
    !password
  ) {

    message.textContent =
      "Заполни username, email и пароль.";

    return;

  }


  const response =
    await fetch(
      SUPABASE_URL +
      "/auth/v1/signup",
      {

        method: "POST",

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify({

            email,
            password

          })

      }
    );


  const data =
    await response.json();


  if (!response.ok) {

    message.textContent =
      data.msg ||
      data.message ||
      "Ошибка регистрации";

    return;

  }


  if (
    !data.user ||
    !data.access_token
  ) {

    message.textContent =
      "Аккаунт создан. Теперь войди.";

    showAuthForm("login");

    document.getElementById(
      "loginEmail"
    ).value = email;

    return;

  }


  localStorage.setItem(
    "access_token",
    data.access_token
  );

  localStorage.setItem(
    "user_id",
    data.user.id
  );


  await createProfile(
    data.user.id,
    username
  );


  showApp();

}


async function signIn() {

  const email =
    document.getElementById(
      "loginEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "loginPassword"
    ).value;

  const message =
    document.getElementById(
      "authMessage"
    );


  if (!email || !password) {

    message.textContent =
      "Введите email и пароль.";

    return;

  }


  const response =
    await fetch(
      SUPABASE_URL +
      "/auth/v1/token?grant_type=password",
      {

        method: "POST",

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify({

            email,
            password

          })

      }
    );


  const data =
    await response.json();


  if (!response.ok) {

    message.textContent =
      data.msg ||
      data.message ||
      "Ошибка входа";

    return;

  }


  localStorage.setItem(
    "access_token",
    data.access_token
  );

  localStorage.setItem(
    "user_id",
    data.user.id
  );


  showApp();

}


function signOut() {

  localStorage.removeItem(
    "access_token"
  );

  localStorage.removeItem(
    "user_id"
  );

  showAuth();

}


/* =====================================================
   PROFILE
===================================================== */

async function createProfile(
  userId,
  username
) {

  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/profiles",
      {

        method: "POST",

        headers: {

          ...authHeaders(),

          "Prefer":
            "return=minimal"

        },

        body:
          JSON.stringify({

            id: userId,

            username: username,

            display_name:
              username,

            bio: "",

            avatar_url: ""

          })

      }
    );


  if (!response.ok) {

    console.error(
      await response.text()
    );

  }

}


async function loadProfile() {

  const userId =
    localStorage.getItem(
      "user_id"
    );


  if (!userId) return;


  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/profiles?id=eq." +
      userId +
      "&select=*",
      {
        headers
      }
    );


  if (!response.ok) {

    console.error(
      await response.text()
    );

    return;

  }


  const profiles =
    await response.json();


  if (!profiles.length) return;


  const profile =
    profiles[0];


  window.currentProfile =
    profile;


  const displayName =
    profile.display_name ||
    profile.username;


  document.getElementById(
    "profileName"
  ).textContent =
    displayName;


  document.getElementById(
    "profileUsername"
  ).textContent =
    "@" + profile.username;


  document.getElementById(
    "profileBio"
  ).textContent =
    profile.bio ||
    "Описание профиля пока не добавлено.";


  renderProfileAvatar(
    profile
  );

}


function renderProfileAvatar(
  profile
) {

  const container =
    document.getElementById(
      "profileAvatarContainer"
    );


  if (!container) return;


  if (profile.avatar_url) {

    container.innerHTML = `

      <img
        class="big-avatar"
        src="${escapeHtml(
          profile.avatar_url
        )}"
        alt="Аватар"
      >

    `;

  } else {

    const letter =
      (
        profile.display_name ||
        profile.username ||
        "N"
      )
      .charAt(0)
      .toUpperCase();


    container.innerHTML = `

      <div class="avatar-placeholder">
        ${escapeHtml(letter)}
      </div>

    `;

  }

}


function openProfileEditor() {

  const profile =
    window.currentProfile;


  if (!profile) return;


  document.getElementById(
    "editDisplayName"
  ).value =
    profile.display_name ||
    profile.username ||
    "";


  document.getElementById(
    "editUsername"
  ).value =
    profile.username ||
    "";


  document.getElementById(
    "editBio"
  ).value =
    profile.bio ||
    "";


  document.getElementById(
    "profileModal"
  ).classList.add(
    "active"
  );

}


function closeProfileEditor() {

  document.getElementById(
    "profileModal"
  ).classList.remove(
    "active"
  );

}


async function saveProfile() {

  const userId =
    localStorage.getItem(
      "user_id"
    );

  const accessToken =
    localStorage.getItem(
      "access_token"
    );


  const displayName =
    document.getElementById(
      "editDisplayName"
    ).value.trim();


  const username =
    document.getElementById(
      "editUsername"
    ).value.trim();


  const bio =
    document.getElementById(
      "editBio"
    ).value.trim();


  if (!username) {

    alert(
      "Username не может быть пустым."
    );

    return;

  }


  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/profiles?id=eq." +
      userId,
      {

        method: "PATCH",

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            accessToken,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=representation"

        },

        body:
          JSON.stringify({

            display_name:
              displayName,

            username:
              username,

            bio:
              bio

          })

      }
    );


  if (!response.ok) {

    const error =
      await response.text();

    alert(
      "Не удалось сохранить профиль:\n" +
      error
    );

    return;

  }


  closeProfileEditor();

  await loadProfile();

  await loadPosts();

  await loadWall();

}


/* =====================================================
   AVATAR
===================================================== */

function chooseAvatar() {

  document.getElementById(
    "avatarInput"
  ).click();

}


async function uploadAvatar() {

  const input =
    document.getElementById(
      "avatarInput"
    );


  const file =
    input.files[0];


  if (!file) return;


  if (
    !file.type.startsWith(
      "image/"
    )
  ) {

    alert(
      "Можно загружать только изображения."
    );

    input.value = "";

    return;

  }


  if (
    file.size >
    5 * 1024 * 1024
  ) {

    alert(
      "Максимальный размер аватарки: 5 МБ."
    );

    input.value = "";

    return;

  }


  const userId =
    localStorage.getItem(
      "user_id"
    );


  const accessToken =
    localStorage.getItem(
      "access_token"
    );


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const filePath =
    userId +
    "/" +
    Date.now() +
    "." +
    extension;


  const uploadResponse =
    await fetch(
      SUPABASE_URL +
      "/storage/v1/object/Stenka/" +
      filePath,
      {

        method: "POST",

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            accessToken,

          "Content-Type":
            file.type,

          "x-upsert":
            "true"

        },

        body: file

      }
    );


  if (!uploadResponse.ok) {

    const error =
      await uploadResponse.text();

    console.error(error);

    alert(
      "Не удалось загрузить аватарку:\n" +
      error
    );

    return;

  }


  const avatarUrl =
    SUPABASE_URL +
    "/storage/v1/object/public/Stenka/" +
    filePath;


  const updateResponse =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/profiles?id=eq." +
      userId,
      {

        method: "PATCH",

        headers: {

          "apikey":
            SUPABASE_KEY,

          "Authorization":
            "Bearer " +
            accessToken,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=representation"

        },

        body:
          JSON.stringify({

            avatar_url:
              avatarUrl

          })

      }
    );


  if (!updateResponse.ok) {

    alert(
      "Фото загрузилось, но профиль не обновился."
    );

    return;

  }


  input.value = "";

  await loadProfile();

  await loadPosts();

  await loadWall();

}


/* =====================================================
   PAGES
===================================================== */

function showPage(page) {

  document
    .querySelectorAll(".page")
    .forEach(
      element =>
        element.classList.remove(
          "active"
        )
    );


  document
    .querySelectorAll(".nav-button")
    .forEach(
      element =>
        element.classList.remove(
          "active"
        )
    );


  if (page === "feed") {

    document
      .getElementById(
        "feedPage"
      )
      .classList.add(
        "active"
      );


    document
      .getElementById(
        "feedNav"
      )
      .classList.add(
        "active"
      );


    loadPosts();

  }


  if (page === "profile") {

    document
      .getElementById(
        "profilePage"
      )
      .classList.add(
        "active"
      );


    document
      .getElementById(
        "profileNav"
      )
      .classList.add(
        "active"
      );


    loadProfile();

    loadWall();

  }

}

/* =====================================================
   PROFILES FOR POSTS
===================================================== */

async function loadProfilesMap() {

  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/profiles?select=id,username,display_name,avatar_url",
      {
        headers
      }
    );


  if (!response.ok) {

    return {};

  }


  const profiles =
    await response.json();


  const map = {};


  profiles.forEach(
    profile => {

      map[profile.id] =
        profile;

    }
  );


  return map;

}


/* =====================================================
   FEED
===================================================== */

async function loadPosts() {

  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/posts?select=*&order=created_at.desc",
      {
        headers
      }
    );


  if (!response.ok) {

    console.error(
      await response.text()
    );

    return;

  }


  const posts =
    await response.json();


  const profiles =
    await loadProfilesMap();


  const feed =
    document.getElementById(
      "feed"
    );


  if (!feed) return;


  feed.innerHTML = "";


  posts.forEach(
    post =>
      renderPost(
        post,
        feed,
        profiles
      )
  );

}


function renderPost(
  post,
  container,
  profiles
) {

  const reaction =
    localStorage.getItem(
      "reaction_" +
      post.id
    );


  const profile =
    profiles[post.user_id];


  const username =
    profile?.username ||
    post.username ||
    "user";


  const displayName =
    profile?.display_name ||
    username;


  const avatar =
    profile?.avatar_url;


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "post";


  const avatarHTML =
    avatar

      ? `
        <img
          class="mini-avatar"
          src="${escapeHtml(
            avatar
          )}"
          alt=""
        >
      `

      : `
        <div class="mini-avatar-placeholder">
          ${escapeHtml(
            displayName
              .charAt(0)
              .toUpperCase()
          )}
        </div>
      `;


  div.innerHTML = `

    <div class="post-user">

      ${avatarHTML}

      <div>

        <div class="user-name">
          ${escapeHtml(
            displayName
          )}
        </div>

        <div class="post-date">
          @${escapeHtml(
            username
          )}
        </div>

      </div>

    </div>

    <div class="post-text">
      ${escapeHtml(
        post.content
      )}
    </div>

    <div class="actions">

      <button
        class="reaction-btn ${
          reaction === "like"
            ? "active"
            : ""
        }"
        onclick="reactToPost(
          ${post.id},
          'like'
        )"
      >
        👍 ${post.likes || 0}
      </button>

      <button
        class="reaction-btn ${
          reaction === "dislike"
            ? "active"
            : ""
        }"
        onclick="reactToPost(
          ${post.id},
          'dislike'
        )"
      >
        👎 ${post.dislikes || 0}
      </button>

    </div>

  `;


  container.appendChild(
    div
  );

}


/* =====================================================
   CREATE POST
===================================================== */

async function createPost() {

  const input =
    document.getElementById(
      "postInput"
    );


  const text =
    input.value.trim();


  if (!text) return;


  await createPostInDatabase(
    text
  );


  input.value = "";


  await loadPosts();

}


async function createWallPost() {

  const input =
    document.getElementById(
      "wallInput"
    );


  const text =
    input.value.trim();


  if (!text) return;


  await createPostInDatabase(
    text
  );


  input.value = "";


  await loadWall();

}


async function createPostInDatabase(
  text
) {

  const userId =
    localStorage.getItem(
      "user_id"
    );


  const profile =
    window.currentProfile;


  const username =
    profile?.username ||
    "you";


  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/posts",
      {

        method: "POST",

        headers: {

          ...authHeaders(),

          "Prefer":
            "return=representation"

        },

        body:
          JSON.stringify({

            user_id:
              userId,

            username:
              username,

            content:
              text

          })

      }
    );


  if (!response.ok) {

    const error =
      await response.text();

    console.error(error);

    alert(
      "Не удалось опубликовать пост:\n" +
      error
    );

  }

}


/* =====================================================
   WALL
===================================================== */

async function loadWall() {

  const userId =
    localStorage.getItem(
      "user_id"
    );


  if (!userId) return;


  const wall =
    document.getElementById(
      "wall"
    );


  if (!wall) return;


  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/posts?user_id=eq." +
      userId +
      "&select=*&order=created_at.desc",
      {
        headers
      }
    );


  if (!response.ok) {

    console.error(
      await response.text()
    );

    return;

  }


  const posts =
    await response.json();


  const profiles =
    await loadProfilesMap();


  wall.innerHTML = "";


  if (!posts.length) {

    wall.innerHTML = `

      <div class="wall-empty">
        На стене пока ничего нет.
      </div>

    `;

    return;

  }


  posts.forEach(
    post =>
      renderPost(
        post,
        wall,
        profiles
      )
  );

}


/* =====================================================
   REACTIONS
===================================================== */

async function reactToPost(
  postId,
  type
) {

  const oldReaction =
    localStorage.getItem(
      "reaction_" +
      postId
    );


  let likeChange = 0;

  let dislikeChange = 0;

  let newReaction =
    type;


  if (
    oldReaction === type
  ) {

    newReaction = null;


    if (
      type === "like"
    ) {

      likeChange = -1;

    } else {

      dislikeChange = -1;

    }

  } else {

    if (
      oldReaction === "like"
    ) {

      likeChange = -1;

    }


    if (
      oldReaction === "dislike"
    ) {

      dislikeChange = -1;

    }


    if (
      type === "like"
    ) {

      likeChange += 1;

    } else {

      dislikeChange += 1;

    }

  }


  const getResponse =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/posts?id=eq." +
      postId +
      "&select=likes,dislikes",
      {
        headers
      }
    );


  if (!getResponse.ok) {

    alert(
      "Не удалось получить реакцию"
    );

    return;

  }


  const rows =
    await getResponse.json();


  if (!rows.length) return;


  const post =
    rows[0];


  const newLikes =
    Math.max(
      0,
      (post.likes || 0) +
      likeChange
    );


  const newDislikes =
    Math.max(
      0,
      (post.dislikes || 0) +
      dislikeChange
    );


  const updateResponse =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/posts?id=eq." +
      postId,
      {

        method: "PATCH",

        headers: {

          ...authHeaders(),

          "Prefer":
            "return=representation"

        },

        body:
          JSON.stringify({

            likes:
              newLikes,

            dislikes:
              newDislikes

          })

      }
    );


  if (!updateResponse.ok) {

    console.error(
      await updateResponse.text()
    );

    alert(
      "Не удалось сохранить реакцию"
    );

    return;

  }


  if (newReaction) {

    localStorage.setItem(
      "reaction_" +
      postId,
      newReaction
    );

  } else {

    localStorage.removeItem(
      "reaction_" +
      postId
    );

  }


  loadPosts();

  loadWall();

}


/* =====================================================
   SECURITY
===================================================== */

function escapeHtml(text) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}


/* =====================================================
   START
===================================================== */

function startApp() {

  const token =
    localStorage.getItem(
      "access_token"
    );

  const userId =
    localStorage.getItem(
      "user_id"
    );


  if (
    token &&
    userId
  ) {

    showApp();

  } else {

    showAuth();

  }

}


startApp();
