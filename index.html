function updateReactionButtons(
  postId,
  likeCount,
  dislikeCount,
  activeReaction
){

  const postElement=Array.from(document.querySelectorAll('.post[data-post-id]')).find(function(el){return String(el.dataset.postId)===String(postId);});

  if(!postElement)return;

  const like =
    postElement.querySelector(
      '[data-reaction="like"]'
    );

  const dislike =
    postElement.querySelector(
      '[data-reaction="dislike"]'
    );

  if(!like || !dislike)return;

  const likeIcon =
    '<img src="like.png" class="reaction-icon" alt=""> ';

  const dislikeIcon =
    '<img src="dislike.png" class="reaction-icon" alt=""> ';

  like.innerHTML =
    likeIcon+
    Number(likeCount || 0);

  dislike.innerHTML =
    dislikeIcon+
    Number(dislikeCount || 0);

  like.classList.toggle(
    "active",
    activeReaction==="like"
  );

  dislike.classList.toggle(
    "active",
    activeReaction==="dislike"
  );
}

function animateReaction(postId,type){

  const postElement=Array.from(document.querySelectorAll('.post[data-post-id]')).find(function(el){return String(el.dataset.postId)===String(postId);});

  if(!postElement)return;

  const button =
    postElement.querySelector(
      '[data-reaction="'+type+'"]'
    );

  if(!button)return;

  button.classList.remove("reaction-pop");

  void button.offsetWidth;

  button.classList.add("reaction-pop");

  setTimeout(()=>{
    button.classList.remove("reaction-pop");
  },350);
}

async function reactToPost(
  id,
  type,
  postOwnerId
){

  const key =
    "reaction_"+id;

  const old =
    localStorage.getItem(key);

  let likeDelta=0;
  let dislikeDelta=0;

  let nextReaction=null;

  if(old===type){

    if(type==="like"){
      likeDelta=-1;
    }else{
      dislikeDelta=-1;
    }

  }else{

    if(old==="like"){
      likeDelta=-1;
    }

    if(old==="dislike"){
      dislikeDelta=-1;
    }

    if(type==="like"){
      likeDelta=1;
    }else{
      dislikeDelta=1;
    }

    nextReaction=type;
  }

  /*
    Сначала меняем интерфейс.
    Никакого loadPosts() после клика.
    Поэтому лента не пересоздаётся и экран
    не моргает.
  */

  const postElement=Array.from(document.querySelectorAll('.post[data-post-id]')).find(function(el){return String(el.dataset.postId)===String(id);});

  let previousLike=0;
  let previousDislike=0;

  if(postElement){

    const buttons =
      postElement.querySelectorAll(
        ".reaction-btn"
      );

    const likeButton =
      postElement.querySelector(
        '[data-reaction="like"]'
      );

    const dislikeButton =
      postElement.querySelector(
        '[data-reaction="dislike"]'
      );

    if(likeButton){

      previousLike =
        parseInt(
          likeButton.textContent.trim(),
          10
        ) || 0;
    }

    if(dislikeButton){

      previousDislike =
        parseInt(
          dislikeButton.textContent.trim(),
          10
        ) || 0;
    }

    updateReactionButtons(
      id,
      Math.max(
        0,
        previousLike+likeDelta
      ),
      Math.max(
        0,
        previousDislike+dislikeDelta
      ),
      nextReaction
    );

    animateReaction(id,type);
  }

  if(nextReaction){

    localStorage.setItem(
      key,
      nextReaction
    );

  }else{

    localStorage.removeItem(key);
  }

  try{

    const get=await fetch(
      SUPABASE_URL+
      "/rest/v1/posts?id=eq."+
      encodeURIComponent(id)+
      "&select=likes,dislikes",
      {
        headers:authHeaders()
      }
    );

    if(!get.ok){
      throw new Error(
        "Не удалось получить пост."
      );
    }

    const rows=await get.json();

    if(!rows.length){
      throw new Error("Пост не найден.");
    }

    const post=rows[0];

    const newLikes =
      Math.max(
        0,
        Number(post.likes || 0)+likeDelta
      );

    const newDislikes =
      Math.max(
        0,
        Number(post.dislikes || 0)+dislikeDelta
      );

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/posts?id=eq."+
      encodeURIComponent(id),
      {
        method:"PATCH",
        headers:{
          ...authHeaders(),
          Prefer:"return=minimal"
        },
        body:JSON.stringify({
          likes:newLikes,
          dislikes:newDislikes
        })
      }
    );

    if(!response.ok){
      throw new Error(
        await response.text()
      );
    }

    /*
      После ответа сервера аккуратно
      синхронизируем цифры без перерисовки поста.
    */

    updateReactionButtons(
      id,
      newLikes,
      newDislikes,
      nextReaction
    );

    const me =
      getStoredValue("user_id");

    if(
      type==="like" &&
      old!=="like" &&
      postOwnerId &&
      postOwnerId!==me
    ){

      await createNotification(
        postOwnerId,
        me,
        "like",
        id,
        null,
        "понравился ваш пост"
      );
    }

    await updateNotificationBadges();

  }catch(e){

    console.error(e);

    /*
      Возвращаем интерфейс к состоянию
      до клика, опять же без перезагрузки ленты.
    */

    if(old){

      localStorage.setItem(
        key,
        old
      );

    }else{

      localStorage.removeItem(key);
    }

    if(postElement){

      updateReactionButtons(
        id,
        previousLike,
        previousDislike,
        old
      );
    }
  }
}

async function loadNotifications(){

  const me =
    getStoredValue("user_id");

  const container =
    document.getElementById(
      "notificationList"
    );

  if(!me)return;

  container.innerHTML =
    '<div class="search-empty">Загружаем уведомления...</div>';

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/notifications?user_id=eq."+
      encodeURIComponent(me)+
      "&select=*&order=created_at.desc&limit=100",
      {
        headers:authHeaders()
      }
    );

    if(!response.ok){

      throw new Error(
        await response.text()
      );
    }

    const notifications =
      await response.json();

    if(!notifications.length){

      container.innerHTML =
        '<div class="search-empty">Уведомлений пока нет.</div>';

      return;
    }

    const actorIds=[
      ...new Set(
        notifications
          .map(n=>n.actor_id)
          .filter(Boolean)
      )
    ];

    const actors =
      await getProfilesByIds(
        actorIds
      );

    const actorMap={};

    actors.forEach(p=>{
      actorMap[p.id]=p;
    });

    container.innerHTML="";

    notifications.forEach(
      notification=>{

        const actor =
          actorMap[
            notification.actor_id
          ];

        const item =
          document.createElement("div");

        item.className =
          "notification-item"+
          (
            !notification.is_read
              ? " unread"
              : ""
          );

        item.onclick=async()=>{

          if(!notification.is_read){

            await markNotificationRead(
              notification.id
            );
          }

          if(actor){

            openFoundProfile(actor);

          }else{

            await loadNotifications();
          }
        };

        if((actor ? actor.avatar_url : null)){

          const img =
            document.createElement("img");

          img.className=
            "notification-avatar";

          img.src=actor.avatar_url;
          img.alt="";
          img.loading="lazy";
          img.decoding="async";

          item.appendChild(img);

        }else{

          const avatar =
            document.createElement("div");

          avatar.className=
            "notification-avatar-placeholder";

          avatar.textContent=(
            (actor ? actor.display_name : null) ||
            (actor ? actor.username : null) ||
            "N"
          ).charAt(0).toUpperCase();

          item.appendChild(avatar);
        }

        const main =
          document.createElement("div");

        main.className=
          "notification-main";

        const text =
          document.createElement("div");

        text.className=
          "notification-text";

        const name =
          document.createElement("span");

        name.className=
          "notification-name";

        name.textContent =
          (actor ? actor.display_name : null) ||
          (actor ? actor.username : null) ||
          "Пользователь";

        text.appendChild(name);

        text.appendChild(
          document.createTextNode(
            " "+
            (
              notification.content ||
              ""
            )
          )
        );

        const time =
          document.createElement("div");

        time.className=
          "notification-time";

        time.textContent =
          formatMessageTime(
            notification.created_at
          );

        main.appendChild(text);
        main.appendChild(time);

        item.appendChild(main);

        if(!notification.is_read){

          const dot =
            document.createElement("div");

          dot.className=
            "notification-dot";

          item.appendChild(dot);
        }

        container.appendChild(item);
      }
    );

  }catch(e){

    console.error(e);

    container.innerHTML =
      '<div class="search-empty">Не удалось загрузить уведомления.</div>';
  }
}

async function loadConversations(){

  const me =
    getStoredValue("user_id");

  const container =
    document.getElementById(
      "conversations"
    );

  if(!me)return;

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/messages?or="+
      encodeURIComponent(
        "(sender_id.eq."+me+
        ",receiver_id.eq."+me+")"
      )+
      "&select=*&order=created_at.desc&limit=500",
      {
        headers:authHeaders()
      }
    );

    if(!response.ok){
      throw new Error();
    }

    const messages=await response.json();

    const profiles =
      await loadProfilesMap();

    const map={};
    const unreadMap={};

    messages.forEach(m=>{

      const other =
        m.sender_id===me
          ? m.receiver_id
          : m.sender_id;

      if(!map[other]){
        map[other]=m;
      }

      if(
        m.receiver_id===me &&
        !m.is_read
      ){

        unreadMap[other] =
          (unreadMap[other] || 0)+1;
      }
    });

    container.innerHTML="";

    if(!Object.keys(map).length){

      container.innerHTML =
        '<div class="search-empty">Пока нет сообщений.</div>';

      return;
    }

    Object.entries(map).forEach(
      ([id,message])=>{

        const profile =
          profiles[id];

        if(!profile)return;

        const unread =
          unreadMap[id] || 0;

        const item =
          document.createElement("div");

        item.className="conversation";

        item.onclick=()=>{
          openChatWithUser(profile);
        };

        if(profile.avatar_url){

          const img =
            document.createElement("img");

          img.className=
            "conversation-avatar";

          img.src=profile.avatar_url;
          img.alt="";
          img.loading="lazy";
          img.decoding="async";

          item.appendChild(img);

        }else{

          const a =
            document.createElement("div");

          a.className=
            "conversation-placeholder";

          a.textContent=(
            profile.display_name ||
            profile.username
          ).charAt(0).toUpperCase();

          item.appendChild(a);
        }

        const main =
          document.createElement("div");

        main.className=
          "conversation-main";

        const top =
          document.createElement("div");

        top.className=
          "conversation-top";

        const name =
          document.createElement("div");

        name.className =
          "conversation-name"+
          (unread ? " unread" : "");

        name.textContent =
          profile.display_name ||
          profile.username;

        const time =
          document.createElement("div");

        time.className=
          "conversation-time";

        time.textContent =
          formatMessageTime(
            message.created_at
          );

        top.appendChild(name);
        top.appendChild(time);

        const preview =
          document.createElement("div");

        preview.className =
          "conversation-preview"+
          (unread ? " unread" : "");

        preview.textContent =
          unread>0
            ? "Новое сообщение"
            : (message.content || "");

        main.appendChild(top);
        main.appendChild(preview);

        item.appendChild(main);

        if(unread>0){

          const badge =
            document.createElement("div");

          badge.className=
            "unread-count";

          badge.textContent =
            unread>99
              ? "99+"
              : unread;

          item.appendChild(badge);
        }

        container.appendChild(item);
      }
    );

  }catch(e){

    console.error(e);

async function performMessageSearch(){

  const q =
    document
      .getElementById(
        "messageSearchInput"
      )
      .value
      .trim();

  const results =
    document.getElementById(
      "messageSearchResults"
    );

  const conversations =
    document.getElementById(
      "conversations"
    );

  if(!q){

    results.style.display="none";
    conversations.style.display="block";

    await loadConversations();

    return;
  }

  results.style.display="block";
  conversations.style.display="none";

  results.innerHTML =
    '<div class="search-empty">Ищем...</div>';

  try{

    const safe =
      q.replace(/[,*()]/g,"");

    if(!safe){

      results.innerHTML =
        '<div class="search-empty">Введи имя пользователя.</div>';

      return;
    }

    const pattern =
      "*"+safe+"*";

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/profiles?or="+
      encodeURIComponent(
        "(username.ilike."+pattern+
        ",display_name.ilike."+pattern+")"
      )+
      "&select=id,username,display_name,avatar_url"+
      "&limit=20",
      {
        headers:authHeaders()
      }
    );

    if(!response.ok){
      throw new Error();
    }

    const rows=await response.json();

    const me =
      getStoredValue("user_id");

    results.innerHTML="";

    rows
      .filter(p=>p.id!==me)
      .forEach(profile=>{

        const item =
          document.createElement("div");

        item.className=
          "message-user-result";

        item.onclick=()=>{
          openChatWithUser(profile);
        };

        appendFollowAvatar(
          item,
          profile
        );

        const info =
          document.createElement("div");

        const name =
          document.createElement("div");

        name.className=
          "search-user-name";

        name.textContent =
          profile.display_name ||
          profile.username;

        const username =
          document.createElement("div");

        username.className=
          "search-user-username";

        username.textContent =
          "@"+profile.username;

        info.appendChild(name);
        info.appendChild(username);

        item.appendChild(info);

        results.appendChild(item);
      });

    if(!results.children.length){

      results.innerHTML =
        '<div class="search-empty">Пользователь не найден.</div>';
    }

  }catch(e){

    console.error(e);

    results.innerHTML =
      '<div class="search-empty">Ошибка поиска.</div>';
  }
}

async function loadDirectMessages(){

  const container =
    document.getElementById(
      "chatMessages"
    );

  try{

    const filter =
      "(and(sender_id.eq."+me+
      ",receiver_id.eq."+other+
      "),and(sender_id.eq."+other+
      ",receiver_id.eq."+me+"))";

    const response=await fetch(

      encodeURIComponent(filter)+
      "&select=*&order=created_at.asc&limit=500",

      container.innerHTML =
        '<div class="chat-empty">Здесь пока пусто.<br>Напиши первое сообщение.</div>';

      container.scrollHeight;

function renderMessage(
  message,
  me
){

  const row =
    document.createElement("div");

  row.className =
    "message-row "+
    (
      message.sender_id===me
        ? "mine"
        : "theirs"
    );

  row.dataset.messageId=message.id;

  const wrap =
    document.createElement("div");

  wrap.className=
    "message-wrap";

  const bubble =
    document.createElement("div");

  bubble.className=
    "message-bubble";

    document.createTextNode(
      message.content
    );

  bubble.appendChild(content);

  const time =
    document.createElement("div");

  time.className=
    "message-time";

  time.textContent =
    formatChatTime(
      message.created_at
    );

  bubble.appendChild(time);

  wrap.appendChild(bubble);

  if(message.sender_id===me){

    const actions =

    .getElementById("chatMessages")
    .appendChild(row);

async function sendMessage(){

  const input =
    document.getElementById(
      "chatInput"
    );

  const content =
    input.value.trim();

  if(!content)return;

  const me =
    getStoredValue("user_id");

  input.disabled=true;

  try{

    let url;
    let body;

    if(currentGroupChat){

      url =
        SUPABASE_URL+
        "/rest/v1/group_messages";

      body={
        chat_id:currentGroupChat.id,
        sender_id:me,
        content
      };

    }else{

      if(!currentChatUser)return;

      url =
        SUPABASE_URL+
        "/rest/v1/messages";

      body={
        sender_id:me,
        receiver_id:
          currentChatUser.id,
        content,
        is_read:false
      };
    }

    const response=await fetch(
      url,
      {
        method:"POST",
        headers:{
          ...authHeaders(),
          Prefer:"return=representation"
        },
        body:JSON.stringify(body)
      }
    );

    if(!response.ok){

      alert(
        "Не удалось отправить сообщение:\n"+
        await response.text()
      );

      return;
    }

    const created =
      await response.json();

    if(
      !currentGroupChat &&
      currentChatUser &&
      currentChatUser.id!==me
    ){

      const sentMessage =
        Array.isArray(created)
          ? created[0]
          : created;

      await createNotification(
        currentChatUser.id,
        me,
        "message",
        null,
        (sentMessage ? sentMessage.id : null) || null,
        "отправил вам сообщение"
      );
    }

    input.value="";

    if(currentGroupChat){

      await loadGroupMessages();

    }else{

      await loadDirectMessages();
    }

    await updateNotificationBadges();

  }catch(e){

    console.error(e);

    alert("Ошибка отправки.");

  }finally{

    input.disabled=false;

    input.focus();
  }
}

function handleChatKey(event){

  if(
    event.key==="Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();
  }
}

========================================================= */

async function editMessage(
  message
){

  const value =
    prompt(
      "Измени сообщение:",
      message.content
    );

  if(value===null)return;

  const content =
    value.trim();

  if(!content)return;

  const me =
    getStoredValue("user_id");

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/messages?id=eq."+
      encodeURIComponent(message.id)+
      "&sender_id=eq."+
      encodeURIComponent(me),
      {
        method:"PATCH",
        headers:{
          ...authHeaders(),
          Prefer:"return=minimal"
        },
        body:JSON.stringify({
          content,
          updated_at:
            new Date().toISOString()
        })
      }
    );

    if(!response.ok){

      alert(
        "Не удалось изменить сообщение:\n"+
        await response.text()
      );

      return;
    }

    await loadDirectMessages();

  }catch(e){

    console.error(e);

    alert(
      "Ошибка редактирования сообщения."
    );
  }
}

async function deleteMessage(
  message
){

  if(!confirm("Удалить сообщение?")){
    return;
  }

  const me =
    getStoredValue("user_id");

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/messages?id=eq."+
      encodeURIComponent(message.id)+
      "&sender_id=eq."+
      encodeURIComponent(me),
      {
        method:"DELETE",
        headers:{
          ...authHeaders(),
          Prefer:"return=representation"
        }
      }
    );

    if(!response.ok){

      alert(
        "Не удалось удалить сообщение:\n"+
        await response.text()
      );

      return;
    }

    const deleted =
      await response.json().catch(()=>[]);

    if(
      Array.isArray(deleted) &&
      deleted.length===0
    ){

      alert(
        "Сообщение не удалилось. Проверь RLS-политику DELETE для таблицы messages."
      );

      return;
    }

    const row=Array.from(document.querySelectorAll('.message-row[data-message-id]')).find(function(el){return String(el.dataset.messageId)===String(message.id);});

    if(row){

      row.style.transition=
        "opacity .18s ease, transform .18s ease";

      row.style.opacity="0";
      row.style.transform="translateY(-4px)";

      setTimeout(()=>{
        row.remove();
      },180);

    }else{

      await loadDirectMessages();
    }

  }catch(e){

    console.error(e);

    alert(
      "Ошибка удаления сообщения."
    );
  }
}

function startChatPolling(){

  stopChatPolling();

  chatPolling =
    setInterval(
      async()=>{

        if(currentGroupChat){

          await loadGroupMessages();

        }else if(currentChatUser){

          await loadDirectMessages();

          await markDirectMessagesRead(
            currentChatUser.id
          );
        }

      },
      5000
    );
}

function stopChatPolling(){

  if(chatPolling){

    clearInterval(chatPolling);

    chatPolling=null;
  }
}

function closeChat(){

  stopChatPolling();

  currentChatUser=null;
  currentGroupChat=null;

  showPage("messages");
}

      followingResponse,
      followersResponse
    ]=await Promise.all([

      fetch(
        SUPABASE_URL+
        "/rest/v1/follows?follower_id=eq."+

      message.created_at
    );

  bubble.appendChild(time);

  wrap.appendChild(bubble);

  if(
    message.sender_id===me
  ){

    const actions =
      document.createElement("div");

    actions.className="message-actions";

    const edit =
      document.createElement("button");

    edit.textContent=
      "Изменить";

    edit.onclick=()=>{
      editGroupMessage(
        message
      );
    };

    const remove =
      document.createElement("button");

    remove.className=
      "delete";

    remove.textContent=
      "Удалить";

    remove.onclick=()=>{
      deleteGroupMessage(
        message
      );
    };

    actions.appendChild(edit);
    actions.appendChild(remove);

    wrap.appendChild(actions);
  }

  row.appendChild(wrap);

  document
    .getElementById("chatMessages")
    .appendChild(row);
}

async function editGroupMessage(
  message
){

  const value =
    prompt(
      "Измени сообщение:",
      message.content
    );

  if(value===null)return;

  const content =
    value.trim();

  if(!content)return;

  const me =
    getStoredValue("user_id");

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/group_messages?id=eq."+
      encodeURIComponent(message.id)+
      "&sender_id=eq."+
      encodeURIComponent(me),
      {
        method:"PATCH",
        headers:{
          ...authHeaders(),
          Prefer:"return=minimal"
        },
        body:JSON.stringify({
          content,
          updated_at:
            new Date().toISOString()
        })
      }
    );

    if(!response.ok){

      alert(
        "Не удалось изменить сообщение:\n"+
        await response.text()
      );

      return;
    }

    await loadGroupMessages();

  }catch(e){

    console.error(e);

    alert(
      "Ошибка редактирования сообщения."
    );
  }
}

async function deleteGroupMessage(
  message
){

  if(!confirm("Удалить сообщение?")){
    return;
  }

  const me =
    getStoredValue("user_id");

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/group_messages?id=eq."+
      encodeURIComponent(message.id)+
      "&sender_id=eq."+
      encodeURIComponent(me),
      {
        method:"DELETE",
        headers:{
          ...authHeaders(),
          Prefer:"return=representation"
        }
      }
    );

    if(!response.ok){

      alert(
        "Не удалось удалить сообщение:\n"+
        await response.text()
      );

      return;
    }

    const deleted =
      await response.json().catch(()=>[]);

    if(
      Array.isArray(deleted) &&
      deleted.length===0
    ){

      alert(
        "Сообщение не удалилось. Проверь RLS-политику DELETE для group_messages."
      );

      return;
    }

    const row=Array.from(document.querySelectorAll('.message-row[data-message-id]')).find(function(el){return String(el.dataset.messageId)===String(message.id);});

    if(row){

      row.style.transition=
        "opacity .18s ease, transform .18s ease";

      row.style.opacity="0";
      row.style.transform="translateY(-4px)";

      setTimeout(()=>{
        row.remove();
      },180);

    }else{

      await loadGroupMessages();
    }

  }catch(e){

    console.error(e);

    alert(
      "Ошибка удаления сообщения."
    );
  }
}


/* =========================================================
   TIME
========================================================= */

function formatMessageTime(value){

  const date =
    new Date(value);

  const now =
    new Date();

  if(
    date.toDateString()===
    now.toDateString()
  ){

    return date.toLocaleTimeString(
      "ru-RU",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );
  }

  return date.toLocaleDateString(
    "ru-RU",
    {
      day:"2-digit",
      month:"2-digit"
    }
  );
}

function formatChatTime(value){

  return new Date(
    value
  ).toLocaleTimeString(
    "ru-RU",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


/* =========================================================
   PAGES
========================================================= */

function showPage(page){

  if(page!=="chat"){
    stopChatPolling();
  }

  document
    .querySelectorAll(".page")
    .forEach(
      p=>p.classList.remove("active")
    );

  document
    .querySelectorAll(".nav-button")
    .forEach(
      b=>b.classList.remove("active")
    );

  if(page==="feed"){

    document
      .getElementById("feedPage")
      .classList.add("active");

    document
      .getElementById("feedNav")
      .classList.add("active");

    loadPosts();

    return;
  }

  if(page==="search"){

    document
      .getElementById("searchPage")
      .classList.add("active");

    document
      .getElementById("searchNav")
      .classList.add("active");

    return;
  }

  if(page==="messages"){

    document
      .getElementById("messagesPage")
      .classList.add("active");

    document
      .getElementById("messagesNav")
      .classList.add("active");

    loadGroupChats();
    loadConversations();

    return;
  }

  if(page==="chat"){

    document
      .getElementById("chatPage")
      .classList.add("active");

    document
      .getElementById("messagesNav")
      .classList.add("active");

    return;
  }

  if(page==="notifications"){

    document
      .getElementById("notificationsPage")
      .classList.add("active");

    loadNotifications();
    updateNotificationBadges();

    return;
  }

  if(page==="profile"){

    publicProfile=null;
    showProfileTab("wall");

    document
      .getElementById("profilePage")
      .classList.add("active");

    document
      .getElementById("profileNav")
      .classList.add("active");

    loadProfile();
    loadWall();

    return;
  }

  if(page==="editProfile"){
    document.getElementById("editProfilePage").classList.add("active");
    document.getElementById("profileNav").classList.add("active");
    return;
  }

  if(page==="publicProfile"){

    document
      .getElementById("publicProfilePage")
      .classList.add("active");

    document
      .getElementById("searchNav")
      .classList.add("active");

    return;
  }

  if(page==="followList"){

    document
      .getElementById("followListPage")
      .classList.add("active");

    return;
  }
}

========================================================= */

function isAllowedImageUrl(url){

  return(
    typeof url==="string" &&
    url.startsWith(
      SUPABASE_URL+
      "/storage/v1/object/public/Stenka/"
    )
  );
}


/* =========================================================
   EVENTS
========================================================= */

document
  .getElementById("groupModal")
  .addEventListener(
    "click",
    e=>{
      if(
        e.target.id==="groupModal"
      ){
        closeGroupModal();
      }
    }
  );

document.addEventListener(
  "click",
  e=>{

    if(
      !e.target.closest(
        ".post-menu"
      )
    ){

      document
        .querySelectorAll(
          ".post-menu.open"
        )
        .forEach(
          x=>x.classList.remove("open")
        );
    }
  }
);

document.addEventListener(
  "keydown",
  e=>{

    if(
      e.key!=="Enter" ||
      e.shiftKey
    ){
      return;
    }

    if(
      e.target.tagName==="TEXTAREA"
    ){
      return;
    }

    if(
      document
        .getElementById("loginForm")
        .style.display==="block"
    ){

      e.preventDefault();

      signIn();

      return;
    }

    if(
      document
        .getElementById("signupForm")
        .style.display==="block"
    ){

      e.preventDefault();

      signUp();
    }
  }
);


/* =========================================================
   APP START
========================================================= */

async function showApp(){

  const video =
    document.querySelector(
      ".auth-video"
    );

  /*
    Как только приложение открыто,
    музыка и видео полностью останавливаются.
  */

  if(video){

    video.pause();
    video.currentTime=0;
    video.muted=true;
    video.volume=0;
  }

  document.getElementById(
    "authScreen"
  ).style.display="none";

  document.getElementById(
    "app"
  ).style.display="block";

  let profile=null;
  for(let attempt=0; attempt<3 && !profile; attempt++){
    profile=await loadProfile();
    if(!profile){
      await new Promise(r=>setTimeout(r,350));
    }
  }

  if(!profile){
    document.getElementById("app").style.display="none";
    document.getElementById("authScreen").style.display="flex";
    document.getElementById("authMessage").textContent="Не удалось загрузить профиль. Попробуй войти ещё раз.";
    return;
  }

  showPage("feed");

  await updateNotificationBadges();

  if(badgeTimer){
    clearInterval(badgeTimer);
  }

  badgeTimer =
    setInterval(
      updateNotificationBadges,
      15000
    );
}


/* =========================================================
   INITIALIZATION
========================================================= */

(async function(){

  const hasSession=
    !!getStoredValue("access_token") &&
    !!getStoredValue("user_id");

  if(hasSession){
    const valid=await validateSession();
    if(valid){
      await showApp();
      return;
    }
  }

  showAuth();

})();
</script>
