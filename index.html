<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Set</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1014;
      color: white;
    }

    header {
      height: 65px;
      background: #17181d;
      border-bottom: 1px solid #292b33;
      display: flex;
      align-items: center;
      padding: 0 20px;
      position: sticky;
      top: 0;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      max-width: 650px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .create-post {
      background: #17181d;
      border: 1px solid #292b33;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      resize: none;
      background: #0f1014;
      color: white;
      border: 1px solid #30323a;
      border-radius: 10px;
      padding: 12px;
      font-size: 16px;
      outline: none;
    }

    button {
      margin-top: 10px;
      background: #5865f2;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .post {
      background: #17181d;
      border: 1px solid #292b33;
      border-radius: 15px;
      padding: 17px;
      margin-bottom: 15px;
    }

    .user {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .post-text {
      font-size: 16px;
      line-height: 1.5;
    }

    .actions {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }

    .like {
      background: transparent;
      border: 1px solid #30323a;
      color: #aaa;
    }

    .like.active {
      color: #ff4f70;
      border-color: #ff4f70;
    }

    @media (max-width: 700px) {
      .container {
        margin-top: 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Social Set</div>
  </header>
  <div id="profilePanel" style="
  max-width:650px;
  margin:20px auto;
  padding:20px;
  background:#17181d;
  border:1px solid #292b33;
  border-radius:15px;
  display:none;
">
  <h2 style="margin-top:0;">Мой профиль</h2>

  <div id="profileUsername" style="
    font-size:22px;
    font-weight:bold;
    margin-bottom:8px;
  "></div>

  <div id="profileBio" style="
    color:#aaa;
    margin-bottom:15px;
  "></div>

  <button onclick="editProfile()">Редактировать профиль</button>
</div>
  <div id="authPanel" style="
  max-width:650px;
  margin:20px auto;
  padding:20px;
  background:#17181d;
  border:1px solid #292b33;
  border-radius:15px;
">
  <h2 style="margin-top:0;">Войти в Social Set</h2>

  <input
    id="authEmail"
    type="email"
    placeholder="Email"
    style="
      width:100%;
      padding:12px;
      margin-bottom:10px;
      background:#0f1014;
      color:white;
      border:1px solid #30323a;
      border-radius:10px;
      font-size:16px;
    "
  >

  <input
    id="authPassword"
    type="password"
    placeholder="Пароль"
    style="
      width:100%;
      padding:12px;
      margin-bottom:10px;
      background:#0f1014;
      color:white;
      border:1px solid #30323a;
      border-radius:10px;
      font-size:16px;
    "
  >

  <button onclick="signUp()">Регистрация</button>
  <button onclick="signIn()">Войти</button>

  <div id="authMessage" style="margin-top:12px;color:#aaa;"></div>
</div>
    <div class="logo">Social Set</div>

  <main class="container">

    <div class="create-post">
      <textarea id="postInput" placeholder="Что у тебя нового?"></textarea>
      <button onclick="createPost()">Опубликовать</button>
    </div>

    <div id="feed">

      <div class="post">
        <div class="user">@admin</div>
        <div class="post-text">
          Добро пожаловать в Social Set 👋
        </div>

        <div class="actions">
          <button class="like" onclick="likePost(this)">
            ♡ 0
          </button>
        </div>
      </div>

    </div>

  </main>

  <script>
   const SUPABASE_URL = "https://jrzoexmvgyyitojbcxvr.supabase.co";
const SUPABASE_KEY = "sb_publishable_NGzwO7npRZMNPeTSXHNLbQ_TO5apgSJ";

const headers = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};

function authHeaders() {
  return {
    ...headers,
    "Authorization": "Bearer " + localStorage.getItem("access_token")
  };
}

/* POSTS */

async function loadPosts() {
  const response = await fetch(
    SUPABASE_URL + "/rest/v1/posts?select=*&order=created_at.desc",
    { headers }
  );

  if (!response.ok) {
    console.error(await response.text());
    return;
  }

  const posts = await response.json();
  const feed = document.getElementById("feed");

  if (!feed) return;

  feed.innerHTML = "";
  posts.forEach(renderPost);
}

async function createPost() {
  const input = document.getElementById("postInput");
  const text = input.value.trim();

  if (!text) return;

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/posts",
    {
      method: "POST",
      headers: {
        ...headers,
        "Prefer": "return=representation"
      },
      body: JSON.stringify({
        username: "you",
        content: text
      })
    }
  );

  if (!response.ok) {
    console.error(await response.text());
    alert("Не удалось опубликовать пост");
    return;
  }

  input.value = "";
  loadPosts();
}

function renderPost(post) {
  const feed = document.getElementById("feed");
  if (!feed) return;

  const reaction = localStorage.getItem("reaction_" + post.id);

  const div = document.createElement("div");
  div.className = "post";

  div.innerHTML = `
    <div class="user">@${escapeHtml(post.username)}</div>

    <div class="post-text">
      ${escapeHtml(post.content)}
    </div>

    <div class="actions">
      <button
        class="reaction-btn ${reaction === "like" ? "active" : ""}"
        onclick="reactToPost(${post.id}, 'like')"
      >
        👍 ${post.likes || 0}
      </button>

      <button
        class="reaction-btn dislike ${reaction === "dislike" ? "active" : ""}"
        onclick="reactToPost(${post.id}, 'dislike')"
      >
        👎 ${post.dislikes || 0}
      </button>
    </div>
  `;

  feed.appendChild(div);
}

async function reactToPost(postId, type) {
  const oldReaction = localStorage.getItem("reaction_" + postId);

  let likeChange = 0;
  let dislikeChange = 0;
  let newReaction = type;

  if (oldReaction === type) {
    newReaction = null;

    if (type === "like") {
      likeChange = -1;
    } else {
      dislikeChange = -1;
    }
  } else {
    if (oldReaction === "like") likeChange = -1;
    if (oldReaction === "dislike") dislikeChange = -1;

    if (type === "like") {
      likeChange++;
    } else {
      dislikeChange++;
    }
  }

  const getResponse = await fetch(
    SUPABASE_URL +
    "/rest/v1/posts?id=eq." +
    postId +
    "&select=likes,dislikes",
    { headers }
  );

  if (!getResponse.ok) {
    console.error(await getResponse.text());
    alert("Не удалось получить реакцию");
    return;
  }

  const rows = await getResponse.json();

  if (!rows.length) return;

  const post = rows[0];

  const newLikes = Math.max(
    0,
    (post.likes || 0) + likeChange
  );

  const newDislikes = Math.max(
    0,
    (post.dislikes || 0) + dislikeChange
  );

  const updateResponse = await fetch(
    SUPABASE_URL + "/rest/v1/posts?id=eq." + postId,
    {
      method: "PATCH",
      headers: {
        ...headers,
        "Prefer": "return=representation"
      },
      body: JSON.stringify({
        likes: newLikes,
        dislikes: newDislikes
      })
    }
  );

  if (!updateResponse.ok) {
    console.error(await updateResponse.text());
    alert("Не удалось сохранить реакцию");
    return;
  }

  if (newReaction) {
    localStorage.setItem(
      "reaction_" + postId,
      newReaction
    );
  } else {
    localStorage.removeItem(
      "reaction_" + postId
    );
  }

  loadPosts();
}

/* AUTH */

async function signUp() {
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  const message = document.getElementById("authMessage");

  if (!email || !password) {
    message.textContent = "Введите email и пароль";
    return;
  }

  const response = await fetch(
    SUPABASE_URL + "/auth/v1/signup",
    {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email,
        password
      })
    }
  );

  const data = await response.json();

  if (!response.ok) {
    message.textContent =
      data.msg ||
      data.message ||
      "Ошибка регистрации";
    return;
  }

  message.textContent =
    "Регистрация прошла успешно!";
}

async function signIn() {
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  const message = document.getElementById("authMessage");

  if (!email || !password) {
    message.textContent = "Введите email и пароль";
    return;
  }

  const response = await fetch(
    SUPABASE_URL +
    "/auth/v1/token?grant_type=password",
    {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        email,
        password
      })
    }
  );

  const data = await response.json();

  if (!response.ok) {
    message.textContent =
      data.msg ||
      data.message ||
      "Ошибка входа";
    return;
  }

  localStorage.setItem(
    "access_token",
    data.access_token
  );

  localStorage.setItem(
    "user_id",
    data.user.id
  );

  message.textContent =
    "Вы вошли в Social Set!";

  loadProfile();
}

/* PROFILE */

async function loadProfile() {
  const userId = localStorage.getItem("user_id");

  if (!userId) return;

  const response = await fetch(
    SUPABASE_URL +
    "/rest/v1/profiles?id=eq." +
    userId +
    "&select=*",
    {
      headers
    }
  );

  if (!response.ok) {
    console.error(await response.text());
    return;
  }

  const profiles = await response.json();

  if (!profiles.length) return;

  const profile = profiles[0];

  document.getElementById(
    "profileUsername"
  ).textContent = "@" + profile.username;

  document.getElementById(
    "profileBio"
  ).textContent =
    profile.bio ||
    "Описание профиля пока не добавлено.";

  document.getElementById(
    "profilePanel"
  ).style.display = "block";
}

async function editProfile() {
  const userId = localStorage.getItem("user_id");

  if (!userId) {
    alert("Сначала войдите в аккаунт");
    return;
  }

  const username = prompt(
    "Введите новый username:",
    document
      .getElementById("profileUsername")
      .textContent
      .replace("@", "")
  );

  if (!username) return;

  const bio = prompt(
    "Введите описание профиля:",
    document.getElementById("profileBio").textContent
  );

  const response = await fetch(
    SUPABASE_URL +
    "/rest/v1/profiles?id=eq." +
    userId,
    {
      method: "PATCH",
      headers: {
        ...authHeaders(),
        "Prefer": "return=representation"
      },
      body: JSON.stringify({
        username: username.trim(),
        bio: bio || ""
      })
    }
  );

  if (!response.ok) {
    console.error(await response.text());
    alert("Не удалось сохранить профиль");
    return;
  }

  loadProfile();
}

/* HELPERS */

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

/* START */

loadPosts();
loadProfile();
  </script>

</body>
</html>
