<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>No Cap</title>

<style>
*{box-sizing:border-box}

:root{
  --navy:#0b1f3a;
  --sky:#e9f6ff;
  --bg:#f4f9fd;
  --line:#d8e6f0;
  --text:#102033;
  --muted:#718397;
  --red:#ef4056;
  --green:#23753a;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-tap-highlight-color:transparent;
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:default;
}

input,
textarea{
  outline:none;
}

/* =========================
   AUTH
========================= */

#authScreen{
  position:relative;
  min-height:100vh;
  min-height:100dvh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#000;
}

.auth-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
}

.auth-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.2);
  z-index:1;
}

.auth-card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:480px;
  padding:42px 32px;
  border-radius:28px;
  background:rgba(65,0,10,.58);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 25px 80px rgba(0,0,0,.45);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.brand{
  text-align:center;
  font-size:38px;
  line-height:1.05;
  font-weight:900;
  color:#fff;
  letter-spacing:-1.5px;
  margin-bottom:8px;
  text-shadow:0 4px 20px rgba(0,0,0,.25);
}

.tagline{
  text-align:center;
  color:rgba(255,255,255,.72);
  margin:8px 0 25px;
}

.auth-form{
  display:none;
}

.auth-form h2{
  color:#fff;
  margin-top:0;
}

.auth-form input{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:1px solid var(--line);
  border-radius:11px;
  font-size:15px;
  background:#fff;
}

.auth-form button,
.auth-choice button{
  width:100%;
  min-height:58px;
  padding:16px 20px;
  border-radius:16px;
  margin-top:14px;
  font-size:18px;
  font-weight:800;
  transition:.2s;
}

.auth-form button:active,
.auth-choice button:active{
  transform:scale(.98);
}

.remember-me{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:12px;
  margin-bottom:4px;
  color:rgba(255,255,255,.82);
  font-size:14px;
  font-weight:600;
}

.remember-me input{
  width:18px;
  height:18px;
  margin:0;
  accent-color:#9b1832;
}

.primary{
  background:linear-gradient(135deg,#8f1028,#5c0717);
  color:#fff;
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 10px 28px rgba(70,0,15,.35);
}

.secondary{
  background:rgba(255,255,255,.14);
  color:#fff;
  border:1px solid rgba(255,255,255,.28);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}

.back-btn{
  background:transparent;
  color:rgba(255,255,255,.75);
  margin-top:12px;
  padding:7px 0;
}

#authMessage{
  min-height:20px;
  margin-top:12px;
  color:rgba(255,255,255,.82);
  font-size:14px;
}

/* =========================
   APP
========================= */

#app{
  display:none;
  min-height:100vh;
}

header{
  height:64px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:sticky;
  top:0;
  z-index:50;
}

.header-logo{
  display:flex;
  align-items:center;
}

.header-logo-image{
  width:170px;
  height:auto;
  display:block;
  margin-left:-10px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.notification-button{
  position:relative;
  width:40px;
  height:40px;
  border-radius:50%;
  background:#f1f5f8;
  color:var(--navy);
  font-size:20px;
}

.notification-badge{
  position:absolute;
  top:-2px;
  right:-2px;
  min-width:18px;
  height:18px;
  padding:0 5px;
  border-radius:10px;
  background:var(--red);
  color:#fff;
  font-size:10px;
  font-weight:900;
  display:none;
  align-items:center;
  justify-content:center;
}

.logout{
  background:var(--navy);
  color:#fff;
  border-radius:10px;
  padding:9px 13px;
  font-size:13px;
  font-weight:700;
}

.container{
  width:100%;
  max-width:650px;
  margin:20px auto 90px;
  padding:0 15px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* =========================
   COMMON
========================= */

.create-post,
.post,
.profile-card,
.profile-wall,
.public-profile-card,
.search-box,
.search-user,
.conversations,
.follow-list,
.group-card,
.notification-list{
  background:#fff;
  border:1px solid var(--line);
}

.create-post{
  padding:16px;
  border-radius:17px;
  margin-bottom:18px;
}

textarea{
  width:100%;
  min-height:90px;
  resize:vertical;
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  background:#fafdff;
  font-size:16px;
}

.publish{
  margin-top:10px;
  padding:11px 18px;
  border-radius:10px;
  background:var(--navy);
  color:#fff;
  font-weight:700;
}

.wall-empty,
.search-empty{
  color:var(--muted);
  text-align:center;
  padding:25px 10px;
}

/* =========================
   POSTS
========================= */

.post{
  padding:16px;
  border-radius:17px;
  margin-bottom:15px;
}

.post-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.post-user{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
  cursor:pointer;
  min-width:0;
}

.mini-avatar,
.search-avatar,
.message-result-avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  object-fit:cover;
  background:var(--sky);
  border:1px solid var(--line);
  flex-shrink:0;
}

.mini-avatar-placeholder,
.search-avatar-placeholder,
.message-result-placeholder{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--navy);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  flex-shrink:0;
}

.user-name{
  color:var(--navy);
  font-weight:800;
}

.user-handle{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.post-text{
  font-size:16px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.post-image{
  display:block;
  width:100%;
  max-height:650px;
  object-fit:contain;
  border-radius:14px;
  margin-top:12px;
  background:#f1f3f5;
}

.post-menu{
  position:relative;
}

.post-menu-button{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#f1f3f5;
  color:#555;
  font-weight:900;
}

.post-menu-list{
  display:none;
  position:absolute;
  right:0;
  top:39px;
  width:155px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.12);
  overflow:hidden;
  z-index:20;
}

.post-menu.open .post-menu-list{
  display:block;
}

.post-menu-list button{
  width:100%;
  text-align:left;
  padding:11px 13px;
  background:#fff;
}

.post-menu-list button:hover{
  background:var(--sky);
}

.post-menu-list .danger{
  color:var(--red);
}

.actions{
  display:flex;
  gap:8px;
  margin-top:14px;
  flex-wrap:wrap;
}

.reaction-btn,
.comment-toggle{
  display:flex;
  align-items:center;
  gap:5px;
  background:#fff;
  border:1px solid var(--line);
  color:var(--muted);
  border-radius:10px;
  padding:7px 11px;
  font-weight:700;
}

.reaction-icon{
  width:28px;
  height:28px;
  object-fit:contain;
  display:block;
}

.reaction-btn.active{
  color:var(--red);
  border-color:#f1a0aa;
  background:#fff5f6;
}

.reaction-btn.active .reaction-icon{
  filter:brightness(0) saturate(100%)
  invert(24%) sepia(96%) saturate(3300%)
  hue-rotate(350deg) brightness(100%) contrast(105%);
}

.comment-toggle{
  color:var(--navy);
}

/* =========================
   COMMENTS
========================= */

.comments{
  display:none;
  margin-top:14px;
  border-top:1px solid var(--line);
  padding-top:13px;
}

.comments.open{
  display:block;
}

.comment-form{
  display:flex;
  gap:7px;
  margin-bottom:12px;
}

.comment-input{
  flex:1;
  min-height:42px;
  max-height:100px;
  resize:none;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  background:#fafdff;
}

.comment-send{
  width:44px;
  height:42px;
  border-radius:11px;
  background:var(--navy);
  color:#fff;
}

.comment{
  display:flex;
  gap:9px;
  padding:9px 0;
  border-bottom:1px solid #edf1f4;
}

.comment:last-child{
  border-bottom:0;
}

.comment-avatar{
  width:35px;
  height:35px;
  border-radius:50%;
  object-fit:cover;
  background:var(--sky);
  flex-shrink:0;
}

.comment-main{
  flex:1;
  min-width:0;
}

.comment-head{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.comment-author{
  color:var(--navy);
  font-weight:800;
  font-size:14px;
}

.comment-date{
  color:var(--muted);
  font-size:10px;
}

.comment-text{
  margin-top:3px;
  line-height:1.4;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.comment-actions{
  display:flex;
  gap:7px;
  margin-top:5px;
}

.comment-actions button{
  background:transparent;
  color:var(--muted);
  font-size:11px;
  padding:2px 0;
}

.comment-actions .delete{
  color:var(--red);
}

/* =========================
   PHOTOS
========================= */

.post-photo-tools{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:10px;
}

.photo-button{
  background:var(--sky);
  color:var(--navy);
  padding:9px 13px;
  border-radius:10px;
  font-weight:700;
}

.photo-name{
  color:var(--muted);
  font-size:13px;
  max-width:230px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.post-image-preview{
  display:none;
  margin-top:12px;
  position:relative;
}

.post-image-preview.has-image{
  display:block;
}

.post-image-preview img{
  width:100%;
  max-height:400px;
  object-fit:cover;
  border-radius:14px;
}

.remove-photo{
  position:absolute;
  right:8px;
  top:8px;
  width:34px;
  height:34px;
  border-radius:50%;
  background:rgba(0,0,0,.7);
  color:#fff;
}

/* =========================
   PROFILE
========================= */

.profile-card,
.public-profile-card{
  border-radius:17px;
  overflow:hidden;
  margin-bottom:20px;
}

.cover,
.public-cover{
  height:140px;
  background:
    linear-gradient(135deg,#0b1f3a,#23608f,#62b7f5);
}

.profile-info,
.public-info{
  padding:0 18px 20px;
}

.big-avatar,
.public-avatar{
  width:110px;
  height:110px;
  margin-top:-55px;
  border-radius:50%;
  object-fit:cover;
  border:5px solid #fff;
  background:var(--sky);
  display:block;
}

.avatar-placeholder,
.public-avatar-placeholder{
  width:110px;
  height:110px;
  margin-top:-55px;
  border-radius:50%;
  border:5px solid #fff;
  background:var(--navy);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:900;
}

.profile-name,
.public-name{
  margin-top:12px;
  font-size:25px;
  font-weight:900;
  color:var(--navy);
  overflow-wrap:anywhere;
}

.profile-username,
.public-username{
  color:var(--muted);
  margin-top:3px;
}

.profile-bio,
.public-bio{
  margin-top:13px;
  line-height:1.5;
  white-space:pre-wrap;
}

.status-label{
  margin-top:14px;
  font-size:12px;
  font-weight:900;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.5px;
}

.profile-stats,
.public-stats{
  display:flex;
  gap:28px;
  margin-top:18px;
}

.stat{
  cursor:pointer;
}

.stat-number{
  color:var(--navy);
  font-size:19px;
  font-weight:900;
}

.stat-label{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.profile-buttons,
.public-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:16px;
}

.profile-button,
.public-action{
  background:var(--sky);
  color:var(--navy);
  border-radius:10px;
  padding:10px 13px;
  font-weight:700;
}

.profile-button.dark,
.public-action.dark{
  background:var(--navy);
  color:#fff;
}

.public-action{
  flex:1;
}

.public-action.following{
  background:var(--navy);
  color:#fff;
}

.friend-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;
  margin-top:12px;
  padding:7px 10px;
  border-radius:10px;
  background:#edf8ef;
  color:var(--green);
  font-size:13px;
  font-weight:800;
}

.profile-wall{
  border-radius:17px;
  padding:17px;
}

.wall-title{
  font-size:21px;
  font-weight:900;
  color:var(--navy);
  margin-bottom:14px;
}

.public-wall{
  margin-top:20px;
}

.public-back{
  background:transparent;
  color:var(--muted);
  padding:4px 0 12px;
  font-weight:700;
}

/* =========================
   SEARCH
========================= */

.search-box{
  padding:15px;
  border-radius:17px;
  margin-bottom:15px;
}

.search-input{
  width:100%;
  padding:13px 15px;
  border:1px solid var(--line);
  border-radius:12px;
  font-size:16px;
  background:#fafdff;
}

.search-results{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.search-user{
  padding:12px;
  border-radius:15px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
}

.search-avatar,
.search-avatar-placeholder{
  width:50px;
  height:50px;
}

.search-user-name{
  color:var(--navy);
  font-weight:800;
}

.search-user-username{
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}

/* =========================
   FOLLOW
========================= */

.follow-list{
  border-radius:17px;
  overflow:hidden;
}

.follow-list-header{
  padding:17px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid var(--line);
}

.follow-list-title{
  font-size:22px;
  font-weight:900;
  color:var(--navy);
}

.follow-back{
  background:var(--sky);
  color:var(--navy);
  padding:8px 11px;
  border-radius:10px;
  font-weight:700;
}

.follow-user{
  padding:12px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #edf1f4;
  cursor:pointer;
}

.follow-user:last-child{
  border-bottom:0;
}

.follow-user-info{
  flex:1;
  min-width:0;
}

.follow-user-name{
  font-weight:800;
  color:var(--navy);
}

.follow-user-username{
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}

.follow-status{
  font-size:12px;
  color:var(--green);
  font-weight:800;
}

/* =========================
   NOTIFICATIONS
========================= */

.notifications-title,
.messages-title{
  font-size:30px;
  font-weight:900;
  color:#111;
  margin-bottom:17px;
}

.notifications-actions{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.notification-action{
  padding:9px 12px;
  border-radius:10px;
  background:var(--sky);
  color:var(--navy);
  font-weight:700;
}

.notification-list{
  border-radius:18px;
  overflow:hidden;
}

.notification-item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:13px;
  border-bottom:1px solid #edf1f4;
  cursor:pointer;
}

.notification-item:last-child{
  border-bottom:0;
}

.notification-item.unread{
  background:#f1f8ff;
}

.notification-avatar,
.notification-avatar-placeholder{
  width:45px;
  height:45px;
  border-radius:50%;
  flex-shrink:0;
}

.notification-avatar{
  object-fit:cover;
  background:var(--sky);
}

.notification-avatar-placeholder{
  background:var(--navy);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.notification-main{
  flex:1;
  min-width:0;
}

.notification-text{
  line-height:1.35;
}

.notification-name{
  font-weight:900;
  color:var(--navy);
}

.notification-time{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.notification-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--red);
  flex-shrink:0;
}

/* =========================
   MESSAGES
========================= */

.messages-search{
  position:relative;
  margin-bottom:12px;
}

.messages-search-input{
  width:100%;
  height:54px;
  padding:0 20px 0 50px;
  border:0;
  border-radius:28px;
  background:#e9e9ed;
  font-size:17px;
}

.messages-search-icon{
  position:absolute;
  left:18px;
  top:50%;
  transform:translateY(-50%);
  font-size:22px;
  color:#555;
}

.conversations{
  border-radius:18px;
  overflow:hidden;
}

.conversation{
  min-height:85px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #e5e5e5;
  cursor:pointer;
}

.conversation:last-child{
  border-bottom:0;
}

.conversation-avatar,
.conversation-placeholder{
  width:58px;
  height:58px;
  border-radius:50%;
  flex-shrink:0;
}

.conversation-avatar{
  object-fit:cover;
  background:var(--sky);
}

.conversation-placeholder{
  background:var(--navy);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  font-weight:900;
}

.conversation-main{
  flex:1;
  min-width:0;
}

.conversation-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.conversation-name{
  font-size:17px;
  font-weight:800;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.conversation-name.unread{
  font-weight:900;
}

.conversation-time{
  color:#777;
  font-size:12px;
}

.conversation-preview{
  color:#777;
  margin-top:5px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.conversation-preview.unread{
  color:var(--navy);
  font-weight:800;
}

.unread-count{
  min-width:21px;
  height:21px;
  padding:0 6px;
  border-radius:11px;
  background:var(--red);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:900;
}

.message-user-result{
  background:#fff;
  border-bottom:1px solid #e5e5e5;
  padding:12px;
  display:flex;
  align-items:center;

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://jrzoexmvgyyitojbcxvr.supabase.co";

/*
  ВСТАВЬ СЮДА СВОЙ ТЕКУЩИЙ PUBLISHABLE KEY
*/
const SUPABASE_KEY =
  "sb_publishable_NGzwO7npRZMNPeTSXHNLbQ_TO5apgSJ";


const baseHeaders = {
  apikey: SUPABASE_KEY,
  "Content-Type": "application/json"
};


/* =========================================================
   SESSION
========================================================= */

function getToken(){
  return (
    sessionStorage.getItem("access_token") ||
    localStorage.getItem("access_token") ||
    ""
  );
}

function getUserId(){
  return (
    sessionStorage.getItem("user_id") ||
    localStorage.getItem("user_id") ||
    ""
  );
}

function saveSession(data,remember){

  clearSession();

  const storage =
    remember
      ?localStorage
      :sessionStorage;

  storage.setItem(
    "access_token",
    data.access_token
  );

  storage.setItem(
    "refresh_token",
    data.refresh_token||""
  );

  storage.setItem(
    "user_id",
    data.user?.id||""
  );

  if(remember){
    localStorage.setItem("remember_me","1");
  }else{
    localStorage.removeItem("remember_me");
  }
}

function clearSession(){

  localStorage.removeItem("access_token");
  localStorage.removeItem("refresh_token");
  localStorage.removeItem("user_id");
  localStorage.removeItem("remember_me");

  sessionStorage.removeItem("access_token");
  sessionStorage.removeItem("refresh_token");
  sessionStorage.removeItem("user_id");
}

function authHeaders(){

  const token=getToken();

  return{
    ...baseHeaders,
    Authorization:"Bearer "+(
      token||SUPABASE_KEY
    )
  };
}


/* =========================================================
   STATE
========================================================= */

let currentChatUser=null;
let currentGroupChat=null;
let publicProfile=null;
let followListReturn=null;
let currentProfile=null;

let chatPolling=null;
let searchTimer=null;
let messageSearchTimer=null;
let badgeTimer=null;

let profilesCache=null;
let profilesCacheTime=0;

const PROFILE_CACHE_TIME=30000;


/* =========================================================
   AUTH UI
========================================================= */

function showAuthChoice(){

  const choice=document.getElementById("authChoice");
  const login=document.getElementById("loginForm");
  const signup=document.getElementById("signupForm");
  const message=document.getElementById("authMessage");

  if(choice)choice.style.display="block";
  if(login)login.style.display="none";
  if(signup)signup.style.display="none";
  if(message)message.textContent="";
}

function showAuthForm(type){

  document.getElementById("authChoice").style.display="none";

  document.getElementById("loginForm").style.display=
    type==="login"?"block":"none";

  document.getElementById("signupForm").style.display=
    type==="signup"?"block":"none";

  document.getElementById("authMessage").textContent="";
}


/* =========================================================
   SIGN UP
========================================================= */

async function signUp(){

  const username=
    document.getElementById("signupUsername").value.trim();

  const email=
    document.getElementById("signupEmail").value.trim();

  const password=
    document.getElementById("signupPassword").value;

  const message=
    document.getElementById("authMessage");

  const button=
    document.getElementById("signupButton");

  if(!username||!email||!password){
    message.textContent="Заполни все поля.";
    return;
  }

  if(!/^[a-zA-Z0-9_.-]+$/.test(username)){
    message.textContent=
      "Username: только латиница, цифры, _ . -";
    return;
  }

  if(username.length<3){
    message.textContent=
      "Username должен быть минимум 3 символа.";
    return;
  }

  if(password.length<6){
    message.textContent=
      "Пароль должен быть минимум 6 символов.";
    return;
  }

  button.disabled=true;
  message.textContent="Создаём аккаунт...";

  try{

    const response=await fetch(
      SUPABASE_URL+"/auth/v1/signup",
      {
        method:"POST",
        headers:baseHeaders,
        body:JSON.stringify({
          email,
          password
        })
      }
    );

    const data=await response.json();

    if(!response.ok){
      message.textContent=
        data.msg||
        data.message||
        data.error_description||
        "Ошибка регистрации.";
      return;
    }

    if(!data.user){
      message.textContent=
        "Не удалось создать пользователя.";
      return;
    }

    if(!data.access_token){

      message.textContent=
        "Аккаунт создан. Теперь войди.";

      showAuthForm("login");

      document.getElementById("loginEmail").value=email;

      return;
    }

    saveSession(data,false);

    const ok=
      await createProfile(
        data.user.id,
        username
      );

    if(!ok){

      clearSession();

      message.textContent=
        "Аккаунт создан, но профиль не создался.";

      return;
    }

    await showApp();

  }catch(error){

    console.error(error);

    message.textContent=
      "Ошибка соединения.";

  }finally{

    button.disabled=false;

  }
}

/* =========================================================
   SESSION VALIDATION / REFRESH
========================================================= */

async function refreshSession(){

  const refreshToken=
    sessionStorage.getItem("refresh_token")||
    localStorage.getItem("refresh_token");

  if(!refreshToken)return false;

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/auth/v1/token?grant_type=refresh_token",
      {
        method:"POST",
        headers:baseHeaders,
        body:JSON.stringify({
          refresh_token:refreshToken
        })
      }
    );

    if(!response.ok){
      clearSession();
      return false;
    }

    const data=await response.json();

    const remember=
      localStorage.getItem("remember_me")==="1";

    saveSession(data,remember);

    return true;

  }catch{

    return false;
  }
}

async function validateSession(){

  const token=getToken();
  const userId=getUserId();

  if(!token||!userId)return false;

  try{

    let response=await fetch(
      SUPABASE_URL+"/auth/v1/user",
      {
        headers:{
          apikey:SUPABASE_KEY,
          Authorization:"Bearer "+token
        }
      }
    );

    if(response.status===401){

      const refreshed=
        await refreshSession();

      if(!refreshed)return false;

      const newToken=getToken();

      response=await fetch(
        SUPABASE_URL+"/auth/v1/user",
        {
          headers:{
            apikey:SUPABASE_KEY,
            Authorization:"Bearer "+newToken
          }
        }
      );
    }

    if(!response.ok){

      clearSession();
      return false;
    }

    const user=await response.json();

    if(user.id!==userId){

      clearSession();
      return false;
    }

    return true;

  }catch{

    return false;
  }
}

async function createProfile(id,username){

      SUPABASE_URL+"/rest/v1/profiles",
      {
        method:"POST",
        headers:{
          ...authHeaders(),
          Prefer:"return=minimal"
        },
        body:JSON.stringify({

          username,
          display_name:username,
          bio:"",
          avatar_url:"",
          cover_url:""
        })
      }
    );

    if(response.ok){

      profilesCache=null;
      return true;
    }

    console.error(await response.text());

    return false;

  }catch(error){

async function loadProfile(){

  const id=getUserId();

  if(!id)return null;

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/profiles?id=eq."+
      encodeURIComponent(id)+
      "&select=*",
      {
        headers:authHeaders()
      }
    );

    if(response.status===401){

      if(await refreshSession()){

        return loadProfile();

      }
    }

    if(!response.ok)return null;

    const rows=await response.json();

    if(!rows.length)return null;

    const profile=rows[0];

    currentProfile=profile;
    window.currentProfile=profile;

    document.getElementById("profileName").textContent=
      profile.display_name||profile.username;

    document.getElementById("profileUsername").textContent=
      "@"+profile.username;

    document.getElementById("profileBio").textContent=
      profile.bio||"Status пока не добавлен.";

    renderAvatar(
      "profileAvatarContainer",
      profile,
      "big"
    );

    await loadFollowStats(
      id,
      "myFollowersCount",
      "myFollowingCount"
    );

    return profile;

  }catch(error){

    console.error(error);

    return null;
  }
}

function renderAvatar(containerId,profile,type){

      document.createElement("img");

    img.src=profile.avatar_url;
    img.alt="";

      type==="big"
        ?"big-avatar"
        :type==="public"
        ?"public-avatar"
        :type==="chat"
        ?"chat-avatar"

    type==="big"
      ?"avatar-placeholder"
      :type==="public"
      ?"public-avatar-placeholder"
      :type==="chat"
      ?"chat-avatar-placeholder"
      :"mini-avatar-placeholder";

    (
      profile?.display_name||

    ).charAt(0).toUpperCase();

async function uploadAvatar(){

  const input=
    document.getElementById("avatarInput");

  const file=input.files[0];

  if(!file)return;

  if(!file.type.startsWith("image/")){

    alert("Можно загружать только изображения.");

    input.value="";

    return;
  }

  if(file.size>10*1024*1024){

    alert("Максимальный размер: 10 МБ.");

    input.value="";

    return;
  }

  const id=getUserId();

  try{

    const prepared=
      await prepareImageForUpload(file);

    const ext=
      getImageExtension(
        prepared.type,
        file.name
      );

    const path=
      id+"/"+Date.now()+"-avatar."+ext;

    const upload=
      await uploadToStorage(
        path,
        prepared
      );

    if(!upload.ok){

      alert(
        "Ошибка загрузки:\n"+
        upload.text
      );

      return;
    }

    const url=
      SUPABASE_URL+
      "/storage/v1/object/public/Stenka/"+
      path;

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/profiles?id=eq."+
      encodeURIComponent(id),
      {
        method:"PATCH",
        headers:{
          ...authHeaders(),
          Prefer:"return=representation"
        },
        body:JSON.stringify({
          avatar_url:url
        })
      }
    );

    if(!response.ok){

      alert(
        "Фото загрузилось, но профиль не обновился."
      );

      return;
    }

    profilesCache=null;

    input.value="";

    await loadProfile();

  }catch(error){

    console.error(error);

    alert("Ошибка загрузки аватарки.");
  }
}

async function saveProfile(){

  const id=getUserId();

  const display_name=
    document
      .getElementById("editDisplayName")
      .value
      .trim();

  const username=
    document
      .getElementById("editUsername")
      .value
      .trim();

  const bio=
    document
      .getElementById("editBio")
      .value
      .trim();

  if(!username){

    alert("Username не может быть пустым.");

    return;
  }

  if(!/^[a-zA-Z0-9_.-]+$/.test(username)){

    alert(
      "Username: только латиница, цифры, _ . -"
    );

    return;
  }

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/profiles?id=eq."+
      encodeURIComponent(id),
      {
        method:"PATCH",
        headers:{
          ...authHeaders(),
          Prefer:"return=representation"
        },
        body:JSON.stringify({
          display_name,
          username,
          bio
        })
      }
    );

    if(!response.ok){

      const text=await response.text();

      if(
        text.includes("23505")||
        text.includes("duplicate")
      ){

        alert("Этот username уже занят.");

      }else{

        alert(
          "Не удалось сохранить:\n"+
          text
        );
      }

      return;
    }

    profilesCache=null;

    closeProfileEditor();

    await loadProfile();

  }catch(error){

    console.error(error);

    alert("Ошибка сохранения.");
  }
}

      const element=
        document.getElementById(followersId);

      }

async function isFollowing(target){

  const me=getUserId();

  if(!me||me===target)return false;

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/follows?follower_id=eq."+
      encodeURIComponent(me)+
      "&following_id=eq."+
      encodeURIComponent(target)+
      "&select=follower_id",
      {
        headers:authHeaders()
      }
    );

    if(!response.ok)return false;

    return(
      (await response.json()).length>0
    );

  }catch{

    return false;
  }
}

async function isFriend(target){

  const me=getUserId();

  if(!me||me===target)return false;

  try{

    const [a,b]=await Promise.all([

      fetch(
        SUPABASE_URL+
        "/rest/v1/follows?follower_id=eq."+
        encodeURIComponent(me)+
        "&following_id=eq."+
        encodeURIComponent(target)+
        "&select=follower_id",
        {
          headers:authHeaders()
        }
      ),

      fetch(
        SUPABASE_URL+
        "/rest/v1/follows?follower_id=eq."+
        encodeURIComponent(target)+
        "&following_id=eq."+
        encodeURIComponent(me)+
        "&select=follower_id",
        {
          headers:authHeaders()
        }
      )

    ]);

    if(!a.ok||!b.ok)return false;

    return(
      (await a.json()).length>0&&
      (await b.json()).length>0
    );

  }catch{

    return false;
  }
}

async function toggleFollow(target){

  const me=getUserId();

  if(!me||me===target)return;

  try{

    const following=
      await isFollowing(target);

    let response;

    if(following){

      response=await fetch(
        SUPABASE_URL+
        "/rest/v1/follows?follower_id=eq."+
        encodeURIComponent(me)+
        "&following_id=eq."+
        encodeURIComponent(target),
        {
          method:"DELETE",
          headers:authHeaders()
        }
      );

    }else{

      response=await fetch(
        SUPABASE_URL+
        "/rest/v1/follows",
        {
          method:"POST",
          headers:{
            ...authHeaders(),
            Prefer:"return=minimal"
          },
          body:JSON.stringify({
            follower_id:me,
            following_id:target
          })
        }
      );
    }

    if(!response.ok){

      const text=await response.text();

      if(!text.includes("23505")){
        alert(
          "Не удалось изменить подписку:\n"+
          text
        );
        return;
      }
    }

    await renderPublicActions(target);

    if(publicProfile){

      await loadFollowStats(
        target,
        "publicFollowersCount",
        "publicFollowingCount"
      );
    }

    await loadFollowStats(
      me,
      "myFollowersCount",
      "myFollowingCount"
    );

  }catch(error){

    console.error(error);

    alert("Ошибка подписки.");
  }
}

async function renderPublicActions(target){

    document.getElementById("publicActions");

    document.getElementById("publicFriendBadge");

  container.innerHTML="";
  badge.innerHTML="";

  if(!me)return;

      document.createElement("button");

    button.className="public-action";
    button.textContent="Это ваш профиль";
    button.disabled=true;

  }

    document.createElement("button");

  follow.className=
    "public-action"+
    (following?" following":"");

      ?"✓ Вы подписаны"
      :"Подписаться";

  follow.onclick=async()=>{

    follow.disabled=true;

    await toggleFollow(target);

    follow.disabled=false;
  };

    document.createElement("button");

  message.className="public-action";
  message.textContent="💬 Написать";

  message.onclick=()=>{

async function openFollowList(type,userId){

        ?"follower_id"
        :"following_id";

      column+"=eq."+
      encodeURIComponent(userId)+

      {
        headers:authHeaders()
      }
    );

      throw new Error(

      content.innerHTML=
        '<div class="search-empty">Здесь пока никого нет.</div>';

        "follow-user-username";

        "@"+profile.username;

      info.appendChild(username);

async function getProfilesByIds(ids){

  if(!ids.length)return [];

  const unique=
    [...new Set(ids)];

  const response=await fetch(
    SUPABASE_URL+
    "/rest/v1/profiles?id=in.("+
    unique.map(
      encodeURIComponent
    ).join(",")+
    ")"+
    "&select=id,username,display_name,avatar_url,bio",
    {
      headers:authHeaders()
    }
  );

  if(!response.ok)return [];

  const rows=await response.json();

  const map={};

  rows.forEach(profile=>{
    map[profile.id]=profile;
  });

  return unique
    .map(id=>map[id])
    .filter(Boolean);
}

async function performUserSearch(){

  const input=
    document.getElementById("userSearchInput");

  const results=
    document.getElementById("searchResults");

  const q=input.value.trim();

  if(!q){

    results.innerHTML=
      '<div class="search-empty">Начни вводить username или имя</div>';

    return;
  }

  results.innerHTML=
    '<div class="search-empty">Ищем...</div>';

  try{

    const safe=
      q.replace(/[,*()]/g,"");

    const pattern=
      "*"+safe+"*";

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/profiles?or="+
      encodeURIComponent(
        "(username.ilike."+pattern+
        ",display_name.ilike."+pattern+")"
      )+
      "&select=id,username,display_name,avatar_url"+
      "&limit=30",
      {
        headers:authHeaders()
      }
    );

    if(!response.ok)throw new Error();

    const rows=await response.json();

    results.innerHTML="";

    if(!rows.length){

      results.innerHTML=
        '<div class="search-empty">Пользователей не найдено.</div>';

      return;
    }

    rows.forEach(profile=>{

      const item=
        document.createElement("div");

      item.className="search-user";

      item.onclick=()=>{
        openFoundProfile(profile);
      };

      appendFollowAvatar(
        item,
        profile
      );

      const info=
        document.createElement("div");

      const name=

      name.textContent=

      '<div class="search-empty">Ошибка поиска.</div>';

}


/* =========================================================
   PROFILE CACHE
========================================================= */

async function loadProfilesMap(force=false){

  if(
    !force&&
    profilesCache&&
    Date.now()-profilesCacheTime<
      PROFILE_CACHE_TIME
  ){

    return profilesCache;
  }

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/profiles?select=id,username,display_name,avatar_url",
      {
        headers:authHeaders()
      }
    );

    if(!response.ok){
      return profilesCache||{};
    }

    const rows=await response.json();

    const map={};

    rows.forEach(profile=>{
      map[profile.id]=profile;
    });

    profilesCache=map;
    profilesCacheTime=Date.now();

    return map;

  }catch{

    return profilesCache||{};
  }
}

   POSTS
========================================================= */

async function getCommentsForPosts(posts){

  if(!posts.length)return {};

  const ids=
    posts.map(post=>post.id);

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/comments?post_id=in.("+
      ids.join(",")+
      ")"+
      "&select=*&order=created_at.asc",
      {
        headers:authHeaders()
      }
    );

    if(!response.ok)return {};

    const rows=await response.json();

    const map={};

    rows.forEach(comment=>{

      if(!map[comment.post_id]){
        map[comment.post_id]=[];
      }

      map[comment.post_id].push(comment);
    });

    return map;

  }catch{

    return {};
  }
}

async function loadPosts(){

  const feed=
    document.getElementById("feed");

  feed.innerHTML=
    '<div class="wall-empty">Загружаем ленту...</div>';

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/posts?select=*&order=created_at.desc&limit=50",
      {
        headers:authHeaders()
      }
    );

    if(!response.ok)throw new Error();

    const posts=await response.json();

    const profiles=
      await loadProfilesMap();

    const comments=
      await getCommentsForPosts(posts);

    feed.innerHTML="";

    if(!posts.length){

      feed.innerHTML=
        '<div class="wall-empty">Пока нет постов.</div>';

      return;
    }

    posts.forEach(post=>{

      renderPost(
        post,
        feed,
        profiles,
        comments[post.id]||[]
      );

    });

  }catch(error){

    console.error(error);

    feed.innerHTML=
      '<div class="wall-empty">Не удалось загрузить ленту.</div>';
  }
}

function renderPost(
  post,
  container,
  profiles,
  comments=[]
){

  const profile=
    profiles[post.user_id];

  const username=
    profile?.username||
    post.username||
    "user";

  const display=
    profile?.display_name||
    username;

  const me=getUserId();

  const own=
    post.user_id===me;

  const div=
    document.createElement("div");

  div.className="post";

  const top=
    document.createElement("div");

  top.className="post-top";

  const user=
    document.createElement("div");

  user.className="post-user";

  if(profile){

    user.onclick=()=>{
      openFoundProfile(profile);
    };

    if(profile.avatar_url){

      const img=
        document.createElement("img");

      img.className="mini-avatar";
      img.src=profile.avatar_url;
      img.alt="";
      img.loading="lazy";

      user.appendChild(img);

    }else{

      const avatar=
        document.createElement("div");

      avatar.className=
        "mini-avatar-placeholder";

      avatar.textContent=
        display
          .charAt(0)
          .toUpperCase();

      user.appendChild(avatar);
    }
  }

  const info=
    document.createElement("div");

  const name=
    document.createElement("div");

  name.className="user-name";
  name.textContent=display;

  const handle=
    document.createElement("div");

  handle.className="user-handle";
  handle.textContent="@"+username;

  info.appendChild(name);
  info.appendChild(handle);

  user.appendChild(info);
  top.appendChild(user);

  if(own){

    const menu=
      document.createElement("div");

    menu.className="post-menu";

    const button=
      document.createElement("button");

    button.className=
      "post-menu-button";

    button.textContent="•••";

    const list=
      document.createElement("div");

    list.className="post-menu-list";

    const edit=
      document.createElement("button");

    edit.textContent=
      "✏️ Редактировать";

    edit.onclick=()=>{
      menu.classList.remove("open");
      editPost(post);
    };

    const remove=
      document.createElement("button");

    remove.className="danger";
    remove.textContent=
      "🗑️ Удалить";

    remove.onclick=()=>{
      menu.classList.remove("open");
      deletePost(post);
    };

    list.appendChild(edit);
    list.appendChild(remove);

    button.onclick=event=>{

      event.stopPropagation();

      menu.classList.toggle("open");
    };

    menu.appendChild(button);
    menu.appendChild(list);

    top.appendChild(menu);
  }

  div.appendChild(top);

  if(post.content){

    const text=
      document.createElement("div");

    text.className="post-text";
    text.textContent=post.content;

    div.appendChild(text);
  }

  if(
    post.image_url&&
    isAllowedImageUrl(post.image_url)
  ){

    const img=
      document.createElement("img");

    img.className="post-image";
    img.src=post.image_url;
    img.loading="lazy";
    img.alt="Фото";

    div.appendChild(img);
  }

  const actions=
    document.createElement("div");

  actions.className="actions";

  const reaction=
    localStorage.getItem(
      "reaction_"+post.id
    );

  const like=
    document.createElement("button");

  like.className=
    "reaction-btn"+
    (reaction==="like"?" active":"");

  like.innerHTML=
    '<img src="like.png" class="reaction-icon">'+
    Number(post.likes||0);

  like.onclick=()=>{
    reactToPost(
      post.id,
      "like",
      post.user_id,
      like,
      dislike
    );
  };

  const dislike=
    document.createElement("button");

  dislike.className=
    "reaction-btn"+
    (reaction==="dislike"?" active":"");

  dislike.innerHTML=
    '<img src="dislike.png" class="reaction-icon">'+
    Number(post.dislikes||0);

  dislike.onclick=()=>{
    reactToPost(
      post.id,
      "dislike",
      post.user_id,
      like,
      dislike
    );
  };

  const commentButton=
    document.createElement("button");

  commentButton.className="comment-toggle";

  commentButton.innerHTML=
    '<img src="comment.png" class="reaction-icon">'+
    " Комментарии ("+
    comments.length+
    ")";

  actions.appendChild(like);
  actions.appendChild(dislike);
  actions.appendChild(commentButton);

  div.appendChild(actions);

  const commentsBox=
    document.createElement("div");

  commentsBox.className="comments";

  const form=
    document.createElement("div");

  form.className="comment-form";

  const input=
    document.createElement("textarea");

  input.className="comment-input";
  input.rows=1;
  input.maxLength=2000;
  input.placeholder=
    "Написать комментарий...";

  const send=
    document.createElement("button");

  send.className="comment-send";
  send.textContent="↑";

  send.onclick=async()=>{

    await addComment(
      post.id,
      input,
      commentsBox,
      commentButton,
      post.user_id
    );
  };

  input.onkeydown=event=>{

    if(
      event.key==="Enter"&&
      !event.shiftKey
    ){

      event.preventDefault();

      send.click();
    }
  };

  form.appendChild(input);
  form.appendChild(send);

  commentsBox.appendChild(form);

  const commentList=
    document.createElement("div");

  commentsBox.appendChild(commentList);

  commentButton.onclick=()=>{
    commentsBox.classList.toggle("open");
  };

  renderComments(
    commentList,
    comments
  );

  div.appendChild(commentsBox);

  container.appendChild(div);
}

async function editPost(post){

  const value=
    prompt(
      "Измени публикацию:",
      post.content||""
    );

  if(value===null)return;

  const content=value.trim();

  if(!content&&!post.image_url){

    alert(
      "Публикация не может быть полностью пустой."
    );

    return;
  }

  const me=getUserId();

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/posts?id=eq."+
      encodeURIComponent(post.id)+
      "&user_id=eq."+
      encodeURIComponent(me),
      {
        method:"PATCH",
        headers:{
          ...authHeaders(),
          Prefer:"return=minimal"
        },
        body:JSON.stringify({
          content,
          updated_at:new Date().toISOString()
        })
      }
    );

    if(!response.ok){

      alert(
        "Не удалось изменить публикацию:\n"+
        await response.text()
      );

      return;
    }

    await refreshVisiblePosts();

  }catch(error){

    console.error(error);

    alert("Ошибка редактирования.");
  }
}

async function deletePost(post){

  if(!confirm("Удалить эту публикацию?")){
    return;
  }

  const me=getUserId();

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/posts?id=eq."+
      encodeURIComponent(post.id)+
      "&user_id=eq."+
      encodeURIComponent(me),
      {
        method:"DELETE",
        headers:authHeaders()
      }
    );

    if(!response.ok){

      alert(
        "Не удалось удалить публикацию:\n"+
        await response.text()
      );

      return;
    }

    if(
      post.image_url&&
      isAllowedImageUrl(post.image_url)
    ){

      const marker=
        "/storage/v1/object/public/Stenka/";

      const index=
        post.image_url.indexOf(marker);

      if(index!==-1){

        const path=
          decodeURIComponent(
            post.image_url.slice(
              index+marker.length
            )
          );

        await deleteStorageFile(path);
      }
    }

    await refreshVisiblePosts();

  }catch(error){

    console.error(error);

    alert("Ошибка удаления.");
  }
}

async function refreshVisiblePosts(){

  await loadPosts();

  if(
    document
      .getElementById("profilePage")
      .classList.contains("active")
  ){

    await loadWall();
  }

  if(
    publicProfile&&
    document
      .getElementById("publicProfilePage")
      .classList.contains("active")
  ){

    await loadPublicWall(
      publicProfile.id
    );
  }
}

    avatar.style.display="flex";
    avatar.style.alignItems="center";
    avatar.style.justifyContent="center";

    wrapper.appendChild(avatar);
  }

  const main=
    document.createElement("div");

  main.className="comment-main";

  const head=
    document.createElement("div");

  head.className="comment-head";

  const author=
    document.createElement("div");

  author.className="comment-author";

  author.textContent=
    profile?.display_name||
    profile?.username||

  if(profile){

    author.style.cursor="pointer";

    author.onclick=()=>{
      openFoundProfile(profile);
    };
  }

  const date=
    document.createElement("div");

  date.className="comment-date";

  date.textContent=
    formatMessageTime(
      comment.created_at
    );

  head.appendChild(author);
  head.appendChild(date);

  const text=
    document.createElement("div");

  text.className="comment-text";
  text.textContent=comment.content;

  main.appendChild(head);
  main.appendChild(text);

  if(comment.user_id===me){

    const actions=
      document.createElement("div");

    actions.className="comment-actions";

      );
    };

    actions.appendChild(edit);
    actions.appendChild(remove);

    main.appendChild(actions);
  }

  wrapper.appendChild(main);
  container.appendChild(wrapper);
}

async function addComment(

  input,
  commentsBox,
  button,
  postOwnerId
){

  const content=

  if(!content)return;

  const userId=getUserId();

  input.disabled=true;

  try{

    const response=await fetch(
      SUPABASE_URL+"/rest/v1/comments",
      {
        method:"POST",
        headers:{
          ...authHeaders(),
          Prefer:"return=representation"
        },

    await updateNotificationBadges();

    console.error(error);

function choosePostImage(type){

  document
    .getElementById(
      type==="wall"
        ?"wallImageInput"
        :"postImageInput"
    )
    .click();
}

function previewPostImage(
  event,
  type
){

  const input=event.target;
  const file=input.files[0];

  const preview=
    document.getElementById(
      type==="wall"
        ?"wallImagePreview"
        :"postImagePreview"
    );

  const name=
    document.getElementById(
      type==="wall"
        ?"wallImageName"
        :"postImageName"
    );

  preview.innerHTML="";
  preview.classList.remove("has-image");
  name.textContent="";

  if(!file)return;

  if(!file.type.startsWith("image/")){

    alert(
      "Можно выбрать только изображение."
    );

    input.value="";

    return;
  }

  if(file.size>10*1024*1024){

    alert(
      "Максимальный размер: 10 МБ."
    );

    input.value="";

    return;
  }

  name.textContent=file.name;

  const reader=
    new FileReader();

  reader.onload=()=>{

    const img=
      document.createElement("img");

    img.src=reader.result;

    const remove=
      document.createElement("button");

    remove.className="remove-photo";
    remove.textContent="×";

    remove.onclick=()=>{

      input.value="";
      preview.innerHTML="";
      preview.classList.remove(
        "has-image"
      );
      name.textContent="";
    };

    preview.appendChild(img);
    preview.appendChild(remove);

    preview.classList.add(
      "has-image"
    );
  };

  reader.readAsDataURL(file);
}

function clearPostImage(type){

  const input=
    document.getElementById(
      type==="wall"
        ?"wallImageInput"
        :"postImageInput"
    );

  const preview=
    document.getElementById(
      type==="wall"
        ?"wallImagePreview"
        :"postImagePreview"
    );

  const name=
    document.getElementById(
      type==="wall"
        ?"wallImageName"
        :"postImageName"
    );

  input.value="";
  preview.innerHTML="";
  preview.classList.remove("has-image");
  name.textContent="";
}

function getImageExtension(
  mime,
  name
){

  if(mime==="image/jpeg")return"jpg";
  if(mime==="image/png")return"png";
  if(mime==="image/webp")return"webp";
  if(mime==="image/gif")return"gif";

  return(
    name
      .split(".")
      .pop()
      ?.toLowerCase()||
    "jpg"
  );
}

function loadImage(file){

  return new Promise(
    (resolve,reject)=>{

      const url=
        URL.createObjectURL(file);

      const image=
        new Image();

      image.onload=()=>{

        URL.revokeObjectURL(url);

        resolve(image);
      };

      image.onerror=()=>{

        URL.revokeObjectURL(url);

        reject();
      };

      image.src=url;
    }
  );
}

async function prepareImageForUpload(file){

  if(
    ![
      "image/jpeg",
      "image/png",
      "image/webp"
    ].includes(file.type)||
    file.size<1200000
  ){

    return file;
  }

  try{

    const image=
      await loadImage(file);

    const max=2000;

    const scale=
      Math.min(
        1,
        max/
        Math.max(
          image.naturalWidth,
          image.naturalHeight
        )
      );

    const canvas=
      document.createElement("canvas");

    canvas.width=
      Math.round(
        image.naturalWidth*scale
      );

    canvas.height=
      Math.round(
        image.naturalHeight*scale
      );

    const ctx=
      canvas.getContext("2d");

    ctx.drawImage(
      image,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const blob=
      await new Promise(resolve=>
        canvas.toBlob(
          resolve,
          "image/jpeg",
          .82
        )
      );

    if(!blob)return file;

    return new File(
      [blob],
      "photo.jpg",
      {
        type:"image/jpeg"
      }
    );

  }catch{

    return file;
  }
}

async function uploadToStorage(

){

  const token=getToken();

  try{

      "/storage/v1/object/Stenka/"+

          "Content-Type":

    };

  }catch{

  }
}

async function createPostInDatabase(
  text,
  file
){

  const userId=getUserId();

  if(!userId)return false;

  let uploadedPath=null;

  try{

    let imageUrl=null;

    if(file){

      const prepared=
        await prepareImageForUpload(file);

      const ext=
        getImageExtension(
          prepared.type,
          file.name
        );

      uploadedPath=
        "posts/"+
        userId+"/"+
        Date.now()+
        "-"+
        Math.random()
          .toString(36)
          .slice(2,8)+
        "."+
        ext;

      const upload=
        await uploadToStorage(
          uploadedPath,
          prepared
        );

      if(!upload.ok){

        alert(
          "Не удалось загрузить фото:\n"+
          upload.text
        );

        return false;
      }

      imageUrl=
        SUPABASE_URL+
        "/storage/v1/object/public/Stenka/"+
        uploadedPath;
    }

    const response=await fetch(
      SUPABASE_URL+"/rest/v1/posts",
      {
        method:"POST",
        headers:{
          ...authHeaders(),
          Prefer:"return=minimal"
        },
        body:JSON.stringify({
          user_id:userId,
          username:
            currentProfile?.username||
            "you",
          content:text||"",
          image_url:imageUrl
        })
      }
    );

    if(!response.ok){

      if(uploadedPath){
        await deleteStorageFile(
          uploadedPath
        );
      }

      alert(
        "Не удалось создать пост:\n"+
        await response.text()
      );

      return false;
    }

    return true;

  }catch(error){

    if(uploadedPath){
      await deleteStorageFile(
        uploadedPath
      );
    }

    console.error(error);

    alert("Ошибка публикации.");

    return false;
  }
}

   REACTIONS
========================================================= */

async function reactToPost(
  id,
  type,
  postOwnerId,
  likeButton,
  dislikeButton
){

  if(
    likeButton.disabled||
    dislikeButton.disabled
  ){

    return;
  }

  likeButton.disabled=true;
  dislikeButton.disabled=true;

  const old=
    localStorage.getItem(
      "reaction_"+id
    );

  try{

    const get=await fetch(
      SUPABASE_URL+
      "/rest/v1/posts?id=eq."+
      encodeURIComponent(id)+
      "&select=likes,dislikes",
      {
        headers:authHeaders()
      }
    );

    if(!get.ok){
      throw new Error();
    }

    const rows=await get.json();

    if(!rows.length){
      throw new Error();
    }

    const post=rows[0];

    let likes=
      Number(post.likes||0);

    let dislikes=
      Number(post.dislikes||0);

    if(old===type){

      if(type==="like"){
        likes=Math.max(0,likes-1);
      }else{
        dislikes=Math.max(0,dislikes-1);
      }

      localStorage.removeItem(
        "reaction_"+id
      );

    }else{

      if(old==="like"){
        likes=Math.max(0,likes-1);
      }

      if(old==="dislike"){
        dislikes=Math.max(0,dislikes-1);
      }

      if(type==="like"){
        likes++;
      }else{
        dislikes++;
      }

      localStorage.setItem(
        "reaction_"+id,
        type
      );
    }

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/posts?id=eq."+
      encodeURIComponent(id),
      {
        method:"PATCH",
        headers:{
          ...authHeaders(),
          Prefer:"return=minimal"
        },
        body:JSON.stringify({
          likes,
          dislikes
        })
      }
    );

    if(!response.ok){

      if(old){
        localStorage.setItem(
          "reaction_"+id,
          old
        );
      }else{
        localStorage.removeItem(
          "reaction_"+id
        );
      }

      throw new Error(
        await response.text()
      );
    }

    const me=getUserId();

    if(
      type==="like"&&
      old!=="like"&&
      postOwnerId&&
      postOwnerId!==me
    ){

      await createNotification(
        postOwnerId,
        me,
        "like",
        id,
        null,
        "понравился ваш пост"
      );
    }

    await loadPosts();

    await updateNotificationBadges();

  }catch(error){

    console.error(error);

    alert(
      "Не удалось изменить реакцию."
    );

  }finally{

    likeButton.disabled=false;
    dislikeButton.disabled=false;
  }
}

async function loadNotifications(){

  const me=getUserId();

  const container=
    document.getElementById(
      "notificationList"
    );

  if(!me)return;

  container.innerHTML=
    '<div class="search-empty">Загружаем уведомления...</div>';

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/notifications?user_id=eq."+
      encodeURIComponent(me)+
      "&select=*&order=created_at.desc&limit=100",
      {
        headers:authHeaders()
      }
    );

    if(!response.ok){
      throw new Error(
        await response.text()
      );
    }

    const notifications=
      await response.json();

    if(!notifications.length){

      container.innerHTML=
        '<div class="search-empty">Уведомлений пока нет.</div>';

      return;
    }

    const actorIds=[
      ...new Set(
        notifications
          .map(n=>n.actor_id)
          .filter(Boolean)
      )
    ];

    const actors=
      await getProfilesByIds(
        actorIds
      );

    const actorMap={};

    actors.forEach(profile=>{
      actorMap[profile.id]=profile;
    });

    container.innerHTML="";

    notifications.forEach(notification=>{

      const actor=
        actorMap[notification.actor_id];

      const item=
        document.createElement("div");

      item.className=
        "notification-item"+
        (!notification.is_read
          ?" unread"
          :"");

      item.onclick=async()=>{

        if(!notification.is_read){

          await markNotificationRead(
            notification.id
          );
        }

        if(actor){

          openFoundProfile(actor);

        }else{

          await loadNotifications();
        }
      };

      if(actor?.avatar_url){

        const img=
          document.createElement("img");

        img.className=
          "notification-avatar";

        img.src=actor.avatar_url;
        img.alt="";

        item.appendChild(img);

      }else{

        const avatar=
          document.createElement("div");

        avatar.className=
          "notification-avatar-placeholder";

        avatar.textContent=
          (
            actor?.display_name||
            actor?.username||
            "N"
          ).charAt(0).toUpperCase();

        item.appendChild(avatar);
      }

      const main=
        document.createElement("div");

      main.className=
        "notification-main";

      const text=
        document.createElement("div");

      text.className=
        "notification-text";

      const name=
        document.createElement("span");

      name.className=
        "notification-name";

      name.textContent=
        actor?.display_name||
        actor?.username||
        "Пользователь";

      text.appendChild(name);

      text.appendChild(
        document.createTextNode(
          " "+(
            notification.content||
            ""
          )
        )
      );

      const time=
        document.createElement("div");

      time.className=
        "notification-time";

      time.textContent=
        formatMessageTime(
          notification.created_at
        );

      main.appendChild(text);
      main.appendChild(time);

      item.appendChild(main);

      if(!notification.is_read){

        const dot=
          document.createElement("div");

        dot.className=
          "notification-dot";

        item.appendChild(dot);
      }

      container.appendChild(item);
    });

  }catch(error){

    console.error(error);

    container.innerHTML=
      '<div class="search-empty">Не удалось загрузить уведомления.</div>';
  }
}

async function loadConversations(){

  const me=getUserId();

  const container=
    document.getElementById(
      "conversations"
    );

  if(!me)return;

  try{

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/messages?or="+
      encodeURIComponent(
        "(sender_id.eq."+me+
        ",receiver_id.eq."+me+")"
      )+
      "&select=*&order=created_at.desc&limit=500",
      {
        headers:authHeaders()
      }
    );

    if(!response.ok)throw new Error();

    const messages=
      await response.json();

    const profiles=
      await loadProfilesMap();

    const map={};

    messages.forEach(message=>{

      const other=
        message.sender_id===me
          ?message.receiver_id
          :message.sender_id;

      if(!map[other]){
        map[other]=message;
      }
    });

    container.innerHTML="";

    if(!Object.keys(map).length){

      container.innerHTML=
        '<div class="search-empty">Пока нет сообщений.</div>';

      return;
    }

    const entries=
      Object.entries(map);

    for(const [id,message] of entries){

      const profile=profiles[id];

      if(!profile)continue;

      const unread=
        await getUnreadMessagesForUser(id);

      const item=
        document.createElement("div");

      item.className="conversation";

      item.onclick=()=>{
        openChatWithUser(profile);
      };

      if(profile.avatar_url){

        const img=
          document.createElement("img");

        img.className=
          "conversation-avatar";

        img.src=profile.avatar_url;
        img.alt="";

        item.appendChild(img);

      }else{

        const avatar=
          document.createElement("div");

        avatar.className=
          "conversation-placeholder";

        avatar.textContent=
          (
            profile.display_name||
            profile.username||
            "N"
          ).charAt(0).toUpperCase();

        item.appendChild(avatar);
      }

      const main=
        document.createElement("div");

      main.className=
        "conversation-main";

      const top=
        document.createElement("div");

      top.className=
        "conversation-top";

      const name=
        document.createElement("div");

      name.className=
        "conversation-name"+
        (unread?" unread":"");

      name.textContent=
        profile.display_name||
        profile.username;

      const time=
        document.createElement("div");

      time.className=
        "conversation-time";

      time.textContent=
        formatMessageTime(
          message.created_at
        );

      top.appendChild(name);
      top.appendChild(time);

      const preview=
        document.createElement("div");

      preview.className=
        "conversation-preview"+
        (unread?" unread":"");

      preview.textContent=
        unread>0
          ?"Новое сообщение"
          :(message.content||"");

      main.appendChild(top);
      main.appendChild(preview);

      item.appendChild(main);

      if(unread>0){

        const badge=
          document.createElement("div");

        badge.className=
          "unread-count";

        badge.textContent=
          unread>99
            ?"99+"
            :unread;

        item.appendChild(badge);
      }

      container.appendChild(item);
    }

    await updateNotificationBadges();

  }catch(error){

    console.error(error);

    container.innerHTML=
      '<div class="search-empty">Не удалось загрузить сообщения.</div>';
  }
}

async function performMessageSearch(){

  const q=
    document
      .getElementById(
        "messageSearchInput"
      )
      .value
      .trim();

  const results=
    document.getElementById(
      "messageSearchResults"
    );

  const conversations=
    document.getElementById(
      "conversations"
    );

  if(!q){

    results.style.display="none";
    conversations.style.display="block";

    await loadConversations();

    return;
  }

  results.style.display="block";
  conversations.style.display="none";

  results.innerHTML=
    '<div class="search-empty">Ищем...</div>';

  try{

    const safe=
      q.replace(/[,*()]/g,"");

    const pattern=
      "*"+safe+"*";

    const response=await fetch(
      SUPABASE_URL+
      "/rest/v1/profiles?or="+
      encodeURIComponent(
        "(username.ilike."+pattern+
        ",display_name.ilike."+pattern+")"
      )+
      "&select=id,username,display_name,avatar_url"+
      "&limit=20",
      {
        headers:authHeaders()
      }
    );

    if(!response.ok)throw new Error();

    const rows=await response.json();

    const me=getUserId();

    results.innerHTML="";

    rows
      .filter(profile=>profile.id!==me)
      .forEach(profile=>{

        const item=
          document.createElement("div");

        item.className=
          "message-user-result";

        item.onclick=()=>{
          openChatWithUser(profile);
        };

        appendFollowAvatar(
          item,
          profile
        );

        const info=
          document.createElement("div");

        const name=
          document.createElement("div");

        name.className=
          "search-user-name";

        name.textContent=
          profile.display_name||
          profile.username;

        const username=
          document.createElement("div");

        username.className=
          "search-user-username";

        username.textContent=
          "@"+profile.username;

async function loadDirectMessages(){

  if(!currentChatUser)return;

  const me=getUserId();
  const other=currentChatUser.id;

    document.getElementById(
      "chatMessages"
    );

  try{

    const filter=
      "(and(sender_id.eq."+me+
      ",receiver_id.eq."+other+
      "),and(sender_id.eq."+other+
      ",receiver_id.eq."+me+"))";

    const response=await fetch(

      "/rest/v1/messages?or="+
      encodeURIComponent(filter)+
      "&select=*&order=created_at.asc&limit=500",
      {

    );

      await response.json();

      container.innerHTML=
        '<div class="chat-empty">Здесь пока пусто.<br>Напиши первое сообщение.</div>';

    messages.forEach(message=>{

      container.scrollHeight;

    console.error(error);

async function sendMessage(){

  const input=
    document.getElementById(
      "chatInput"
    );

  const content=
    input.value.trim();

  if(!content)return;

  const me=getUserId();

  input.disabled=true;

  try{

    let url;
    let body;

    if(currentGroupChat){

      url=
        SUPABASE_URL+
        "/rest/v1/group_messages";

      body={
        chat_id:currentGroupChat.id,
        sender_id:me,
        content
      };

    }else{

      if(!currentChatUser)return;

      url=
        SUPABASE_URL+
        "/rest/v1/messages";

      body={
        sender_id:me,
        receiver_id:currentChatUser.id,
        content,
        is_read:false
      };
    }

    const response=await fetch(
      url,
      {
        method:"POST",
        headers:{
          ...authHeaders(),
          Prefer:"return=representation"
        },
        body:JSON.stringify(body)
      }
    );

    if(!response.ok){

      alert(
        "Не удалось отправить сообщение:\n"+
        await response.text()
      );

      return;
    }

    const created=
      await response.json();

    if(
      !currentGroupChat&&
      currentChatUser
    ){

      const sent=
        Array.isArray(created)
          ?created[0]
          :created;

      await createNotification(
        currentChatUser.id,
        me,
        "message",
        null,
        sent?.id||null,
        "отправил вам сообщение"
      );
    }

    input.value="";

    if(currentGroupChat){

      await loadGroupMessages();

    }else{

      await loadDirectMessages();
    }

    await updateNotificationBadges();

  }catch(error){

    console.error(error);

    alert("Ошибка отправки.");

  }finally{

    input.disabled=false;

    input.focus();
  }
}

function handleChatKey(event){

  if(
    event.key==="Enter"&&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();
  }
}

function startChatPolling(){

  stopChatPolling();

  chatPolling=
    setInterval(async()=>{

      if(currentGroupChat){

        await loadGroupMessages();

      }else if(currentChatUser){

        await loadDirectMessages();

        await markDirectMessagesRead(
          currentChatUser.id
        );
      }

    },5000);
}

function stopChatPolling(){

  if(chatPolling){

    clearInterval(chatPolling);

    chatPolling=null;
  }
}

function closeChat(){

  stopChatPolling();

  currentChatUser=null;
  currentGroupChat=null;

  showPage("messages");
}

/* =========================================================
   TIME
========================================================= */

function formatMessageTime(value){

  const date=new Date(value);
  const now=new Date();

  if(
    date.toDateString()===
    now.toDateString()
  ){

    return date.toLocaleTimeString(
      "ru-RU",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );
  }

  return date.toLocaleDateString(
    "ru-RU",
    {
      day:"2-digit",
      month:"2-digit"
    }
  );
}

function formatChatTime(value){

  return new Date(value)
    .toLocaleTimeString(
      "ru-RU",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );
}

    document
      .getElementById("profileNav")
      .classList.add("active");

    loadProfile();
    loadWall();

    return;
  }

  if(page==="publicProfile"){

    document
      .getElementById("publicProfilePage")
      .classList.add("active");

    document
      .getElementById("searchNav")
      .classList.add("active");

    return;
  }

  if(page==="followList"){

    document
      .getElementById("followListPage")
      .classList.add("active");

    return;
  }
}

========================================================= */

function isAllowedImageUrl(url){

  return(
    typeof url==="string"&&
    url.startsWith(
      SUPABASE_URL+
      "/storage/v1/object/public/Stenka/"
    )
  );
}


/* =========================================================
   MODALS / EVENTS
========================================================= */

document
  .getElementById("profileModal")
  .addEventListener(
    "click",
    event=>{

      if(
        event.target.id===
        "profileModal"
      ){

        closeProfileEditor();
      }
    }
  );

document
  .getElementById("groupModal")
  .addEventListener(
    "click",
    event=>{

      if(
        event.target.id===
        "groupModal"
      ){

        closeGroupModal();
      }
    }
  );

document.addEventListener(
  "click",
  event=>{

    if(
      !event.target.closest(
        ".post-menu"
      )
    ){

      document
        .querySelectorAll(
          ".post-menu.open"
        )
        .forEach(
          menu=>
            menu.classList.remove(
              "open"
            )
        );
    }
  }
);

document.addEventListener(
  "keydown",
  event=>{

    if(
      event.key!=="Enter"||
      event.shiftKey
    ){

      return;
    }

    if(
      event.target.tagName===
      "TEXTAREA"
    ){

      return;
    }

    if(
      document
        .getElementById("loginForm")
        .style.display===
      "block"
    ){

      event.preventDefault();

      signIn();

      return;
    }

    if(
      document
        .getElementById("signupForm")
        .style.display===
      "block"
    ){

      event.preventDefault();

      signUp();
    }
  }
);


/* =========================================================
   START APP
========================================================= */

async function showApp(){

  const video=
    document.querySelector(
      ".auth-video"
    );

  if(video){

    video.pause();
    video.currentTime=0;
  }

  document.getElementById(
    "authScreen"
  ).style.display="none";

  document.getElementById(
    "app"
  ).style.display="block";

  const profile=
    await loadProfile();

  if(!profile){

    clearSession();

    showAuth();

    document.getElementById(
      "authMessage"
    ).textContent=
      "Не удалось загрузить профиль.";

    return;
  }

  showPage("feed");

  await updateNotificationBadges();

  if(badgeTimer){
    clearInterval(badgeTimer);
  }

  badgeTimer=
    setInterval(
      updateNotificationBadges,
      15000
    );
}

function showAuth(){

  stopChatPolling();

  document.getElementById(
    "authScreen"
  ).style.display="flex";

  document.getElementById(
    "app"
  ).style.display="none";

  showAuthChoice();
}


/* =========================================================
   INITIALIZATION
========================================================= */

(async function(){

  const hasSession=
    !!getToken()&&
    !!getUserId();

  if(!hasSession){

    showAuth();

    return;
  }

  const valid=
    await validateSession();

  if(valid){

    await showApp();

  }else{

    showAuth();
  }

})();

    if(video){

      video.play().catch(()=>{});
    }

  {
    once:true
  }
