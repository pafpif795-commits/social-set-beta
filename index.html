<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Cap</title>

<style>
*{box-sizing:border-box}

:root{
  --navy:#0b1f3a;
  --sky:#e9f6ff;
  --bg:#f4f9fd;
  --line:#d8e6f0;
  --text:#102033;
  --muted:#718397;
  --red:#ef4056;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button{
  border:0;
  cursor:pointer;
  font:inherit;
}

button:disabled{
  opacity:.6;
  cursor:default;
}

input,textarea{
  font-family:inherit;
}

/* AUTH */

#authScreen{
  position:relative;
  overflow:hidden;
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:#000;
}

.auth-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
  pointer-events:none;
}

.auth-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.18);
  z-index:1;
}

.auth-card{
  position:relative;
  z-index:10;
  width:100%;
  max-width:420px;
  padding:34px;
  background:rgba(255,255,255,.94);
  border-radius:24px;
  box-shadow:0 22px 65px rgba(0,0,0,.35);
  backdrop-filter:blur(12px);
}

.brand{
  font-size:44px;
  font-weight:900;
  letter-spacing:-2.5px;
  color:var(--navy);
  text-align:center;
}

.tagline{
  text-align:center;
  color:var(--muted);
  margin:8px 0 28px;
}

.auth-choice button,
.auth-form button{
  width:100%;
  padding:13px 16px;
  border-radius:12px;
  margin-top:10px;
  font-weight:700;
}

.primary{
  background:var(--navy);
  color:white;
}

.secondary{
  background:var(--sky);
  color:var(--navy);
}

.auth-form{
  display:none;
}

.auth-form h2{
  margin-top:0;
  color:var(--navy);
}

.auth-form input{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:1px solid var(--line);
  border-radius:11px;
  outline:none;
  font-size:15px;
}

.auth-form input:focus{
  border-color:#7db9df;
  box-shadow:0 0 0 3px rgba(98,183,245,.12);
}

.back-btn{
  background:transparent;
  color:var(--muted);
  margin-top:12px;
  padding:8px 0;
}

#authMessage{
  min-height:20px;
  margin-top:12px;
  color:var(--muted);
  font-size:14px;
}

/* APP */

#app{
  display:none;
  min-height:100vh;
}

header{
  height:64px;
  background:white;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  position:sticky;
  top:0;
  z-index:20;
}

.header-logo{
  font-size:23px;
  font-weight:900;
  color:var(--navy);
}

.logout{
  background:var(--navy);
  color:white;
  border-radius:10px;
  padding:9px 13px;
  font-size:13px;
  font-weight:700;
}

.container{
  max-width:650px;
  margin:25px auto 90px;
  padding:0 15px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* POSTS */

.create-post,
.post,
.profile-card,
.profile-wall,
.public-profile-card,
.search-box,
.search-user,
.conversations{
  background:white;
  border:1px solid var(--line);
}

.create-post{
  padding:17px;
  margin-bottom:20px;
  border-radius:17px;
}

textarea{
  width:100%;
  min-height:90px;
  resize:vertical;
  background:#fafdff;
  color:var(--text);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  font-size:16px;
  outline:none;
}

textarea:focus{
  border-color:#7db9df;
}

.publish{
  margin-top:10px;
  background:var(--navy);
  color:white;
  border-radius:10px;
  padding:11px 18px;
  font-weight:700;
}

.post{
  margin-bottom:15px;
  padding:16px;
  border-radius:17px;
}

.post-user{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.mini-avatar,
.search-avatar,
.conversation-avatar,
.message-result-avatar,
.chat-avatar{
  object-fit:cover;
}

.mini-avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--sky);
  border:1px solid var(--line);
}

.mini-avatar-placeholder{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--navy);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.user-name{
  color:var(--navy);
  font-weight:800;
}

.post-date{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.post-text{
  font-size:16px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.actions{
  margin-top:15px;
  display:flex;
  gap:8px;
}

.reaction-btn{
  background:white;
  border:1px solid var(--line);
  color:var(--muted);
  border-radius:10px;
  padding:8px 12px;
  font-weight:700;
}

.reaction-btn.active{
  color:var(--red);
  border-color:#f1a0aa;
  background:#fff5f6;
}

/* PROFILE */

.profile-card{
  overflow:hidden;
  margin-bottom:20px;
  border-radius:17px;
}

.cover,
.public-cover{
  height:145px;
  background:linear-gradient(135deg,#0b1f3a,#23608f,#62b7f5);
}

.profile-info,
.public-info{
  padding:0 20px 20px;
  position:relative;
}

.big-avatar,
.public-avatar{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  background:var(--sky);
  border:5px solid white;
  margin-top:-55px;
  display:block;
}

.avatar-placeholder,
.public-avatar-placeholder{
  width:110px;
  height:110px;
  border-radius:50%;
  background:var(--navy);
  color:white;
  border:5px solid white;
  margin-top:-55px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:900;
}

.profile-name,
.public-name{
  font-size:25px;
  font-weight:900;
  color:var(--navy);
  margin-top:12px;
  overflow-wrap:anywhere;
}

.profile-username,
.public-username{
  color:var(--muted);
  margin-top:3px;
}

.profile-bio,
.public-bio{
  margin-top:13px;
  line-height:1.5;
  white-space:pre-wrap;
}

.profile-buttons,
.public-actions{
  display:flex;
  gap:8px;
  margin-top:15px;
  flex-wrap:wrap;
}

.profile-button,
.public-action{
  background:var(--sky);
  color:var(--navy);
  border-radius:10px;
  padding:10px 14px;
  font-weight:700;
}

.profile-button.dark{
  background:var(--navy);
  color:white;
}

.public-action{
  flex:1;
}

.public-action.following{
  background:var(--navy);
  color:white;
}

.profile-stats,
.public-stats{
  display:flex;
  gap:24px;
  margin-top:18px;
}

.stat-number{
  font-weight:900;
  font-size:19px;
  color:var(--navy);
}

.stat-label{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
}

.profile-wall{
  padding:17px;
  border-radius:17px;
}

.public-wall{
  margin-top:20px;
}

.wall-title{
  color:var(--navy);
  font-size:21px;
  font-weight:900;
  margin-bottom:15px;
}

.wall-empty{
  color:var(--muted);
  text-align:center;
  padding:25px 10px;
}

/* SEARCH */

.search-box{
  border-radius:17px;
  padding:15px;
  margin-bottom:15px;
}

.search-input{
  width:100%;
  padding:13px 15px;
  border:1px solid var(--line);
  border-radius:12px;
  outline:none;
  background:#fafdff;
  color:var(--text);
  font-size:16px;
}

.search-results{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.search-user{
  border-radius:15px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
}

.search-user:active{
  background:#f4f9fd;
}

.search-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  background:var(--sky);
  border:1px solid var(--line);
}

.search-avatar-placeholder{
  width:48px;
  height:48px;
  border-radius:50%;
  background:var(--navy);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:18px;
  flex-shrink:0;
}

.search-user-name{
  font-weight:800;
  color:var(--navy);
  overflow-wrap:anywhere;
}

.search-user-username{
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}

.search-empty{
  text-align:center;
  color:var(--muted);
  padding:30px 10px;
}

/* PUBLIC PROFILE */

.public-back{
  background:transparent;
  color:var(--muted);
  font-weight:700;
  padding:5px 0 12px;
}

.public-profile-card{
  border-radius:17px;
  overflow:hidden;
}

/* MESSAGES */

.messages-header{
  margin-bottom:15px;
}

.messages-title{
  font-size:32px;
  font-weight:900;
  letter-spacing:-1px;
  color:#111;
  margin-bottom:18px;
}

.messages-search{
  position:relative;
}

.messages-search-input{
  width:100%;
  height:56px;
  padding:0 20px 0 52px;
  border:0;
  border-radius:30px;
  background:#e9e9ed;
  outline:none;
  font-size:17px;
  color:#111;
}

.messages-search-icon{
  position:absolute;
  left:19px;
  top:50%;
  transform:translateY(-50%);
  font-size:23px;
  color:#555;
  pointer-events:none;
}

.conversations{
  border-radius:18px;
  overflow:hidden;
}

.conversation{
  min-height:88px;
  padding:12px 10px 12px 5px;
  display:flex;
  align-items:center;
  border-bottom:1px solid #e5e5e5;
  cursor:pointer;
}

.conversation:last-child{
  border-bottom:0;
}

.conversation:active{
  background:#f4f4f5;
}

.conversation-avatar-wrap{
  width:72px;
  display:flex;
  justify-content:center;
  position:relative;
  flex-shrink:0;
}

.conversation-avatar{
  width:58px;
  height:58px;
  border-radius:50%;
  background:var(--sky);
}

.conversation-avatar-placeholder{
  width:58px;
  height:58px;
  border-radius:50%;
  background:var(--navy);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  font-weight:900;
}

.online-dot{
  position:absolute;
  right:3px;
  bottom:1px;
  width:16px;
  height:16px;
  border-radius:50%;
  background:#68737d;
  border:3px solid white;
}

.conversation-main{
  min-width:0;
  flex:1;
  padding-right:8px;
}

.conversation-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.conversation-name{
  font-size:18px;
  font-weight:800;
  color:#111;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.conversation-time{
  color:#666;
  font-size:13px;
  white-space:nowrap;
}

.conversation-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-top:4px;
}

.conversation-preview{
  color:#707070;
  font-size:15px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* MESSAGE SEARCH */

.message-user-result{
  background:white;
  border-bottom:1px solid #e5e5e5;
  padding:13px 10px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
}

.message-user-result:first-child{
  border-radius:16px 16px 0 0;
}

.message-user-result:last-child{
  border-radius:0 0 16px 16px;
}

.message-result-avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  background:var(--sky);
  flex-shrink:0;
}

.message-result-placeholder{
  width:50px;
  height:50px;
  border-radius:50%;
  background:var(--navy);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  flex-shrink:0;
}

/* CHAT */

.chat-page{
  height:calc(100vh - 154px);
  height:calc(100dvh - 154px);
  display:none;
  flex-direction:column;
}

.chat-page.active{
  display:flex;
}

.chat-header{
  background:white;
  border:1px solid var(--line);
  border-radius:17px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
}

.chat-back{
  background:transparent;
  color:var(--navy);
  font-size:25px;
  padding:4px 7px;
}

.chat-avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  background:var(--sky);
}

.chat-avatar-placeholder{
  width:43px;
  height:43px;
  border-radius:50%;
  background:var(--navy);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  flex-shrink:0;
}

.chat-user-info{
  min-width:0;
}

.chat-user-name{
  font-weight:900;
  color:var(--navy);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chat-user-username{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
}

.chat-messages{
  flex:1;
  overflow-y:auto;
  padding:18px 5px;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.chat-empty{
  margin:auto;
  color:var(--muted);
  text-align:center;
}

.message-row{
  display:flex;
  width:100%;
}

.message-row.mine{
  justify-content:flex-end;
}

.message-row.theirs{
  justify-content:flex-start;
}

.message-bubble{
  max-width:78%;
  padding:10px 13px;
  border-radius:18px;
  font-size:16px;
  line-height:1.35;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message-row.mine .message-bubble{
  background:var(--navy);
  color:white;
  border-bottom-right-radius:5px;
}

.message-row.theirs .message-bubble{
  background:white;
  color:var(--text);
  border:1px solid var(--line);
  border-bottom-left-radius:5px;
}

.message-time{
  margin-top:4px;
  font-size:10px;
  opacity:.65;
  text-align:right;
}

.chat-input-area{
  background:white;
  border:1px solid var(--line);
  border-radius:17px;
  padding:9px;
  display:flex;
  gap:8px;
  align-items:flex-end;
  flex-shrink:0;
}

.chat-input{
  flex:1;
  min-height:44px;
  max-height:110px;
  resize:none;
  border:0;
  background:#f1f3f5;
  border-radius:22px;
  padding:11px 15px;
  outline:none;
  font-size:16px;
}

.chat-send{
  width:44px;
  height:44px;
  border-radius:50%;
  background:var(--navy);
  color:white;
  font-size:18px;
  flex-shrink:0;
}

/* NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:rgba(255,255,255,.96);
  border-top:1px solid var(--line);
  display:flex;
  justify-content:center;
  z-index:30;
  backdrop-filter:blur(12px);
}

.nav-inner{
  width:100%;
  max-width:650px;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-button{
  background:transparent;
  color:var(--muted);
  min-width:70px;
  padding:8px 4px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  font-size:11px;
  font-weight:700;
  position:relative;
}

.nav-icon{
  font-size:22px;
}

.nav-button.active{
  color:var(--navy);
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(11,31,58,.45);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.active{
  display:flex;
}

.modal-card{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:20px;
  padding:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.modal-card h2{
  margin-top:0;
  color:var(--navy);
}

.modal-card input,
.modal-card textarea{
  margin-top:10px;
}

.modal-card input{
  width:100%;
  padding:13px;
  border:1px solid var(--line);
  border-radius:11px;
  outline:none;
  font-size:15px;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.modal-actions button{
  flex:1;
  padding:11px;
  border-radius:10px;
  font-weight:700;
}

.cancel{
  background:var(--sky);
  color:var(--navy);
}

/* MOBILE */

@media(max-width:700px){

  .container{
    margin-top:15px;
  }

  .cover,
  .public-cover{
    height:125px;
  }

  .profile-info,
  .public-info{
    padding-left:16px;
    padding-right:16px;
  }

  .auth-card{
    padding:26px;
  }

  .brand{
    font-size:38px;
  }

  .nav-button{
    min-width:65px;
  }

  .messages-title{
    font-size:30px;
  }

  .conversation-name{
    font-size:17px;
  }
}
</style>
</head>

<body>

<!-- AUTH -->

<section id="authScreen">

  <video
    class="auth-video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
  >
    <source
      src="https://jrzoexmvgyyitojbcxvr.supabase.co/storage/v1/object/public/Stenka/auth-bg.mp4/3992627239181363251.mp4"
      type="video/mp4"
    >
  </video>

  <div class="auth-overlay"></div>

  <div class="auth-card">

    <div class="brand">No Cap</div>

    <div class="tagline">
      Своя соцсеть. Без лишнего.
    </div>

    <div id="authChoice">

      <button class="primary" onclick="showAuthForm('login')">
        Войти
      </button>

      <button class="secondary" onclick="showAuthForm('signup')">
        Создать аккаунт
      </button>

    </div>

    <div id="loginForm" class="auth-form">

      <h2>Войти</h2>

      <input
        id="loginEmail"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="loginPassword"
        type="password"
        placeholder="Пароль"
        autocomplete="current-password"
      >

      <button
        class="primary"
        id="loginButton"
        onclick="signIn()"
      >
        Войти
      </button>

      <button class="back-btn" onclick="showAuthChoice()">
        ← Назад
      </button>

    </div>

    <div id="signupForm" class="auth-form">

      <h2>Создать аккаунт</h2>

      <input
        id="signupUsername"
        type="text"
        placeholder="Username"
        autocomplete="username"
        maxlength="30"
      >

      <input
        id="signupEmail"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="signupPassword"
        type="password"
        placeholder="Пароль"
        autocomplete="new-password"
      >

      <button
        class="primary"
        id="signupButton"
        onclick="signUp()"
      >
        Создать аккаунт
      </button>

      <button class="back-btn" onclick="showAuthChoice()">
        ← Назад
      </button>

    </div>

    <div id="authMessage"></div>

  </div>

</section>


<!-- APP -->

<div id="app">

<header>

  <div class="header-logo">
    No Cap
  </div>

  <button class="logout" onclick="signOut()">
    Выйти
  </button>

</header>


<main class="container">

<!-- FEED -->

<section id="feedPage" class="page">

  <div class="create-post">

    <textarea
      id="postInput"

const SUPABASE_URL =

*/
const SUPABASE_KEY =
  "sb_publishable_NGzwO7npRZMNPeTSXHNLbQ_TO5apgSJ";



const baseHeaders = {
  "apikey":SUPABASE_KEY,
  "Content-Type":"application/json"
};


function authHeaders(){

  const token =
    localStorage.getItem("access_token");

  return {
    ...baseHeaders,
    "Authorization":
      "Bearer " + (token || SUPABASE_KEY)
  };

}

  document.getElementById("loginForm").style.display =

/* ================= SIGN UP ================= */

async function signUp(){

  const username =
    document.getElementById("signupUsername").value.trim();

  const email =
    document.getElementById("signupEmail").value.trim();

  const password =
    document.getElementById("signupPassword").value;

  const message =
    document.getElementById("authMessage");

  const button =
    document.getElementById("signupButton");


  if(!username || !email || !password){

    message.textContent="Заполни все поля.";
    return;

  }


  if(!/^[a-zA-Z0-9_.-]+$/.test(username)){

    message.textContent =
      "Username: только латиница, цифры, _ . -";

    return;

  }


  if(username.length<3){

    message.textContent =
      "Username должен быть минимум 3 символа.";

    return;

  }


  if(password.length<6){

    message.textContent =
      "Пароль должен быть минимум 6 символов.";

    return;

  }


  button.disabled=true;
  message.textContent="Создаём аккаунт...";


  try{

    const response =
      await fetch(
        SUPABASE_URL+"/auth/v1/signup",
        {
          method:"POST",
          headers:baseHeaders,
          body:JSON.stringify({
            email,
            password
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      message.textContent =
        data.msg ||
        data.message ||
        data.error_description ||
        "Не удалось создать аккаунт.";

      return;

    }


    if(!data.user){

      message.textContent =
        "Не удалось получить данные аккаунта.";

      return;

    }


    if(!data.access_token){

      message.textContent =
        "Аккаунт создан. Теперь войди.";

      showAuthForm("login");

      document.getElementById("loginEmail").value=email;

      return;

    }


    localStorage.setItem(
      "access_token",
      data.access_token
    );

    localStorage.setItem(
      "user_id",
      data.user.id
    );


    const profileCreated =
      await createProfile(
        data.user.id,
        username
      );


    if(!profileCreated){

      localStorage.removeItem("access_token");
      localStorage.removeItem("user_id");

      message.textContent =
        "Аккаунт создан, но профиль не создался. Проверь username.";

      return;

    }


    await showApp();

  }catch(error){

    console.error("signUp:",error);

    message.textContent =
      "Ошибка соединения с сервером.";

  }finally{

    button.disabled=false;

  }

}


/* ================= SIGN IN ================= */

async function signIn(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("authMessage");

  const button =
    document.getElementById("loginButton");


  if(!email || !password){

  button.disabled=true;
  message.textContent="Входим...";


  try{

    const response =
      await fetch(
        SUPABASE_URL+
        "/auth/v1/token?grant_type=password",
        {
          method:"POST",
          headers:baseHeaders,
          body:JSON.stringify({
            email,
            password
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      message.textContent =
        data.msg ||
        data.message ||
        data.error_description ||
        "Неверный email или пароль.";

      return;

    }


    if(!data.access_token || !data.user){

      message.textContent =
        "Сервер не вернул данные входа.";

      return;

    }


    localStorage.setItem(
      "access_token",
      data.access_token
    );

    localStorage.setItem(
      "user_id",
      data.user.id
    );


    await showApp();

  }catch(error){

    console.error("signIn:",error);

    message.textContent =
      "Ошибка соединения с сервером.";

  }finally{

    button.disabled=false;

  }

}


/* ================= SESSION ================= */

async function validateSession(){

  const token =
    localStorage.getItem("access_token");

  const userId =
    localStorage.getItem("user_id");


  if(!token || !userId)return false;


  try{

    const response =
      await fetch(
        SUPABASE_URL+"/auth/v1/user",
        {
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":"Bearer "+token
          }
        }
      );


    if(!response.ok){

      clearSession();
      return false;

    }


    const user =
      await response.json();


    if(!user || user.id!==userId){

      clearSession();
      return false;

    }


    return true;

  }catch(error){

    console.error("validateSession:",error);

    return false;

  }

}


function clearSession(){

  localStorage.removeItem("access_token");
  localStorage.removeItem("user_id");

}


function signOut(){

  stopChatPolling();

  currentChatUser=null;
  publicProfile=null;

  clearSession();

  window.currentProfile=null;

  showAuth();

}

async function loadProfile(){

  try{

/* ================= AVATAR ================= */

function renderProfileAvatar(profile){

    document.getElementById("profileAvatarContainer");

  if(!container)return;

  container.replaceChildren();


  if(profile.avatar_url){

    const img=document.createElement("img");

    img.className="big-avatar";
    img.src=profile.avatar_url;
    img.alt="Аватар";

    img.onerror=()=>{

      renderProfileAvatar({
        ...profile,
        avatar_url:""
      });

    };

    container.appendChild(img);
    return;

  }


  const letter =
    (
      profile.display_name ||
      profile.username ||
      "N"
    ).charAt(0).toUpperCase();


  const div=document.createElement("div");

  div.className="avatar-placeholder";
  div.textContent=letter;

  container.appendChild(div);

function chooseAvatar(){

}


async function uploadAvatar(){

  const input =
    document.getElementById("avatarInput");

  const file =
    input.files[0];

  if(!file)return;


  if(!file.type.startsWith("image/")){

    alert("Можно загружать только изображения.");
    input.value="";
    return;

  }


  if(file.size>5*1024*1024){

    alert("Максимальный размер аватарки: 5 МБ.");
    input.value="";
    return;

  }


  const userId =
    localStorage.getItem("user_id");

  const token =
    localStorage.getItem("access_token");


  if(!userId || !token){

    alert("Сначала войди в аккаунт.");
    return;

  }


  const extension =
    (file.name.split(".").pop() || "jpg").toLowerCase();


  const filePath =
    userId+"/"+Date.now()+"."+extension;


  try{

    const uploadResponse =
      await fetch(
        SUPABASE_URL+
        "/storage/v1/object/Stenka/"+
        filePath,
        {
          method:"POST",
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":"Bearer "+token,
            "Content-Type":file.type,
            "x-upsert":"true"
          },
          body:file
        }
      );


    if(!uploadResponse.ok){

      alert(
        "Не удалось загрузить аватарку:\n"+
        await uploadResponse.text()
      );

      return;

    }


    const avatarUrl =
      SUPABASE_URL+
      "/storage/v1/object/public/Stenka/"+
      filePath;


    const updateResponse =
      await fetch(
        SUPABASE_URL+
        "/rest/v1/profiles?id=eq."+
        encodeURIComponent(userId),
        {
          method:"PATCH",
          headers:{
            ...authHeaders(),
            "Prefer":"return=representation"
          },
          body:JSON.stringify({
            avatar_url:avatarUrl
          })
        }
      );


    if(!updateResponse.ok){

      alert(
        "Фото загрузилось, но профиль не обновился."
      );

      return;

    }


    input.value="";

    await loadProfile();

  }catch(error){

    console.error("uploadAvatar:",error);

    alert("Ошибка загрузки аватарки.");

  }

}

/* ================= SEARCH ================= */

function searchUsers(){

  clearTimeout(searchTimeout);

  searchTimeout=setTimeout(
    performUserSearch,
    250
  );

}


async function performUserSearch(){

  const input=document.getElementById("userSearchInput");
  const results=document.getElementById("searchResults");

  if(!input || !results)return;


  const query=input.value.trim();


  if(!query){

    results.innerHTML=
      `<div class="search-empty">
        Начни вводить username или имя
      </div>`;

    return;

  }


  const safeQuery =
    query.replace(/[,*()]/g,"").trim();


  if(!safeQuery){

    results.innerHTML=
      `<div class="search-empty">
        Введи username или имя
      </div>`;

    return;

  }


  results.innerHTML=
    `<div class="search-empty">Ищем...</div>`;


  try{

    const pattern="*"+safeQuery+"*";


    const url =
      SUPABASE_URL+
      "/rest/v1/profiles"+
      "?or="+
      encodeURIComponent(
        "(username.ilike."+pattern+
        ",display_name.ilike."+pattern+")"
      )+
      "&select=id,username,display_name,avatar_url"+
      "&limit=30";


    const response =
      await fetch(
        url,
        {
          headers:authHeaders()
        }
      );


    if(!response.ok){

      console.error(await response.text());

      results.innerHTML=
        `<div class="search-empty">
          Не удалось выполнить поиск.
        </div>`;

      return;

    }


    const profiles=await response.json();

    results.innerHTML="";


    if(!profiles.length){

      results.innerHTML=
        `<div class="search-empty">
          Пользователей не найдено.
        </div>`;

      return;

    }


    profiles.forEach(profile=>{

      const user=document.createElement("div");

      user.className="search-user";

      user.onclick=()=>{
        openFoundProfile(profile);
      };


      if(profile.avatar_url){

        const img=document.createElement("img");

        img.className="search-avatar";
        img.src=profile.avatar_url;
        img.alt="";

        user.appendChild(img);

      }else{

        const placeholder=document.createElement("div");

        placeholder.className="search-avatar-placeholder";

        placeholder.textContent=
          (
            profile.display_name ||
            profile.username ||
            "N"
          ).charAt(0).toUpperCase();

        user.appendChild(placeholder);

      }


      const info=document.createElement("div");

      const name=document.createElement("div");

      name.className="search-user-name";
      name.textContent=
        profile.display_name ||
        profile.username;


      const username=document.createElement("div");

      username.className="search-user-username";
      username.textContent="@"+profile.username;


      info.appendChild(name);
      info.appendChild(username);

      user.appendChild(info);
      results.appendChild(user);

    });

  }catch(error){

    console.error("Search:",error);

    results.innerHTML=
      `<div class="search-empty">
        Ошибка поиска.
      </div>`;

  }

}

    if(!profiles.length){

      alert("Профиль не найден.");
      backToSearch();
      return;

    }


    publicProfile=profiles[0];

    renderPublicProfile(publicProfile);

    await loadPublicFollowStats(publicProfile.id);

    await renderFollowButton(publicProfile.id);

    await loadPublicWall(publicProfile.id);

  }catch(error){

    console.error("openFoundProfile:",error);

    alert("Не удалось открыть профиль.");
    backToSearch();

  }

}

      if(followersNode){

async function isFollowing(targetUserId){

  const currentUserId =
    localStorage.getItem("user_id");


  if(
    !currentUserId ||
    currentUserId===targetUserId
  ){

    return false;

  }


  try{

    const response =
      await fetch(
        SUPABASE_URL+
        "/rest/v1/follows"+
        "?follower_id=eq."+
        encodeURIComponent(currentUserId)+
        "&following_id=eq."+
        encodeURIComponent(targetUserId)+
        "&select=follower_id",
        {
          headers:authHeaders()
        }
      );


    if(!response.ok){

      console.error("isFollowing:",await response.text());
      return false;

    }


    const rows=await response.json();

    return rows.length>0;

  }catch(error){

    console.error("isFollowing:",error);
    return false;

  }

}


async function renderFollowButton(targetUserId){

  const container =
    document.getElementById("publicActions");

  const currentUserId =
    localStorage.getItem("user_id");


  container.innerHTML="";


  if(!currentUserId)return;


  if(currentUserId===targetUserId){

    button.className="public-action";
    button.textContent="Это ваш профиль";
    button.disabled=true;

    container.appendChild(button);

    return;

  }


  const following =
    await isFollowing(targetUserId);

    "public-action"+

  messageButton.className="public-action";

  messageButton.onclick=()=>{

async function toggleFollow(targetUserId){

  const currentUserId =
    localStorage.getItem("user_id");


  if(
    !currentUserId ||
    currentUserId===targetUserId
  ){

    return;

  }


  try{

    const following =
      await isFollowing(targetUserId);


    if(following){

      const response =
        await fetch(
          SUPABASE_URL+
          "/rest/v1/follows"+
          "?follower_id=eq."+
          encodeURIComponent(currentUserId)+
          "&following_id=eq."+
          encodeURIComponent(targetUserId),
          {
            method:"DELETE",
            headers:{
              ...authHeaders(),
              "Prefer":"return=minimal"
            }
          }
        );


      if(!response.ok){

        alert(
          "Не удалось отписаться:\n"+
          await response.text()
        );

        return;

      }

    }else{

      const response =
        await fetch(
          SUPABASE_URL+"/rest/v1/follows",
          {
            method:"POST",
            headers:{
              ...authHeaders(),
              "Prefer":"return=minimal"
            },
            body:JSON.stringify({
              follower_id:currentUserId,
              following_id:targetUserId
            })
          }
        );


      if(!response.ok){

        const text=await response.text();

        if(
          !text.includes("duplicate") &&
          !text.includes("23505")
        ){

          alert(
            "Не удалось подписаться:\n"+text
          );

          return;

        }

      }

    }


    await loadPublicFollowStats(targetUserId);
    await renderFollowButton(targetUserId);


    if(window.currentProfile){

      await loadFollowStats(
        currentUserId,
        "myFollowersCount",
        "myFollowingCount"
      );

    }

  }catch(error){

    console.error("toggleFollow:",error);

    alert("Ошибка соединения с сервером.");

  }

}

/* ================= MESSAGES ================= */

async function loadConversations(){

  const currentUserId =
    localStorage.getItem("user_id");

  const container =
    document.getElementById("conversations");


  if(!currentUserId || !container)return;


  container.innerHTML=
    `<div class="search-empty">
      Загружаем сообщения...
    </div>`;


  try{

    const response =
      await fetch(
        SUPABASE_URL+
        "/rest/v1/messages"+
        "?or="+
        encodeURIComponent(
          "(sender_id.eq."+currentUserId+
          ",receiver_id.eq."+currentUserId+")"
        )+
        "&select=*"+
        "&order=created_at.desc",
        {
          headers:authHeaders()
        }
      );


    if(!response.ok){

      const errorText=await response.text();

      console.error("Messages:",errorText);

      container.innerHTML=
        `<div class="search-empty">
          Не удалось загрузить сообщения.<br><br>
          ${escapeHtml(errorText)}
        </div>`;

      return;

    }


    const messages=await response.json();


    if(!messages.length){

      container.innerHTML=
        `<div class="search-empty">
          Пока нет сообщений.<br>
          Найди пользователя и начни чат.
        </div>`;

      return;

    }


    const profiles=await loadProfilesMap();
    const conversations={};


    messages.forEach(message=>{

      const otherId =
        message.sender_id===currentUserId
          ? message.receiver_id
          : message.sender_id;


      if(!conversations[otherId]){
        conversations[otherId]=message;
      }

    });


    container.innerHTML="";


    Object.entries(conversations).forEach(
      ([userId,message])=>{

        const profile=profiles[userId];

        if(!profile)return;


        const element=document.createElement("div");

        element.className="conversation";

        element.onclick=()=>{
          openChatWithUser(profile);
        };


        const avatarWrap=document.createElement("div");

        avatarWrap.className="conversation-avatar-wrap";


        if(profile.avatar_url){

          const img=document.createElement("img");

          img.className="conversation-avatar";
          img.src=profile.avatar_url;
          img.alt="";

          avatarWrap.appendChild(img);

        }else{

          const avatar=document.createElement("div");

          avatar.className=
            "conversation-avatar-placeholder";

          avatar.textContent=
            (
              profile.display_name ||
              profile.username ||
              "N"
            ).charAt(0).toUpperCase();

          avatarWrap.appendChild(avatar);

        }


        const dot=document.createElement("span");

        dot.className="online-dot";

        avatarWrap.appendChild(dot);


        const main=document.createElement("div");

        main.className="conversation-main";


        const top=document.createElement("div");

        top.className="conversation-top";


        const name=document.createElement("div");

        name.className="conversation-name";

        name.textContent=
          profile.display_name ||
          profile.username;


        const time=document.createElement("div");

        time.className="conversation-time";

        time.textContent=
          formatMessageTime(message.created_at);


        top.appendChild(name);
        top.appendChild(time);


        const bottom=document.createElement("div");

        bottom.className="conversation-bottom";


        const preview=document.createElement("div");

        preview.className="conversation-preview";

        preview.textContent=message.content || "";


        bottom.appendChild(preview);

        main.appendChild(top);
        main.appendChild(bottom);

        element.appendChild(avatarWrap);
        element.appendChild(main);

        container.appendChild(element);

      }
    );

  }catch(error){

    console.error("loadConversations:",error);

    container.innerHTML=
      `<div class="search-empty">
        Ошибка загрузки сообщений.
      </div>`;

  }

}

function searchMessageUsers(){

  clearTimeout(messageSearchTimeout);

  messageSearchTimeout=
    setTimeout(
      performMessageUserSearch,
      250
    );

}


async function performMessageUserSearch(){

  const input =
    document.getElementById("messageSearchInput");

  const results =
    document.getElementById("messageSearchResults");

  const conversations =
    document.getElementById("conversations");


  if(!input || !results || !conversations)return;


  const query=input.value.trim();


  if(!query){

    results.style.display="none";
    conversations.style.display="block";

    await loadConversations();

    return;

  }


  const safeQuery =
    query.replace(/[,*()]/g,"").trim();


  if(!safeQuery){

    results.style.display="block";
    conversations.style.display="none";

    results.innerHTML=
      `<div class="search-empty">
        Введи имя или username
      </div>`;

    return;

  }


  results.style.display="block";
  conversations.style.display="none";

  results.innerHTML=
    `<div class="search-empty">Ищем...</div>`;


  try{

    const pattern="*"+safeQuery+"*";


    const url =
      SUPABASE_URL+
      "/rest/v1/profiles"+
      "?or="+
      encodeURIComponent(
        "(username.ilike."+pattern+
        ",display_name.ilike."+pattern+")"
      )+
      "&select=id,username,display_name,avatar_url"+
      "&limit=20";


    const response =
      await fetch(
        url,
        {
          headers:authHeaders()
        }
      );


    if(!response.ok){

      results.innerHTML=
        `<div class="search-empty">
          Ошибка поиска.
        </div>`;

      return;

    }


    const profiles=await response.json();

    const currentUserId=
      localStorage.getItem("user_id");


    const filtered=
      profiles.filter(
        profile=>profile.id!==currentUserId
      );


    results.innerHTML="";


    if(!filtered.length){

      results.innerHTML=
        `<div class="search-empty">
          Пользователей не найдено.
        </div>`;

      return;

    }


    filtered.forEach(profile=>{

      const element=document.createElement("div");

      element.className="message-user-result";

      element.onclick=()=>{
        openChatWithUser(profile);
      };


      if(profile.avatar_url){

        const img=document.createElement("img");

        img.className="message-result-avatar";
        img.src=profile.avatar_url;
        img.alt="";

        element.appendChild(img);

      }else{

        const placeholder=document.createElement("div");

        placeholder.className="message-result-placeholder";

        placeholder.textContent=
          (
            profile.display_name ||
            profile.username ||
            "N"
          ).charAt(0).toUpperCase();

        element.appendChild(placeholder);

      }


      const info=document.createElement("div");


      const name=document.createElement("div");

      name.className="search-user-name";
      name.textContent=
        profile.display_name ||
        profile.username;


      const username=document.createElement("div");

      username.className="search-user-username";
      username.textContent="@"+profile.username;


      info.appendChild(name);
      info.appendChild(username);

      element.appendChild(info);
      results.appendChild(element);

    });

  }catch(error){

    console.error("Message search:",error);

    results.innerHTML=
      `<div class="search-empty">
        Ошибка поиска.
      </div>`;

  }

}

/* ================= LOAD CHAT ================= */

async function loadChatMessages(){

  if(!currentChatUser)return;


  const currentUserId=
    localStorage.getItem("user_id");

  const otherUserId=
    currentChatUser.id;


  if(!currentUserId)return;


  const container=
    document.getElementById("chatMessages");


  try{

    const filter =
      "or="+
      encodeURIComponent(
        "(and(sender_id.eq."+currentUserId+
        ",receiver_id.eq."+otherUserId+
        "),and(sender_id.eq."+otherUserId+
        ",receiver_id.eq."+currentUserId+"))"
      );


    const response =
      await fetch(
        SUPABASE_URL+
        "/rest/v1/messages?"+
        filter+
        "&select=*"+
        "&order=created_at.asc",
        {
          headers:authHeaders()
        }
      );


    if(!response.ok){

      console.error(
        "loadChatMessages:",
        await response.text()
      );

      container.innerHTML=
        `<div class="chat-empty">
          Не удалось загрузить переписку.
        </div>`;

      return;

    }


    const messages=await response.json();

    container.innerHTML="";


    if(!messages.length){

      container.innerHTML=
        `<div class="chat-empty">
          Здесь пока пусто.<br>
          Напиши первое сообщение.
        </div>`;

      return;

    }


    messages.forEach(message=>{
      renderChatMessage(
        message,
        currentUserId
      );
    });


    scrollChatToBottom();

  }catch(error){

    console.error("loadChatMessages:",error);

    container.innerHTML=
      `<div class="chat-empty">
        Ошибка загрузки переписки.
      </div>`;

  }

}


function renderChatMessage(message,currentUserId){

  const container=
    document.getElementById("chatMessages");


  const row=document.createElement("div");

  const mine=
    message.sender_id===currentUserId;


  row.className=
    "message-row "+(mine ? "mine" : "theirs");


  const bubble=document.createElement("div");

  bubble.className="message-bubble";

  bubble.textContent=message.content;


  const time=document.createElement("div");

  time.className="message-time";

  time.textContent=
    formatChatTime(message.created_at);


  bubble.appendChild(time);
  row.appendChild(bubble);

  container.appendChild(row);

}


function scrollChatToBottom(){

  const container=
    document.getElementById("chatMessages");

  if(container){
    container.scrollTop=container.scrollHeight;
  }

}


/* ================= SEND MESSAGE ================= */

async function sendMessage(){

  if(!currentChatUser)return;


  const input=
    document.getElementById("chatInput");


  const content=input.value.trim();

  if(!content)return;


  const senderId=
    localStorage.getItem("user_id");

  const receiverId=
    currentChatUser.id;


  if(!senderId || !receiverId)return;


  input.disabled=true;


  try{

    const response =
      await fetch(
        SUPABASE_URL+
        "/rest/v1/messages",
        {
          method:"POST",
          headers:{
            ...authHeaders(),
            "Prefer":"return=representation"
          },
          body:JSON.stringify({
            sender_id:senderId,
            receiver_id:receiverId,
            content
          })
        }
      );


    if(!response.ok){

      alert(
        "Не удалось отправить сообщение:\n"+
        await response.text()
      );

      return;

    }


    input.value="";

    await loadChatMessages();

  }catch(error){

    console.error("sendMessage:",error);

    alert("Ошибка отправки сообщения.");

  }finally{

    input.disabled=false;
    input.focus();

  }

}


function handleChatKey(event){

  if(
    event.key==="Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();
    sendMessage();

  }

}


function startChatPolling(){

  stopChatPolling();


  chatPolling=
    setInterval(
      async()=>{

        const chatPage=
          document.getElementById("chatPage");


        if(
          currentChatUser &&
          chatPage &&
          chatPage.classList.contains("active")
        ){

          await loadChatMessages();

        }

      },
      3000
    );

}


function stopChatPolling(){

  if(chatPolling){

    clearInterval(chatPolling);
    chatPolling=null;

  }

}


function closeChat(){

  stopChatPolling();

  currentChatUser=null;


  const search=
    document.getElementById("messageSearchInput");


  if(search){
    search.value="";
  }


  const results=
    document.getElementById("messageSearchResults");


  if(results){
    results.style.display="none";
  }


  const conversations=
    document.getElementById("conversations");


  if(conversations){
    conversations.style.display="block";
  }


  showPage("messages");

}


/* ================= TIME ================= */

function formatMessageTime(dateString){

  const date=new Date(dateString);
  const now=new Date();


  if(
    date.toDateString()===
    now.toDateString()
  ){

    return date.toLocaleTimeString(
      "ru-RU",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

  }


  const yesterday=new Date(now);

  yesterday.setDate(
    now.getDate()-1
  );


  if(
    date.toDateString()===
    yesterday.toDateString()
  ){

    return "Вчера";

  }


  return date.toLocaleDateString(
    "ru-RU",
    {
      day:"2-digit",
      month:"2-digit"
    }
  );

}


function formatChatTime(dateString){

  return new Date(dateString)
    .toLocaleTimeString(
      "ru-RU",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}

  if(page==="search"){

  if(page==="messages"){

    document.getElementById("messagesPage")
      .classList.add("active");

    document.getElementById("messagesNav")
      .classList.add("active");

    loadConversations();
    return;

  }


  if(page==="chat"){

  if(page==="profile"){

      "Не удалось загрузить профиль пользователя."
    );

  }


  showPage("feed");

}


function showAuth(){

  stopChatPolling();

  currentChatUser=null;
  publicProfile=null;

  document.getElementById("authScreen")
    .style.display="flex";

  document.getElementById("app")
    .style.display="none";

  showAuthChoice();

}


/* ================= PROFILES MAP ================= */

async function loadProfilesMap(){

  try{

    const response =
      await fetch(
        SUPABASE_URL+
        "/rest/v1/profiles"+
        "?select=id,username,display_name,avatar_url",
        {
          headers:authHeaders()
        }
      );


    if(!response.ok){

      console.error(
        "loadProfilesMap:",
        await response.text()
      );

      return {};

    }


    const profiles=await response.json();

    const map={};


    profiles.forEach(profile=>{
      map[profile.id]=profile;
    });


    return map;

  }catch(error){

    console.error("loadProfilesMap:",error);

    return {};

  }

}


/* ================= POSTS ================= */

async function loadPosts(){

  const feed=document.getElementById("feed");

  if(!feed)return;


  try{

    const response =
      await fetch(
        SUPABASE_URL+
        "/rest/v1/posts?select=*&order=created_at.desc",
        {
          headers:authHeaders()
        }
      );


    if(!response.ok){

      feed.innerHTML=
        `<div class="wall-empty">
          Не удалось загрузить ленту.
        </div>`;

      return;

    }


    const posts=await response.json();

    const profiles=await loadProfilesMap();

    feed.innerHTML="";


    if(!posts.length){

      feed.innerHTML=
        `<div class="wall-empty">
          Пока нет постов.
        </div>`;

      return;

    }


    posts.forEach(post=>{
      renderPost(post,feed,profiles);
    });

  }catch(error){

    console.error("loadPosts:",error);

    feed.innerHTML=
      `<div class="wall-empty">
        Ошибка загрузки ленты.
      </div>`;

  }

}


function renderPost(post,container,profiles){

  const reaction=
    localStorage.getItem(
      "reaction_"+post.id
    );


  const profile=
    profiles[post.user_id];


  const username=
    profile?.username ||
    post.username ||
    "user";


  const displayName=
    profile?.display_name ||
    username;


  const avatar=
    profile?.avatar_url;


  const div=document.createElement("div");

  div.className="post";


  const user=document.createElement("div");

  user.className="post-user";


  if(avatar){

    const img=document.createElement("img");

    img.className="mini-avatar";
    img.src=avatar;
    img.alt="";

    user.appendChild(img);

  }else{

    const placeholder=document.createElement("div");

    placeholder.className="mini-avatar-placeholder";

    placeholder.textContent=
      displayName.charAt(0).toUpperCase();

    user.appendChild(placeholder);

  }


  const userInfo=document.createElement("div");


  const name=document.createElement("div");

  name.className="user-name";
  name.textContent=displayName;


  const usernameEl=document.createElement("div");

  usernameEl.className="post-date";
  usernameEl.textContent="@"+username;


  userInfo.appendChild(name);
  userInfo.appendChild(usernameEl);

  user.appendChild(userInfo);


  const text=document.createElement("div");

  text.className="post-text";
  text.textContent=post.content;


  const actions=document.createElement("div");

  actions.className="actions";


  const likeButton=document.createElement("button");

  likeButton.className=
    "reaction-btn"+
    (reaction==="like" ? " active" : "");

  likeButton.textContent=
    "👍 "+Number(post.likes || 0);

  likeButton.onclick=()=>{
    reactToPost(
      Number(post.id),
      "like"
    );
  };


  const dislikeButton=document.createElement("button");

  dislikeButton.className=
    "reaction-btn"+
    (reaction==="dislike" ? " active" : "");

  dislikeButton.textContent=
    "👎 "+Number(post.dislikes || 0);

  dislikeButton.onclick=()=>{
    reactToPost(
      Number(post.id),
      "dislike"
    );
  };


  actions.appendChild(likeButton);
  actions.appendChild(dislikeButton);

  div.appendChild(user);
  div.appendChild(text);
  div.appendChild(actions);

  container.appendChild(div);

}


/* ================= CREATE POSTS ================= */

async function createPost(){

  const input=
    document.getElementById("postInput");


  const text=input.value.trim();

  if(!text)return;


  const success=
    await createPostInDatabase(text);


  if(!success)return;


  input.value="";

  await loadPosts();

}


async function createWallPost(){

  const input=
    document.getElementById("wallInput");


  const text=input.value.trim();

  if(!text)return;


  const success=
    await createPostInDatabase(text);


  if(!success)return;


  input.value="";

  await loadWall();

}


async function createPostInDatabase(text){

  const userId=
    localStorage.getItem("user_id");


  if(!userId){

    alert("Нужно войти в аккаунт.");
    return false;

  }


  const username=
    window.currentProfile?.username ||
    "you";


  try{

    const response =
      await fetch(
        SUPABASE_URL+
        "/rest/v1/posts",
        {
          method:"POST",
          headers:{
            ...authHeaders(),
            "Prefer":"return=representation"
          },
          body:JSON.stringify({
            user_id:userId,
            username,
            content:text
          })
        }
      );


    if(!response.ok){

      alert(
        "Не удалось опубликовать пост:\n"+
        await response.text()
      );

      return false;

    }


    return true;

  }catch(error){

    console.error("createPost:",error);

    alert("Ошибка соединения с сервером.");

    return false;

  }

}


/* ================= WALL ================= */

async function loadWall(){

  const userId=
    localStorage.getItem("user_id");

  const wall=
    document.getElementById("wall");


  if(!userId || !wall)return;


  try{

    const response =
      await fetch(
        SUPABASE_URL+
        "/rest/v1/posts?user_id=eq."+
        encodeURIComponent(userId)+
        "&select=*&order=created_at.desc",
        {
          headers:authHeaders()
        }
      );


    if(!response.ok){

      wall.innerHTML=
        `<div class="wall-empty">
          Не удалось загрузить стену.
        </div>`;

      return;

    }


    const posts=await response.json();
    const profiles=await loadProfilesMap();

    wall.innerHTML="";


    if(!posts.length){

      wall.innerHTML=
        `<div class="wall-empty">
          На стене пока ничего нет.
        </div>`;

      return;

    }


    posts.forEach(post=>{
      renderPost(post,wall,profiles);
    });

  }catch(error){

    console.error("loadWall:",error);

    wall.innerHTML=
      `<div class="wall-empty">
        Ошибка загрузки стены.
      </div>`;

  }

}


/* ================= REACTIONS ================= */

async function reactToPost(postId,type){

  const oldReaction=
    localStorage.getItem(
      "reaction_"+postId
    );


  let likeChange=0;
  let dislikeChange=0;
  let newReaction=type;


  if(oldReaction===type){

    newReaction=null;

    if(type==="like"){
      likeChange=-1;
    }else{
      dislikeChange=-1;
    }

  }else{

    if(oldReaction==="like"){
      likeChange=-1;
    }

    if(oldReaction==="dislike"){
      dislikeChange=-1;
    }

    if(type==="like"){
      likeChange++;
    }else{
      dislikeChange++;
    }

  }


  try{

    const getResponse =
      await fetch(
        SUPABASE_URL+
        "/rest/v1/posts?id=eq."+
        encodeURIComponent(postId)+
        "&select=likes,dislikes",
        {
          headers:authHeaders()
        }
      );


    if(!getResponse.ok){

      alert("Не удалось получить реакцию.");
      return;

    }


    const rows=await getResponse.json();

    if(!rows.length)return;


    const post=rows[0];


    const newLikes=
      Math.max(
        0,
        Number(post.likes || 0)+likeChange
      );


    const newDislikes=
      Math.max(
        0,
        Number(post.dislikes || 0)+dislikeChange
      );


    const updateResponse =
      await fetch(
        SUPABASE_URL+
        "/rest/v1/posts?id=eq."+
        encodeURIComponent(postId),
        {
          method:"PATCH",
          headers:{
            ...authHeaders(),
            "Prefer":"return=representation"
          },
          body:JSON.stringify({
            likes:newLikes,
            dislikes:newDislikes
          })
        }
      );


    if(!updateResponse.ok){

      alert(
        "Не удалось сохранить реакцию:\n"+
        await updateResponse.text()
      );

      return;

    }


    if(newReaction){

      localStorage.setItem(
        "reaction_"+postId,
        newReaction
      );

    }else{

      localStorage.removeItem(
        "reaction_"+postId
      );

    }


    await loadPosts();


    if(
      document
        .getElementById("profilePage")
        .classList
        .contains("active")
    ){

      await loadWall();

    }


    if(
      publicProfile &&
      document
        .getElementById("publicProfilePage")
        .classList
        .contains("active")
    ){

      await loadPublicWall(
        publicProfile.id
      );

    }

  }catch(error){

    console.error("reactToPost:",error);

    alert("Ошибка соединения с сервером.");

  }

}


/* ================= ESCAPE ================= */

function escapeHtml(text){

  const div=document.createElement("div");

  div.textContent=
    text==null
      ? ""
      : String(text);

  return div.innerHTML;

}


/* ================= AUTH ENTER ================= */

document.addEventListener(
  "keydown",
  event=>{

    if(
      event.key!=="Enter" ||
      event.shiftKey
    ){

      return;

    }


    const target=event.target;


    if(
      target &&
      target.tagName==="TEXTAREA"
    ){

      return;

    }


    const loginVisible=
      document.getElementById("loginForm")
        .style.display==="block";


    const signupVisible=
      document.getElementById("signupForm")
        .style.display==="block";


    if(loginVisible){

      event.preventDefault();
      signIn();

    }else if(signupVisible){

      event.preventDefault();
      signUp();

    }

  }
);


/* ================= MODAL OUTSIDE CLICK ================= */

document.getElementById("profileModal")
  .addEventListener(
    "click",
    event=>{

      if(event.target.id==="profileModal"){
        closeProfileEditor();
      }

    }
  );


/* ================= START ================= */

async function startApp(){

  const valid=
    await validateSession();


  if(valid){

    await showApp();

  }else{

    showAuth();

  }

}


startApp();
